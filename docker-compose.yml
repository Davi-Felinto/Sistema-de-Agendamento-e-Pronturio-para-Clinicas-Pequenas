services:
  # ==============================================================================
  # BANCO DE DADOS RELACIONAL (MySQL 8.0)
  # Inicializa o schema DDL (15 tabelas) e os dados iniciais de seed automaticamente
  # ==============================================================================
  mysql:
    image: mysql:8.0
    container_name: clinix-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clinix_db
    ports:
      # Mapeia porta 3307 no Windows para 3306 no container (evita conflito com MySQL local do Windows)
      - "3307:3306"
    volumes:
      - ./bancodedadosclinica/01_schema_ddl.sql:/docker-entrypoint-initdb.d/01_schema_ddl.sql:ro
      - ./bancodedadosclinica/02_dados_iniciais.sql:/docker-entrypoint-initdb.d/02_dados_iniciais.sql:ro
      - clinix_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==============================================================================
  # API BACKEND & WEB APP (ASP.NET Core .NET 8)
  # Serve a Web API REST e a interface web completa na mesma porta
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinix-api
    restart: unless-stopped
    ports:
      - "5055:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ClinixDb=Server=mysql;Port=3306;Database=clinix_db;Uid=root;Pwd=root;
    volumes:
      - ./src/ClinicaApp.Api/wwwroot:/app/wwwroot:ro
    depends_on:
      mysql:
        condition: service_healthy

  # ==============================================================================
  # INTERFACE VISUAL DO BANCO (phpMyAdmin)
  # Permite ao Miguel e à equipe inspecionar tabelas e dados via navegador
  # ==============================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clinix-pma
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  clinix_mysql_data:
    name: clinix_mysql_data

