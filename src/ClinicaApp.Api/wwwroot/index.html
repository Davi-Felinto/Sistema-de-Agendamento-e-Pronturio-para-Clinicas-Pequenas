    /* =========================================================================
       CAMADA DE INTEGRA├ç├âO COM A API BACKEND (.NET C# / Bloco 5)
       Comunica com os Controllers em /api (ASP.NET Core) e possui fallback
       gracioso para localStorage quando executado offline ou no GitHub Pages.
       ========================================================================= */
    const api = {
      isConnected: false,

      // RF26 - Token JWT devolvido pelo login. Fica em sessionStorage (some ao fechar a aba)
      // e ├® enviado no cabe├ºalho Authorization de todas as chamadas protegidas.
      token: (() => { try { return sessionStorage.getItem('clinix_token'); } catch { return null; } })(),

      setToken(token) {
        this.token = token || null;
        try {
          if (this.token) sessionStorage.setItem('clinix_token', this.token);
          else sessionStorage.removeItem('clinix_token');
        } catch { /* sessionStorage indispon├¡vel: o token fica s├│ em mem├│ria */ }
      },

      authHeaders(extra = {}) {
        return this.token ? { ...extra, 'Authorization': `Bearer ${this.token}` } : extra;
      },

      async checkHealth() {
        try {
          const res = await fetch('/api/health', { method: 'GET', headers: { 'Accept': 'application/json' } });
          this.isConnected = res.ok;
          return res.ok;
        } catch {
          this.isConnected = false;
          return false;
        }
      },

      // --- PACIENTES (RF01-RF05, RN16) ---
      async listarPacientes() {
        try {
          const res = await fetch('/api/pacientes', { headers: this.authHeaders() });
          if (!res.ok) throw new Error('Falha ao listar pacientes');
          const data = await res.json();
          this.isConnected = true;
          return {
            sucesso: true,
            dados: data.map(p => ({
              id: String(p.id),
              nome: p.nome,
              cpf: p.documentoIdentificacao || p.cpf || '',
              nascimento: p.dataNascimento ? p.dataNascimento.split('T')[0] : (p.nascimento || ''),
              telefone: p.telefone || '',
              email: p.email || '',
              endereco: p.endereco || '',
              alergias: p.alergias || '',
              condicoesPreexistentes: p.condicoesPreexistentes || '',
              status: p.ativo !== undefined ? (p.ativo ? 'ativo' : 'inativo') : (p.status || 'ativo'),
              profissionalId: 'u1'
            }))
          };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async criarPaciente(dados) {
        try {
          const res = await fetch('/api/pacientes', {
            method: 'POST',
            headers: this.authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({
              nome: dados.nome,
              documentoIdentificacao: dados.cpf,
              dataNascimento: dados.nascimento ? new Date(dados.nascimento).toISOString() : new Date().toISOString(),
              telefone: dados.telefone,
              email: dados.email,
              endereco: dados.endereco,
              alergias: dados.alergias,
              condicoesPreexistentes: dados.condicoesPreexistentes
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            const validacao = err.errors ? Object.values(err.errors).flat()[0] : null;
            return { sucesso: false, erro: err.erro || err.mensagem || validacao || 'Erro ao cadastrar paciente' };
          }
          const p = await res.json();
          return {
            sucesso: true,
            dados: {
              id: String(p.id),
              nome: p.nome,
              cpf: p.documentoIdentificacao || dados.cpf,
              nascimento: p.dataNascimento ? p.dataNascimento.split('T')[0] : dados.nascimento,
              telefone: p.telefone,
              email: p.email,
              endereco: p.endereco,
              alergias: p.alergias,
              condicoesPreexistentes: p.condicoesPreexistentes,
              status: p.ativo ? 'ativo' : 'inativo',
              profissionalId: dados.profissionalId || 'u1'
            }
          };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async inativarPaciente(id) {
        try {
          const numId = Number(id);
          if (!isNaN(numId)) {
            const res = await fetch(`/api/pacientes/${numId}/inativar`, { method: 'PUT', headers: this.authHeaders() });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              return { sucesso: false, erro: err.erro || err.mensagem || 'Erro ao inativar paciente' };
            }
          }
          return { sucesso: true };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      // --- AGENDAMENTOS (RF06-RF11, RN01, RN02, RN10) ---
      async listarAgendamentos() {
        try {
          const res = await fetch('/api/agendamentos', { headers: this.authHeaders() });
          if (!res.ok) throw new Error('Falha ao listar agendamentos');
          const data = await res.json();
          this.isConnected = true;
          return {
            sucesso: true,
            dados: data.map(a => {
              const inicioStr = a.dataHoraInicio || '';
              const fimStr = a.dataHoraFim || '';
              const dataStr = inicioStr ? inicioStr.split('T')[0] : getTodayDateStr();
              const horaStr = inicioStr ? inicioStr.split('T')[1].slice(0, 5) : '09:00';
              const duracaoMin = (inicioStr && fimStr)
                ? Math.round((new Date(fimStr) - new Date(inicioStr)) / 60000)
                : 60;
              let statusStr = 'confirmado';
              if (a.status === 4 || a.status === 'Cancelado') statusStr = 'cancelado';
              else if (a.status === 3 || a.status === 'Remarcado') statusStr = 'remarcado';
              else if (a.status === 1 || a.status === 'Pendente') statusStr = 'pendente';

              return {
                id: String(a.id),
                pacienteId: String(a.pacienteId),
                profissionalId: a.profissionalId === 1 ? 'u1' : `u${a.profissionalId}`,
                data: dataStr,
                horario: horaStr,
                duracaoMin,
                status: statusStr,
                tipo: 'consulta',
                observacoes: a.observacoes || 'Consulta de rotina',
                valor: 200,
                statusPagamento: 'pendente',
                formaPagamento: 'Em aberto',
                notificacaoStatus: 'enviado',
                notificacaoTentativas: 1,
                cancelamentoTardio: Boolean(a.cancelamentoTardio)
              };
            })
          };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async agendarConsulta(dados) {
        try {
          const inicioDate = `${dados.data}T${dados.horario}:00`;
          const inicio = new Date(inicioDate);
          const duracaoMin = dados.duracaoMin || 60;
          const fim = new Date(inicio.getTime() + duracaoMin * 60000);
          const fimIso = `${dados.data}T${String(fim.getHours()).padStart(2, '0')}:${String(fim.getMinutes()).padStart(2, '0')}:00`;

          const pacienteIdNum = typeof dados.pacienteId === 'number'
            ? dados.pacienteId
            : (parseInt(String(dados.pacienteId).replace(/\D/g, ''), 10) || 1);

          const profissionalIdNum = typeof dados.profissionalId === 'number'
            ? dados.profissionalId
            : (parseInt(String(dados.profissionalId).replace(/\D/g, ''), 10) || 1);

          const res = await fetch('/api/agendamentos', {
            method: 'POST',
            headers: this.authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({
              pacienteId: pacienteIdNum,
              profissionalId: profissionalIdNum,
              dataHoraInicio: inicioDate,
              dataHoraFim: fimIso,
              observacoes: dados.observacoes || 'Consulta de rotina'
            })
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            // Mensagem de bloqueio por RN01/RN02 devolvida pelo AgendaService C#
            return {
              sucesso: false,
              erro: err.erro || err.mensagem || 'Hor├írio indispon├¡vel: conflito de hor├írio identificado (RN01, RN02).'
            };
          }

          const criado = await res.json();
          return {
            sucesso: true,
            dados: {
              id: String(criado.id),
              pacienteId: dados.pacienteId,
              profissionalId: dados.profissionalId,
              data: dados.data,
              horario: dados.horario,
              duracaoMin,
              status: 'confirmado',
              tipo: 'consulta',
              observacoes: criado.observacoes || dados.observacoes,
              valor: dados.valor || 200,
              statusPagamento: 'pendente',
              formaPagamento: 'Em aberto',
              notificacaoStatus: 'enviado',
              notificacaoTentativas: 1,
              cancelamentoTardio: false
            }
          };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async cancelarAgendamento(id) {
        try {
          const numId = typeof id === 'number' ? id : parseInt(String(id).replace(/\D/g, ''), 10);
          if (!isNaN(numId)) {
            const res = await fetch(`/api/agendamentos/${numId}/cancelar`, { method: 'PUT', headers: this.authHeaders() });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              return { sucesso: false, erro: err.erro || err.mensagem || 'Erro ao cancelar consulta' };
            }
            const data = await res.json();
            return { sucesso: true, cancelamentoTardio: data.cancelamentoTardio };
          }
          return { sucesso: true };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      // --- AUTENTICA├ç├âO (RF26, RQ08) ---
      async login(login, senha) {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: this.authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ login, senha })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            return { sucesso: false, erro: err.erro || 'Login ou senha inv├ílidos.' };
          }
          const user = await res.json();
          this.setToken(user.token);
          return { sucesso: true, dados: user };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      }
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem('clinix_auth') === 'true';
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('clinix_user');
        return saved ? JSON.parse(saved) : INITIAL_USERS[0];
      });

      const [patients, setPatients] = useState(() => {
        const saved = localStorage.getItem('clinix_patients');
        return saved ? JSON.parse(saved) : INITIAL_PATIENTS;
      });

      const [appointments, setAppointments] = useState(() => {
        const saved = localStorage.getItem('clinix_appointments');
        return saved ? JSON.parse(saved) : INITIAL_APPOINTMENTS;
      });

      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('clinix_records');
        return saved ? JSON.parse(saved) : INITIAL_RECORDS;
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('clinix_logs');
        return saved ? JSON.parse(saved) : INITIAL_LOGS;
      });

      // Conex├úo em tempo real com a Web API ASP.NET Core
      const [isApiConnected, setIsApiConnected] = useState(false);

      useEffect(() => {
        async function conectarBackend() {
          const saudavel = await api.checkHealth();
          setIsApiConnected(saudavel);
          if (!saudavel || !isAuthenticated) return;

          // Com a API ativa, as rotas exigem o token do login: sem ele, volta para a tela de acesso
          if (!api.token) {
            setIsAuthenticated(false);
            return;
          }

          const resPac = await api.listarPacientes();
          if (!resPac.sucesso) {
            // Token expirado ou inv├ílido
            api.setToken(null);
            setIsAuthenticated(false);
            return;
          }
          if (resPac.dados.length > 0) {
            setPatients(resPac.dados);
          }
          const resAppt = await api.listarAgendamentos();
          if (resAppt.sucesso) {
            setAppointments(resAppt.dados);
          }
        }
        conectarBackend();
      }, [isAuthenticated]);

      // Navega├º├úo entre Telas: 'dashboard' | 'agenda' | 'pacientes' | 'prontuario' | 'financeiro' | 'logs'
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedPatientForRecord, setSelectedPatientForRecord] = useState(null);
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);
      const [loginError, setLoginError] = useState('');
      const [schedulePatientId, setSchedulePatientId] = useState(null);
      const [dialogConfig, setDialogConfig] = useState(null);
      const [showReqGuide, setShowReqGuide] = useState(false);
      const [showSearchModal, setShowSearchModal] = useState(false);
      const [showRequirementsModal, setShowRequirementsModal] = useState(false);

      // Atalho Global de Usabilidade: Ctrl+K / Cmd+K para Busca R├ípida (RQ10)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setShowSearchModal(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Persist├¬ncia local cont├¡nua
      useEffect(() => {
        localStorage.setItem('clinix_auth', isAuthenticated ? 'true' : 'false');
        localStorage.setItem('clinix_user', JSON.stringify(currentUser));
        localStorage.setItem('clinix_patients', JSON.stringify(patients));
        localStorage.setItem('clinix_appointments', JSON.stringify(appointments));
        localStorage.setItem('clinix_records', JSON.stringify(records));
        localStorage.setItem('clinix_logs', JSON.stringify(logs));
      }, [isAuthenticated, currentUser, patients, appointments, records, logs]);

      // Sistema centralizado de notifica├º├Áes em banner (sem alert nativo)
      const showToast = (message, type = 'success') => {
        clearTimeout(toastTimer.current);
        setToast({ message, type, id: Date.now() });
        toastTimer.current = setTimeout(() => setToast(null), 4000);
      };

      // Auditoria cont├¡nua (RF28, RN13, RQ07)
      const registerLog = (operacao, detalhes, user = currentUser) => {
        const newLog = {
          id: 'l_' + Date.now(),
          timestamp: new Date().toISOString(),
          usuarioId: user.id,
          usuarioNome: user.name,
          operacao,
          detalhes
        };
        setLogs(prev => [newLog, ...prev]);
      };

      // Regra de Usabilidade dos 3 Cliques (RQ10)
      const handleOpenProntuarioDirect = (patientId) => {
        const patient = patients.find(p => p.id === patientId);
        if (patient) {
          setSelectedPatientForRecord(patient);
          setActiveTab('prontuario');

    const LABEL_CLASS = 'block text-sm font-semibold text-slate-800 mb-1.5';

    const APPT_STATUS = {

    };

    // RF12-RF14, RN14, RN15 - Situa├º├úo do lembrete por WhatsApp
    const NOTIF_STATUS = {
      enviado: { label: 'Lembrete enviado', dot: 'bg-emerald-500' },
      reenviado: { label: 'Lembrete reenviado', dot: 'bg-sky-500' },
      falha: { label: 'Falha no envio', dot: 'bg-rose-500' },
      pendente: { label: 'Envio pendente', dot: 'bg-amber-500' }
    };

    const formatBRL = (value) => (Number(value) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    const parseDateStr = (dateStr) => new Date(`${dateStr}T12:00:00`);

    const formatDateBR = (dateStr, options) => {
      const date = parseDateStr(dateStr);
      return isNaN(date) ? dateStr : date.toLocaleDateString('pt-BR', options);
    };

    const shiftDateStr = (dateStr, days) => {
      const date = parseDateStr(dateStr);
      if (isNaN(date)) return dateStr;
      date.setDate(date.getDate() + days);
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    };

    const getAge = (dateStr) => {
      const birth = parseDateStr(dateStr);
      if (isNaN(birth)) return null;
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const hadBirthday = today.getMonth() > birth.getMonth() ||
        (today.getMonth() === birth.getMonth() && today.getDate() >= birth.getDate());
      if (!hadBirthday) age -= 1;
      return age;
    };

    const onlyDigits = (value) => (value || '').toString().replace(/\D/g, '');

    // CPF e telefone s├úo guardados s├│ com d├¡gitos e formatados na exibi├º├úo
    const formatCpf = (value) => {
      const digits = onlyDigits(value);
      return digits.length === 11 ? digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : (value || '');
    };

    const formatPhone = (value) => {
      const digits = onlyDigits(value);
      return digits.length === 11 ? digits.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3') : (value || '');
    };

    const CLINICAL_MAX_LENGTH = 70;
    const CLINICAL_PREVIEW_LENGTH = 50;
    const truncateText = (value, max) => {
      const text = (value || '').toString();
      return text.length > max ? `${text.slice(0, max)}ÔÇª` : text;
    };

    const EMAIL_REGEX = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

    const timeToMinutes = (time) => {
      const [hours, minutes] = time.split(':').map(Number);
      return hours * 60 + minutes;
    };

    // Uma consulta n├úo pode come├ºar em um hor├írio que j├í passou
    const isPastSlot = (dateStr, time) => new Date(`${dateStr}T${time}:00`) < new Date();

    // RN01, RN02 - Conflito por sobreposi├º├úo de intervalos, e n├úo s├│ pelo mesmo hor├írio de in├¡cio
    const findOverlap = (appointments, { data, horario, duracaoMin = 60, profissionalId, ignoreId }) => {
      const start = timeToMinutes(horario);
      const end = start + duracaoMin;
      return appointments.find(a => {
        if (a.id === ignoreId || a.status === 'cancelado') return false;
        if (a.data !== data || a.profissionalId !== profissionalId) return false;
        const otherStart = timeToMinutes(a.horario);
        const otherEnd = otherStart + (a.duracaoMin || 60);
        return start < otherEnd && end > otherStart;
      });
    };

    // Escapa aspas e neutraliza f├│rmulas (=, +, -, @) para o CSV n├úo executar nada no Excel
    const csvCell = (value) => {
      let text = (value === null || value === undefined) ? '' : String(value);
      if (/^[=+\-@\t\r]/.test(text)) text = `'${text}`;
      return `"${text.replace(/"/g, '""')}"`;
    };

    const getNameInitials = (name) => {
      const parts = (name || '').replace(/^Dra?\.\s+/i, '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '?';
      return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    };

    function StatusBadge({ label, className }) {
      return (
        <span className={`inline-flex items-center whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-semibold ring-1 ring-inset ${className}`}>
          {label}
        </span>
      );
    }

    function Modal({ title, onClose, maxWidth = 'max-w-md', children }) {
      const titleId = React.useId();

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby={titleId}
            className={`bg-white rounded-2xl ${maxWidth} w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto`}
          >
            <div className="flex items-center justify-between gap-4 pb-4 border-b border-slate-200">
              <h3 id={titleId} className="text-base font-bold text-slate-900">{title}</h3>
              <button
                type="button"
                onClick={onClose}
                aria-label="Fechar"
                className="w-9 h-9 -mr-2 inline-flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 outline-none focus-visible:ring-4 focus-visible:ring-slate-400/40"
              >
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function DashboardView({ appointments, patients, records, currentUser, onNavigate, onOpenProntuario }) {
      const [period, setPeriod] = useState('semana'); // 'semana' | 'mes'

      const todayStr = getTodayDateStr();
      const todayAppointments = appointments
        .filter(a => a.data === todayStr && a.status !== 'cancelado')
        .sort((a, b) => a.horario.localeCompare(b.horario));
      const todayConsultas = todayAppointments.filter(a => a.tipo !== 'bloqueio');
      const pendingPayments = appointments.filter(a => a.statusPagamento === 'pendente');
      const failedNotifications = appointments.filter(a => a.notificacaoStatus === 'falha');
      const lateCancellations = appointments.filter(a => a.cancelamentoTardio);

      const nowTime = new Date().toTimeString().slice(0, 5);
      const nextAppt = todayConsultas.find(a => a.horario >= nowTime);
      const nextPatient = nextAppt ? patients.find(p => p.id === nextAppt.pacienteId) : null;
      const pendingTotal = pendingPayments.reduce((acc, curr) => acc + (Number(curr.valor) || 0), 0);

      const periodDays = useMemo(() => {
        if (period === 'mes') {
          const [year, month] = todayStr.split('-').map(Number);
          const daysInMonth = new Date(year, month, 0).getDate();
          return Array.from({ length: daysInMonth }, (_, i) => `${todayStr.slice(0, 7)}-${String(i + 1).padStart(2, '0')}`);
        }
        const weekStart = shiftDateStr(todayStr, -parseDateStr(todayStr).getDay());
        return Array.from({ length: 7 }, (_, i) => shiftDateStr(weekStart, i));
      }, [period, todayStr]);

      const periodLabel = period === 'mes' ? 'Este m├¬s' : 'Esta semana';
      const periodSet = new Set(periodDays);
      const periodConsultas = appointments.filter(a => a.tipo !== 'bloqueio' && periodSet.has(a.data));
      const keptConsultas = periodConsultas.filter(a => a.status !== 'cancelado');
      const paidConsultas = keptConsultas.filter(a => a.statusPagamento === 'pago');

      const funnel = [
        ['Agendadas', periodConsultas.length],
        ['Mantidas', keptConsultas.length],
        ['Lembrete entregue', keptConsultas.filter(a => ['enviado', 'reenviado'].includes(a.notificacaoStatus)).length],
        ['Pagas', paidConsultas.length]
      ];

      const chartData = periodDays.map(date => ({
        date,
        ativas: keptConsultas.filter(a => a.data === date).length,
        canceladas: periodConsultas.filter(a => a.data === date && a.status === 'cancelado').length
      }));
      const axisMax = Math.max(4, Math.ceil(Math.max(...chartData.map(d => d.ativas + d.canceladas)) / 2) * 2);

      // RF22, RN09 - Recebimentos do per├¡odo por forma de pagamento
      const paymentTotals = Object.entries(
        paidConsultas.reduce((acc, a) => {
          const key = a.formaPagamento || 'N├úo informada';
          acc[key] = (acc[key] || 0) + (Number(a.valor) || 0);
          return acc;
        }, {})
      ).sort((a, b) => b[1] - a[1]);
      const paymentMax = paymentTotals.length > 0 ? paymentTotals[0][1] : 0;

      const pendencias = [
        {
          icon: 'alert',
          title: 'Lembretes n├úo entregues',
          description: 'Reenvie pela agenda ou avise o paciente por telefone',
          count: failedNotifications.length,
          tab: 'agenda'
        },
        {
          icon: 'wallet',
          title: 'Cobran├ºas pendentes',
          description: pendingPayments.length > 0 ? `${formatBRL(pendingTotal)} a receber` : 'Nenhum valor em aberto',
          count: pendingPayments.length,
          tab: 'financeiro'
        },
        {
          icon: 'clock',
          title: 'Cancelamentos tardios',
          description: 'Consultas canceladas com menos de 24 horas',

              </button>

          </section>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <MetricCard
              label="Consultas hoje"
              value={todayConsultas.length}
              subtext={nextAppt ? `Pr├│xima ├ás ${nextAppt.horario}` : 'Sem pr├│ximas hoje'}
              icon="calendar"
            />
            <MetricCard
              label="Pacientes ativos"
              value={patients.filter(p => p.status === 'ativo').length}
              subtext={`${patients.length} cadastrados`}
              icon="users"
            />
            <MetricCard
              label="A receber"
              value={formatBRL(pendingTotal)}
              subtext={`${pendingPayments.length} ${pendingPayments.length === 1 ? 'cobran├ºa pendente' : 'cobran├ºas pendentes'}`}
              icon="wallet"
            />
            <MetricCard
              label="Sess├Áes registradas"

            />
          </div>

          <div className="grid lg:grid-cols-2 gap-5 items-start">
            <section className="bg-white rounded-2xl border border-slate-200 p-5">
              <h3 className="text-base font-bold text-slate-900">Do agendamento ao pagamento</h3>
              <p className="text-xs text-slate-500 mt-0.5">{periodLabel}</p>

              {periodConsultas.length === 0 ? (

              ) : (
                <dl className="mt-4 space-y-3">
                  {funnel.map(([label, count]) => {

            <section className="bg-white rounded-2xl border border-slate-200 p-5">

                      <StatusBadge
                        label={String(item.count)}

                    </button>

          </div>

          <section className="bg-white rounded-2xl border border-slate-200 p-5">

              <div>
                <h3 className="text-base font-bold text-slate-900">Consultas por dia</h3>
                <p className="text-xs text-slate-500 mt-0.5">{periodLabel}</p>
              </div>
              <ul className="flex items-center gap-4 text-xs text-slate-700">
                <li className="inline-flex items-center gap-1.5">
                  <span aria-hidden="true" className="w-2.5 h-2.5 rounded-sm bg-emerald-600"></span>
                  Mantidas
                </li>
                <li className="inline-flex items-center gap-1.5">
                  <span aria-hidden="true" className="w-2.5 h-2.5 rounded-sm bg-[#4a3aa7]"></span>
                  Canceladas
                </li>
              </ul>
            </div>

            <div className="mt-8 flex gap-3">
              <div aria-hidden="true" className="w-5 h-44 flex flex-col justify-between text-right text-xs tabular-nums text-slate-500 -my-2">
                <span>{axisMax}</span>
                <span>{axisMax / 2}</span>
                <span>0</span>
              </div>

              <div className="relative flex-1 h-44">
                <div aria-hidden="true" className="absolute inset-0 flex flex-col justify-between">
                  <span className="border-t border-slate-100"></span>
                  <span className="border-t border-slate-100"></span>
                  <span className="border-t border-slate-300"></span>

                <div className="absolute inset-0 flex items-end">
                  {chartData.map((day, index) => {

                    return (
                      <div

                        tabIndex={0}
                        aria-label={`${formatDateBR(day.date, { weekday: 'long', day: 'numeric', month: 'long' })}: ${day.ativas} mantidas, ${day.canceladas} canceladas`}
                        className="group relative flex-1 h-full flex flex-col items-center justify-end rounded-t-lg outline-none hover:bg-slate-50 focus-visible:bg-slate-50 focus-visible:ring-2 focus-visible:ring-emerald-500/50"
                      >
                        {day.canceladas > 0 && (
                          <span
                            className={`w-full max-w-[24px] rounded-t bg-[#4a3aa7] ${day.ativas > 0 ? 'mb-0.5' : ''}`}
                            style={{ height: `${(day.canceladas / axisMax) * 100}%` }}
                          ></span>

                        {day.ativas > 0 && (
                          <span
                            className={`w-full max-w-[24px] bg-emerald-600 ${day.canceladas > 0 ? '' : 'rounded-t'}`}
                            style={{ height: `${(day.ativas / axisMax) * 100}%` }}
                          ></span>
                        )}

                        <div
                          aria-hidden="true"
                          className={`pointer-events-none absolute top-0 -translate-y-full z-10 hidden group-hover:block group-focus-visible:block whitespace-nowrap rounded-lg bg-slate-900 px-3 py-2 text-xs text-white shadow-lg ${tooltipAlign}`}
                        >
                          <p className="font-bold first-letter:uppercase">
                            {formatDateBR(day.date, { weekday: 'short', day: '2-digit', month: '2-digit' })}
                          </p>
                          <p className="mt-1 flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-sm bg-emerald-500"></span>
                            Mantidas: <span className="font-bold tabular-nums">{day.ativas}</span>
                          </p>
                          <p className="flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-sm bg-[#9085e9]"></span>
                            Canceladas: <span className="font-bold tabular-nums">{day.canceladas}</span>
                          </p>
                          {total === 0 && <p className="mt-1 text-slate-300">Sem consultas</p>}

            <div aria-hidden="true" className="mt-2 flex gap-3">
              <span className="w-5"></span>
              <div className="flex-1 flex">
                {chartData.map(day => {
                  const dayNumber = Number(day.date.slice(8));
                  const isToday = day.date === todayStr;
                  const showLabel = period === 'semana' || isToday || dayNumber === 1 || dayNumber % 5 === 0;
                  return (
                    <span
                      key={day.date}
                      className={`flex-1 text-center text-xs tabular-nums ${isToday ? 'font-bold text-slate-900' : 'text-slate-500'}`}
                    >
                      {showLabel && (period === 'semana'
                        ? formatDateBR(day.date, { weekday: 'short', day: '2-digit' }).replace('.', '')
                        : dayNumber)}
                    </span>
                  );
                })}
              </div>
            </div>

            <details className="mt-4 text-sm">
              <summary className="cursor-pointer rounded-lg px-1 font-semibold text-emerald-700 outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40">
                Ver dados em tabela
              </summary>
              <div className="mt-3 overflow-x-auto">
                <table className="w-full min-w-[20rem] text-left text-sm">
                  <thead>
                    <tr className="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
                      <th scope="col" className="py-2 pr-4 font-bold">Dia</th>
                      <th scope="col" className="py-2 pr-4 font-bold text-right">Mantidas</th>
                      <th scope="col" className="py-2 font-bold text-right">Canceladas</th>
                    </tr>
                  </thead>
                  <tbody>
                    {chartData.map(day => (
                      <tr key={day.date} className="border-b border-slate-100 last:border-b-0">
                        <th scope="row" className="py-1.5 pr-4 font-normal text-slate-700">
                          {formatDateBR(day.date, { weekday: 'short', day: '2-digit', month: '2-digit' })}
                        </th>
                        <td className="py-1.5 pr-4 text-right tabular-nums text-slate-900">{day.ativas}</td>
                        <td className="py-1.5 text-right tabular-nums text-slate-900">{day.canceladas}</td>
                      </tr>

          </section>

          <section className="bg-white rounded-2xl border border-slate-200 p-5">
            <h3 className="text-base font-bold text-slate-900">Recebido por forma de pagamento</h3>
            <p className="text-xs text-slate-500 mt-0.5">{periodLabel} ┬À consultas pagas</p>

            {paymentTotals.length === 0 ? (
              <p className="py-8 text-center text-sm text-slate-500">Nenhum pagamento recebido no per├¡odo.</p>
            ) : (
              <dl className="mt-4 space-y-3">
                {paymentTotals.map(([forma, total]) => (
                  <div key={forma} className="grid grid-cols-[8.5rem_minmax(0,1fr)_6.5rem] items-center gap-3">
                    <dt className="truncate text-sm text-slate-700">{forma}</dt>
                    <div aria-hidden="true" className="h-3 rounded-full bg-slate-100">
                      <div className="h-3 rounded-full bg-emerald-600" style={{ width: `${(total / paymentMax) * 100}%` }}></div>
                    </div>
                    <dd className="text-right text-sm font-bold tabular-nums text-slate-900">{formatBRL(total)}</dd>
                  </div>
                ))}
              </dl>
            )}
          </section>

          <section className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div className="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-200">
              <h3 className="text-base font-bold text-slate-900">Atendimentos de hoje</h3>
              <button
                onClick={() => onNavigate('agenda')}
                className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-sm font-bold text-emerald-700 hover:text-emerald-800 outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40"
              >
                Ver agenda
                <Icon name="arrowRight" />
              </button>
            </div>

            {todayAppointments.length === 0 ? (
              <p className="px-5 py-10 text-center text-sm text-slate-500">Nenhum atendimento marcado para hoje.</p>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full min-w-[44rem] text-left text-sm">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
                      <th scope="col" className="px-5 py-2.5 font-bold">Hor├írio</th>
                      <th scope="col" className="px-3 py-2.5 font-bold">Paciente</th>
                      <th scope="col" className="px-3 py-2.5 font-bold">Lembrete</th>

                    </tr>
                  </thead>
                  <tbody>
                    {todayAppointments.map(appt => {
                      const patient = patients.find(p => p.id === appt.pacienteId);
                      const isBlocked = appt.tipo === 'bloqueio';
                      const isNext = nextAppt && nextAppt.id === appt.id;
                      const notif = NOTIF_STATUS[appt.notificacaoStatus];
                      const isPaid = appt.statusPagamento === 'pago';

                      return (
                        <tr key={appt.id} className={`border-b border-slate-100 last:border-b-0 ${isNext ? 'bg-emerald-50/60' : ''}`}>

                  </tbody>
                </table>
              </div>
            )}
          </section>
        </div>
      );
    }

    function MetricCard({ label, value, subtext, icon }) {
      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200">
          <span className="inline-flex w-10 h-10 items-center justify-center rounded-xl bg-emerald-50 text-emerald-700">
            {ICONS[icon] ? <Icon name={icon} className="w-5 h-5" /> : icon}
          </span>
          <div className="mt-4 text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">{value}</div>
          <div className="mt-1 text-sm font-semibold text-slate-700">{label}</div>
          <div className="mt-0.5 text-xs text-slate-500">{subtext}</div>
        </div>
      );
    }

    function AgendaView({ appointments, patients, currentUser, setAppointments, showToast, registerLog, setDialogConfig, schedulePatientId, onScheduleHandled }) {
      // RN12 - O Profissional agenda na pr├│pria agenda; o Administrador agenda na agenda do profissional da cl├¡nica
      const agendaOwnerId = currentUser.role === 'Profissional'
        ? currentUser.id
        : (INITIAL_USERS.find(u => u.role === 'Profissional')?.id || currentUser.id);

      const [viewMode, setViewMode] = useState('dia'); // 'dia' | 'semana' (RF10)
      const [selectedDate, setSelectedDate] = useState(getTodayDateStr());
      const [showNewModal, setShowNewModal] = useState(false);
      const [showBlockModal, setShowBlockModal] = useState(false);
      const [showRescheduleModal, setShowRescheduleModal] = useState(null);
      const [whatsappModalData, setWhatsappModalData] = useState(null);

      // Form State: Nova Consulta
      const [formPatientId, setFormPatientId] = useState('');
      const [formDate, setFormDate] = useState(selectedDate);
      const [formTime, setFormTime] = useState('09:00');
      const [formObs, setFormObs] = useState('');
      const [formValue, setFormValue] = useState(200);

      // Chegou pela tela de Pacientes: abre o formul├írio com o paciente j├í selecionado
      useEffect(() => {
        if (!schedulePatientId) return;
        const today = getTodayDateStr();
        setFormPatientId(schedulePatientId);
        setFormDate(selectedDate < today ? today : selectedDate);
        setShowNewModal(true);
        onScheduleHandled();
      }, [schedulePatientId]);

      // Form State: Bloqueio de Hor├írio (RF11)
      const [blockReason, setBlockReason] = useState('Intervalo para almo├ºo');
      const [blockTime, setBlockTime] = useState('12:00');

      // Form State: Remarca├º├úo (RF07)
      const [rescheduleDate, setRescheduleDate] = useState('');
      const [rescheduleTime, setRescheduleTime] = useState('14:00');

      // Filtro conforme perfil (RN12)
      const filteredAppointments = useMemo(() => {
        return appointments.filter(a => {
          if (currentUser.role === 'Profissional' && a.profissionalId !== currentUser.id) {
            return false;
          }
          if (viewMode === 'dia') {
            return a.data === selectedDate;
          }
          return true;
        });
      }, [appointments, currentUser, viewMode, selectedDate]);

      // Cria├º├úo de Agendamento com Preven├º├úo de Choque de Hor├írios (RN01, RN02)
      const handleCreateAppointment = async (e) => {
        e.preventDefault();

        // RN16: s├│ paciente ativo pode ser agendado
        const formPatient = patients.find(p => p.id === formPatientId);
        if (!formPatient || formPatient.status !== 'ativo') {
          showToast('Selecione um paciente ativo cadastrado.', 'error');
          return;
        }

        if (isPastSlot(formDate, formTime)) {
          showToast('N├úo ├® poss├¡vel agendar em data ou hor├írio que j├í passou.', 'error');
          return;
        }

        // Valida├º├úo integrada com o backend C# (AgendaService - RN01, RN02)
        if (api.isConnected) {
          const apiRes = await api.agendarConsulta({
            pacienteId: formPatientId,
            profissionalId: agendaOwnerId,
            data: formDate,
            horario: formTime,
            duracaoMin: 60,
            observacoes: formObs,
            valor: Number(formValue) || 200
          });

          if (!apiRes.sucesso) {
            // Regra de Neg├│cio barrada pelo backend C#
            setDialogConfig({
              title: 'Bloqueio de Regra de Neg├│cio (RN01, RN02)',
              message: apiRes.erro,
              confirmLabel: 'Entendido',
              cancelLabel: 'Fechar',
              danger: true,
              onConfirm: () => {}
            });
            showToast(apiRes.erro, 'error');
            return;
          }

          setAppointments(prev => [...prev, apiRes.dados]);
          setShowNewModal(false);

          const pat = patients.find(p => p.id === formPatientId);
          showToast(`Consulta confirmada via API C# para ${pat?.nome} ├ás ${formTime}!`);
          registerLog('Agendamento via API (RF06, RN01)', `Consulta marcada para ${pat?.nome} no dia ${formDate} ├ás ${formTime}`);

          // Disparo de confirma├º├úo WhatsApp (RF12, RN03)
          setWhatsappModalData({
            titulo: 'Confirma├º├úo enviada por WhatsApp (RN03)',
            destinatario: `${pat?.nome} (${formatPhone(pat?.telefone)})`,
            mensagem: `Ol├í, ${pat?.nome}! Sua consulta na Clinix est├í confirmada para ${formatDateBR(formDate)} ├ás ${formTime}. Enviaremos lembrete 24h antes!`
          });
          return;
        }

        // RN01 / RN02: Fallback local - checar sobreposi├º├úo com outro compromisso do mesmo profissional
        const conflict = findOverlap(appointments, { data: formDate, horario: formTime, profissionalId: agendaOwnerId });

        if (conflict) {
          setDialogConfig({
            title: 'Hor├írio j├í ocupado',
            message: `O hor├írio ${formTime} em ${formatDateBR(formDate)} j├í est├í ocupado por outro compromisso. Escolha outro hor├írio ou outra data.`,
            confirmLabel: 'Entendido',
            cancelLabel: 'Fechar',
            danger: true,
            onConfirm: () => {}
          });
          return;
        }

        const newAppt = {
          id: 'a_' + Date.now(),
          pacienteId: formPatientId,
          profissionalId: agendaOwnerId,
          data: formDate,
          horario: formTime,
          duracaoMin: 60,
          status: 'confirmado',
          tipo: 'consulta',
          observacoes: formObs || 'Consulta de rotina',
          valor: Math.max(0, Number(formValue)) || 200,
          statusPagamento: 'pendente',
          formaPagamento: 'Em aberto',
          notificacaoStatus: 'enviado', // RN03
          notificacaoTentativas: 1,
          cancelamentoTardio: false
        };

        setAppointments(prev => [...prev, newAppt]);
        setShowNewModal(false);

        const pat = patients.find(p => p.id === formPatientId);
        showToast(`Consulta confirmada para ${pat?.nome} ├ás ${formTime}!`);
        registerLog('Agendamento de Consulta (RF06, RN01)', `Consulta marcada para ${pat?.nome} no dia ${formDate} ├ás ${formTime}`);

        // Exibi├º├úo da confirma├º├úo autom├ítica enviada por WhatsApp (RF12, RN03)
        setWhatsappModalData({
          titulo: 'Confirma├º├úo enviada por WhatsApp',
          destinatario: `${pat?.nome} (${formatPhone(pat?.telefone)})`,
          mensagem: `Ol├í, ${pat?.nome}! Sua consulta na Clinix est├í confirmada para ${formatDateBR(formDate)} ├ás ${formTime}. Enviaremos lembrete 24h antes!`
        });
      };

      // Bloquear Hor├írio na Agenda (RF11)
      const handleBlockSlot = (e) => {
        e.preventDefault();

        if (isPastSlot(selectedDate, blockTime)) {
          showToast('N├úo ├® poss├¡vel bloquear um hor├írio que j├í passou.', 'error');
          return;
        }

        // Checar conflito pr├®vio
        const conflict = findOverlap(appointments, { data: selectedDate, horario: blockTime, profissionalId: agendaOwnerId });

        if (conflict) {
          showToast('Hor├írio j├í ocupado por consulta. Remarque-a antes de bloquear.', 'error');
          return;
        }

        const blockAppt = {
          id: 'b_' + Date.now(),
          pacienteId: null,
          profissionalId: agendaOwnerId,
          data: selectedDate,
          horario: blockTime,
          duracaoMin: 60,
          status: 'bloqueado',
          tipo: 'bloqueio',
          observacoes: blockReason,
          valor: 0,
          statusPagamento: 'isento',
          formaPagamento: 'N/A',
          notificacaoStatus: 'nao_aplicavel',
          notificacaoTentativas: 0,
          cancelamentoTardio: false
        };

        setAppointments(prev => [...prev, blockAppt]);
        setShowBlockModal(false);
        showToast(`Hor├írio ${blockTime} bloqueado.`);
        registerLog('Bloqueio de Agenda (RF11)', `Bloqueado ${blockTime} em ${selectedDate}: ${blockReason}`);
      };

      // Remarca├º├úo de Consulta (RF07)
      const handleRescheduleSubmit = (e) => {
        e.preventDefault();
        const appt = showRescheduleModal;

        if (isPastSlot(rescheduleDate, rescheduleTime)) {
          showToast('N├úo ├® poss├¡vel remarcar para data ou hor├írio que j├í passou.', 'error');
          return;
        }

        const conflict = findOverlap(appointments, {
          data: rescheduleDate,
          horario: rescheduleTime,
          duracaoMin: appt.duracaoMin,
          profissionalId: appt.profissionalId,
          ignoreId: appt.id
        });

        if (conflict) {
          showToast('Hor├írio de remarca├º├úo j├í ocupado! Selecione outro.', 'error');
          return;
        }

        setAppointments(prev => prev.map(a => {
          if (a.id === appt.id) {
            return {
              ...a,
              data: rescheduleDate,
              horario: rescheduleTime,
              status: 'remarcado',
              notificacaoStatus: 'enviado',
              notificacaoTentativas: 1
            };
          }
          return a;
        }));

        setShowRescheduleModal(null);
        showToast('Consulta remarcada.');
        registerLog('Remarca├º├úo de Consulta (RF07)', `Consulta ${appt.id} transferida para ${rescheduleDate} ├ás ${rescheduleTime}`);
      };

      // Cancelamento com Regra de Cancelamento Tardio (< 24h) (RN10)
      const handleCancelAppointment = (appt) => {
        const apptDate = new Date(`${appt.data}T${appt.horario}`);
        const now = new Date();
        const diffHours = (apptDate - now) / (1000 * 60 * 60);
        const isTardio = diffHours > 0 && diffHours < 24;

        setDialogConfig({
          title: 'Cancelar consulta?',
          message: isTardio
            ? `Esta consulta acontece em menos de 24 horas. O cancelamento ser├í registrado como cancelamento tardio no hist├│rico do paciente.`
            : 'Deseja confirmar o cancelamento deste agendamento?',
          confirmLabel: 'Sim, Cancelar',
          cancelLabel: 'Voltar',
          danger: true,
          onConfirm: async () => {
            let tardioFinal = isTardio;
            if (api.isConnected) {
              const res = await api.cancelarAgendamento(appt.id);
              if (!res.sucesso) {
                showToast(res.erro || 'N├úo foi poss├¡vel cancelar a consulta.', 'error');
                return;
              }
              if (res.cancelamentoTardio !== undefined) {
                tardioFinal = res.cancelamentoTardio;
              }
            }
            setAppointments(prev => prev.map(a => {
              if (a.id === appt.id) {
                return { ...a, status: 'cancelado', cancelamentoTardio: tardioFinal };
              }
              return a;
            }));
            showToast('Agendamento cancelado.');
            registerLog('Cancelamento de Consulta (RF08, RN10)', `Cancelamento ID ${appt.id}. Tardio: ${tardioFinal ? 'SIM' : 'N├âO'}`);
          }
        });
      };

      // Simula├º├úo do Reenvio de WhatsApp (RN14)
      const handleRetryWhatsapp = (apptId) => {
        setAppointments(prev => prev.map(a => {
          if (a.id === apptId) {
            return { ...a, notificacaoStatus: 'reenviado', notificacaoTentativas: a.notificacaoTentativas + 1 };
          }
          return a;
        }));
        showToast('Lembrete reenviado.');
        registerLog('Reenvio de WhatsApp (RN14)', `Notifica├º├úo reenviada para consulta ${apptId}`);
      };

      const isAllDates = viewMode === 'semana';
      const [calMonth, setCalMonth] = useState(selectedDate.slice(0, 7));
      const todayStr = getTodayDateStr();
      const pad2 = (n) => String(n).padStart(2, '0');

      const sortedAppointments = [...filteredAppointments].sort(
        (a, b) => (a.data + a.horario).localeCompare(b.data + b.horario)
      );
      const consultaCount = filteredAppointments.filter(a => a.tipo !== 'bloqueio' && a.status !== 'cancelado').length;

      // RN01, RN02 - Indicador de conflito em tempo real no formul├írio
      const hasFormConflict = Boolean(findOverlap(appointments, { data: formDate, horario: formTime, profissionalId: agendaOwnerId }));

      // RN12 - O calend├írio marca apenas os dias com agendamentos vis├¡veis ao perfil
      const countByDate = appointments.reduce((acc, a) => {
        if (a.status === 'cancelado') return acc;
        if (currentUser.role === 'Profissional' && a.profissionalId !== currentUser.id) return acc;
        acc[a.data] = (acc[a.data] || 0) + 1;
        return acc;
      }, {});

      const [calYear, calMonthNum] = calMonth.split('-').map(Number);
      const firstWeekday = new Date(calYear, calMonthNum - 1, 1).getDay();
      const daysInMonth = new Date(calYear, calMonthNum, 0).getDate();
      const calendarCells = [
        ...Array(firstWeekday).fill(null),
        ...Array.from({ length: daysInMonth }, (_, i) => `${calMonth}-${pad2(i + 1)}`)
      ];

      const shiftMonth = (delta) => {
        const date = new Date(calYear, calMonthNum - 1 + delta, 1);
        setCalMonth(`${date.getFullYear()}-${pad2(date.getMonth() + 1)}`);
      };

      const selectDay = (dateStr) => {
        setSelectedDate(dateStr);
        setCalMonth(dateStr.slice(0, 7));
        setViewMode('dia');
      };

      const getEndTime = (appt) => {
        const [hours, minutes] = appt.horario.split(':').map(Number);
        const total = hours * 60 + minutes + (appt.duracaoMin || 60);
        return `${pad2(Math.floor(total / 60) % 24)}:${pad2(total % 60)}`;
      };

      const STATUS_DOT = {
        confirmado: 'bg-emerald-500',
        remarcado: 'bg-sky-500',
        bloqueado: 'bg-slate-400',
        cancelado: 'bg-rose-400'
      };
      const NAV_BTN = 'w-9 h-9 inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 outline-none focus-visible:ring-4 focus-visible:ring-slate-400/40';

      return (
        <div className="space-y-5 max-w-6xl mx-auto">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              <button type="button" onClick={() => selectDay(todayStr)} className={BTN_SECONDARY}>
                Hoje
              </button>

              {/* RF10 - Altern├óncia de vis├úo da agenda */}
              <div role="group" aria-label="Per├¡odo exibido" className="flex bg-slate-200/70 p-1 rounded-xl text-sm font-bold">
                {[['dia', 'Dia'], ['semana', 'Todas as datas']].map(([mode, label]) => (
                  <button
                    key={mode}
                    type="button"
                    onClick={() => setViewMode(mode)}
                    aria-pressed={viewMode === mode}
                    className={`px-3 py-1.5 rounded-lg transition outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40 ${
                      viewMode === mode ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {label}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button onClick={() => setShowBlockModal(true)} className={BTN_SECONDARY}>
                <Icon name="ban" />
                Bloquear hor├írio
              </button>
              <button
                onClick={() => { setFormDate(selectedDate); setShowNewModal(true); }}
                className={BTN_PRIMARY}
              >
                <Icon name="plus" />
                Novo agendamento
              </button>
            </div>
          </div>

          <div className="grid lg:grid-cols-5 gap-5 items-start">
            <section aria-label="Calend├írio" className="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5">
              <div className="flex items-center justify-between gap-3 mb-4">
                <h2 className="text-base font-bold text-slate-900 first-letter:uppercase" aria-live="polite">
                  {formatDateBR(`${calMonth}-01`, { month: 'long', year: 'numeric' })}
                </h2>
                <div className="flex items-center gap-1.5">
                  <button type="button" onClick={() => shiftMonth(-1)} aria-label="M├¬s anterior" className={NAV_BTN}>
                    <Icon name="chevronLeft" />
                  </button>
                  <button type="button" onClick={() => shiftMonth(1)} aria-label="Pr├│ximo m├¬s" className={NAV_BTN}>
                    <Icon name="chevronRight" />
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-7 gap-1 text-center">
                {['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'S├íb'].map(day => (
                  <span key={day} className="pb-2 text-xs font-bold text-slate-500">{day}</span>
                ))}

                {calendarCells.map((dateStr, index) => {
                  if (!dateStr) return <span key={`vazio-${index}`}></span>;

                  const count = countByDate[dateStr] || 0;
                  const isSelected = !isAllDates && dateStr === selectedDate;
                  const isToday = dateStr === todayStr;

                  return (
                    <button
                      key={dateStr}
                      type="button"
                      onClick={() => selectDay(dateStr)}
                      aria-pressed={isSelected}
                      aria-label={`${formatDateBR(dateStr, { weekday: 'long', day: 'numeric', month: 'long' })}${
                        count > 0 ? `, ${count} ${count === 1 ? 'agendamento' : 'agendamentos'}` : ''
                      }`}
                      className={`relative h-12 rounded-xl text-sm font-semibold tabular-nums transition outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40 ${
                        isSelected
                          ? 'bg-emerald-600 text-white'
                          : isToday
                            ? 'text-emerald-700 ring-1 ring-inset ring-emerald-500 hover:bg-emerald-50'
                            : 'text-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      {Number(dateStr.slice(8))}
                      {count > 0 && (
                        <span
                          aria-hidden="true"
                          className={`absolute bottom-1.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-emerald-500'}`}
                        ></span>
                      )}
                    </button>
                  );
                })}
              </div>

              <p className="mt-4 flex items-center gap-2 text-xs text-slate-500">
                <span aria-hidden="true" className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                Dia com agendamento
              </p>
            </section>

            <section className="lg:col-span-3 bg-white rounded-2xl border border-slate-200 overflow-hidden">
              <div className="flex flex-wrap items-center justify-between gap-2 px-5 py-4 border-b border-slate-200">
                <h2 className="text-base font-bold text-slate-900">
                  {isAllDates
                    ? 'Todas as datas'
                    : `${selectedDate === todayStr ? 'Hoje ÔÇö ' : ''}${formatDateBR(selectedDate, { weekday: 'long', day: 'numeric', month: 'long' })}`}
                </h2>
                <span aria-live="polite">
                  <StatusBadge
                    label={consultaCount === 1 ? '1 consulta' : `${consultaCount} consultas`}
                    className="bg-emerald-50 text-emerald-800 ring-emerald-600/20"
                  />
                </span>
              </div>

              {sortedAppointments.length === 0 ? (
                <div className="px-5 py-12 text-center">
                  <p className="text-sm font-semibold text-slate-700">Nenhum agendamento {isAllDates ? 'cadastrado' : 'nesta data'}.</p>
                  <button
                    onClick={() => { setFormDate(selectedDate); setShowNewModal(true); }}
                    className={`${BTN_SECONDARY} mt-4`}
                  >
                    <Icon name="plus" />
                    Novo agendamento
                  </button>
                </div>
              ) : (
                <ul>
                  {sortedAppointments.map((appt, index) => {
                    const patient = patients.find(p => p.id === appt.pacienteId);
                    const isBlocked = appt.tipo === 'bloqueio';
                    const isCancelled = appt.status === 'cancelado';
                    const status = APPT_STATUS[appt.status] || { label: appt.status, className: 'bg-slate-100 text-slate-700 ring-slate-500/20' };
                    const notif = NOTIF_STATUS[appt.notificacaoStatus];
                    const patientName = patient ? patient.nome : 'Paciente n├úo encontrado';
                    const startsNewDate = isAllDates && (index === 0 || sortedAppointments[index - 1].data !== appt.data);

                    return (
                      <React.Fragment key={appt.id}>
                        {startsNewDate && (
                          <li className="px-5 py-2 bg-slate-50 border-b border-slate-200 text-sm font-bold text-slate-700 first-letter:uppercase">
                            {formatDateBR(appt.data, { weekday: 'long', day: 'numeric', month: 'long' })}
                          </li>
                        )}

                        <li
                          className={`flex flex-wrap items-center gap-x-3 gap-y-2 px-5 py-3.5 border-b border-slate-100 last:border-b-0 ${
                            isCancelled || isBlocked ? 'bg-slate-50/70' : ''
                          }`}
                        >
                          <div className="w-12 shrink-0 tabular-nums">
                            <p className={`text-sm font-extrabold ${isCancelled ? 'text-slate-400 line-through' : 'text-slate-900'}`}>
                              {appt.horario}
                            </p>
                            <p className="text-xs text-slate-500">{getEndTime(appt)}</p>
                          </div>

                          <span
                            aria-hidden="true"
                            className={`shrink-0 w-2 h-2 rounded-full ${STATUS_DOT[appt.status] || 'bg-slate-300'}`}
                          ></span>

                          <div className="min-w-0 flex-1 basis-52">
                            {isBlocked ? (
                              <p className="text-sm font-semibold text-slate-600">{appt.observacoes}</p>
                            ) : (
                              <>
                                <p className={`truncate text-sm font-bold ${isCancelled ? 'text-slate-500' : 'text-slate-900'}`}>{patientName}</p>
                                <p className="truncate text-xs text-slate-600">
                                  {appt.observacoes}
                                  <span className="text-slate-400"> ┬À </span>
                                  <span className="font-semibold tabular-nums">{formatBRL(appt.valor)}</span>
                                </p>
                                {/* RN10 - Cancelamento com menos de 24h */}
                                {appt.cancelamentoTardio ? (
                                  <p className="text-xs font-bold text-rose-700 mt-0.5">Cancelamento tardio (menos de 24h)</p>
                                ) : notif && !isCancelled && (
                                  <p className={`text-xs mt-0.5 ${appt.notificacaoStatus === 'falha' ? 'font-bold text-rose-700' : 'text-slate-500'}`}>
                                    {notif.label}
                                  </p>
                                )}
                              </>
                            )}
                          </div>

                          <div className="flex flex-wrap items-center gap-2 ml-auto">
                            {!isCancelled && !isBlocked && (
                              <>
                                {/* RN14 - Reenvio manual ap├│s falha */}
                                {appt.notificacaoStatus === 'falha' && (
                                  <button
                                    onClick={() => handleRetryWhatsapp(appt.id)}
                                    aria-label={`Reenviar lembrete para ${patientName}`}
                                    className={`${BTN_SMALL} border-amber-400 bg-amber-50 text-amber-900 hover:bg-amber-100 focus-visible:ring-amber-500/40`}
                                  >
                                    Reenviar lembrete
                                  </button>
                                )}
                                <button
                                  onClick={() => {
                                    setShowRescheduleModal(appt);
                                    setRescheduleDate(appt.data);
                                  }}
                                  aria-label={`Remarcar consulta de ${patientName}`}
                                  className={`${BTN_SMALL} border-slate-300 bg-white text-slate-700 hover:bg-slate-50 focus-visible:ring-slate-400/40`}
                                >
                                  Remarcar
                                </button>
                                <button
                                  onClick={() => handleCancelAppointment(appt)}
                                  aria-label={`Cancelar consulta de ${patientName}`}
                                  className={`${BTN_SMALL} border-rose-300 bg-white text-rose-700 hover:bg-rose-50 focus-visible:ring-rose-500/40`}
                                >
                                  Cancelar
                                </button>
                              </>
                            )}
                            <StatusBadge label={status.label} className={status.className} />
                          </div>
                        </li>
                      </React.Fragment>
                    );
                  })}
                </ul>
              )}
            </section>
          </div>

          {/* RF06, RF09 - Novo agendamento */}
          {showNewModal && (
            <Modal title="Novo agendamento" onClose={() => setShowNewModal(false)}>
              <form onSubmit={handleCreateAppointment} className="space-y-4 mt-5">
                <div>
                  <label htmlFor="ag-paciente" className={LABEL_CLASS}>Paciente</label>
                  <select
                    id="ag-paciente"
                    value={formPatientId}
                    onChange={e => setFormPatientId(e.target.value)}
                    required
                    className={FIELD_CLASS}
                  >
                    <option value="">Selecione o paciente</option>
                    {patients.filter(p => p.status === 'ativo').map(p => (
                      <option key={p.id} value={p.id}>{p.nome} ({formatCpf(p.cpf)})</option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label htmlFor="ag-data" className={LABEL_CLASS}>Data</label>
                    <input
                      id="ag-data"
                      type="date"
                      min={todayStr}
                      value={formDate}
                      onChange={e => setFormDate(e.target.value)}
                      required
                      className={FIELD_CLASS}
                    />
                  </div>
                  <div>
                    <label htmlFor="ag-horario" className={LABEL_CLASS}>Hor├írio</label>
                    <select
                      id="ag-horario"
                      value={formTime}
                      onChange={e => setFormTime(e.target.value)}
