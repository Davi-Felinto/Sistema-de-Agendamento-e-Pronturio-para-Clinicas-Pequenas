      if (idA == null || idB == null) return false;
      if (idA === idB) return true;
      const strA = String(idA).trim();
      const strB = String(idB).trim();
      if (strA === strB) return true;
      const numA = strA.replace(/\D/g, '');
      const numB = strB.replace(/\D/g, '');
      return numA !== '' && numA === numB;
    };

    const findPatient = (patientsList, id) => {
      if (!patientsList || id == null) return null;
      return patientsList.find(p => matchPatientId(p.id, id)) || null;

    const api = {
      isConnected: false,
      token: (() => { try { return sessionStorage.getItem('clinix_token'); } catch { return null; } })(),

      setToken(token) {
        this.token = token || null;
        try {
          if (this.token) sessionStorage.setItem('clinix_token', this.token);
          else sessionStorage.removeItem('clinix_token');
        } catch {}
      },

      authHeaders(extra = {}) {
        return this.token ? { ...extra, 'Authorization': `Bearer ${this.token}` } : extra;
      },

      storage: 'offline',
      storageLabel: 'Modo Standalone (Offline)',

      async checkHealth() {
        try {
          const res = await fetch('/api/status', { method: 'GET', headers: { 'Accept': 'application/json' } });
          if (res.ok) {
            const data = await res.json();
            this.isConnected = true;
            this.storage = data.storage || 'memoria';
            this.storageLabel = data.storageLabel || 'Banco: MySQL 8.0';
            return { ok: true, storage: this.storage, storageLabel: this.storageLabel };
          }
          const resHealth = await fetch('/api/health', { method: 'GET', headers: { 'Accept': 'application/json' } });
          this.isConnected = resHealth.ok;
          this.storage = resHealth.ok ? 'memoria' : 'offline';
          this.storageLabel = resHealth.ok ? 'Banco: Memória (Mock)' : 'Modo Standalone (Offline)';
          return { ok: resHealth.ok, storage: this.storage, storageLabel: this.storageLabel };
        } catch {
          this.isConnected = false;
          this.storage = 'offline';
          this.storageLabel = 'Modo Standalone (Offline)';
          return { ok: false, storage: 'offline', storageLabel: 'Modo Standalone (Offline)' };
        }
      },

      // --- CEP & ENDEREÇO ESTRUTURADO (RF29, RN18) ---
      async consultarCep(cep) {
        try {
          const limpo = String(cep).replace(/\D/g, '');
          if (limpo.length !== 8) {
            return { sucesso: false, erro: 'CEP deve conter 8 dígitos.' };
          }
          // 1. Tenta consulta direta no ViaCEP
          try {
            const res = await fetch(`https://viacep.com.br/ws/${limpo}/json/`);
            if (res.ok) {
              const data = await res.json();
              if (!data.erro) {
                return {
                  sucesso: true,
                  cep: data.cep || limpo,
                  logradouro: data.logradouro || '',
                  bairro: data.bairro || '',
                  cidade: data.localidade || '',
                  estadoUf: data.uf || '',
                  complemento: data.complemento || ''
                };
              }
            }
          } catch {
            // Bloqueio de rede/CSP no navegador: recorre ao proxy backend
          }

          // 2. Fallback: Proxy backend na API local (/api/cep/{limpo})
          try {
            const resBackend = await fetch(`/api/cep/${limpo}`, { headers: this.authHeaders() });
            if (resBackend.ok) {
              const data = await resBackend.json();
              if (data.sucesso) return data;
            }
          } catch {}

          return { sucesso: false, erro: 'CEP não localizado automaticamente. Preencha os campos abaixo.' };
        } catch (e) {
          return { sucesso: false, erro: 'Não foi possível consultar o CEP automaticamente.' };
        }
      },

      // --- PACIENTES (RF01-RF05, RN16, RF29, RN18) ---
      async listarPacientes() {
        try {
          const res = await fetch('/api/pacientes', { headers: this.authHeaders() });
          if (!res.ok) throw new Error('Falha ao listar pacientes');
          const data = await res.json();
          this.isConnected = true;
          return {
            sucesso: true,
            dados: data.map(p => ({
              id: String(p.id),
              nome: p.nome,
              cpf: p.documentoIdentificacao || p.cpf || '',
              nascimento: p.dataNascimento ? p.dataNascimento.split('T')[0] : (p.nascimento || ''),
              telefone: p.telefone || '',
              email: p.email || '',
              endereco: p.endereco || '',
              cep: p.cep || '',
              logradouro: p.logradouro || '',
              numero: p.numero || '',
              complemento: p.complemento || '',
              bairro: p.bairro || '',
              cidade: p.cidade || '',
              estadoUf: p.estadoUf || '',
              alergias: p.alergias || '',
              condicoesPreexistentes: p.condicoesPreexistentes || '',
              status: p.ativo !== undefined ? (p.ativo ? 'ativo' : 'inativo') : (p.status || 'ativo'),
              profissionalId: 'u1'
            }))
          };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async criarPaciente(dados) {
        try {
          const res = await fetch('/api/pacientes', {
            method: 'POST',
            headers: this.authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({
              nome: dados.nome,
              documentoIdentificacao: dados.cpf,
              dataNascimento: dados.nascimento ? new Date(dados.nascimento).toISOString() : new Date().toISOString(),
              telefone: dados.telefone,
              email: dados.email,
              endereco: dados.endereco,
              cep: dados.cep,
              logradouro: dados.logradouro,
              numero: dados.numero,
              complemento: dados.complemento,
              bairro: dados.bairro,
              cidade: dados.cidade,
              estadoUf: dados.estadoUf,
              alergias: dados.alergias,
              condicoesPreexistentes: dados.condicoesPreexistentes
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            const validacao = err.errors ? Object.values(err.errors).flat()[0] : null;
            return { sucesso: false, erro: err.erro || err.mensagem || validacao || 'Erro ao cadastrar paciente' };
          }
          const p = await res.json();
          return {
            sucesso: true,
            dados: {
              id: String(p.id),
              nome: p.nome,
              cpf: p.documentoIdentificacao || dados.cpf,
              nascimento: p.dataNascimento ? p.dataNascimento.split('T')[0] : dados.nascimento,
              telefone: p.telefone,
              email: p.email,
              endereco: p.endereco,
              cep: p.cep || dados.cep,
              logradouro: p.logradouro || dados.logradouro,
              numero: p.numero || dados.numero,
              complemento: p.complemento || dados.complemento,
              bairro: p.bairro || dados.bairro,
              cidade: p.cidade || dados.cidade,
              estadoUf: p.estadoUf || dados.estadoUf,
              alergias: p.alergias,
              condicoesPreexistentes: p.condicoesPreexistentes,
              status: p.ativo ? 'ativo' : 'inativo',
              profissionalId: dados.profissionalId || 'u1'
            }
          };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async inativarPaciente(id) {
        try {
          const numId = Number(id);
          if (!isNaN(numId)) {
            const res = await fetch(`/api/pacientes/${numId}/inativar`, {
              method: 'PUT',
              headers: this.authHeaders()
            });
            if (!res.ok) {

      // --- AGENDAMENTOS (RF06-RF11, RN01, RN02, RN10, RF31, RN20) ---
      async listarAgendamentos() {
        try {
          const res = await fetch('/api/agendamentos', { headers: this.authHeaders() });
          if (!res.ok) throw new Error('Falha ao listar agendamentos');
          const data = await res.json();
          this.isConnected = true;
          return {
            sucesso: true,
            dados: data.map(a => {
              const inicioStr = a.dataHoraInicio || '';
              const fimStr = a.dataHoraFim || '';
              const dataStr = inicioStr ? inicioStr.split('T')[0] : getTodayDateStr();
              const horaStr = inicioStr ? inicioStr.split('T')[1].slice(0, 5) : '09:00';
              const duracaoMin = (inicioStr && fimStr)
                ? Math.round((new Date(fimStr) - new Date(inicioStr)) / 60000)
                : 60;
              let statusStr = 'confirmado';
              if (a.status === 2 || a.status === 4 || a.status === 'Cancelado') statusStr = 'cancelado';
              else if (a.status === 3 || a.status === 'Remarcado') statusStr = 'remarcado';
              else if (a.status === 0 || a.status === 1 || a.status === 'Pendente') statusStr = 'pendente';

              return {
                id: String(a.id),
                pacienteId: String(a.pacienteId),
                profissionalId: a.profissionalId === 1 ? 'u1' : `u${a.profissionalId}`,
                data: dataStr,
                horario: horaStr,
                duracaoMin,
                status: statusStr,
                tipo: 'consulta',
                observacoes: a.observacoes || 'Consulta de rotina',
                valor: 200,
                statusPagamento: 'pendente',
                formaPagamento: 'Em aberto',
                notificacaoStatus: 'enviado',
                notificacaoTentativas: 1,
                cancelamentoTardio: Boolean(a.cancelamentoTardio),
                motivoCancelamento: a.motivoCancelamento || null,
                justificativaCancelamento: a.justificativaCancelamento || null
              };
            })
          };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async agendarConsulta(dados) {
        try {
          const inicioDate = `${dados.data}T${dados.horario}:00`;
          const inicio = new Date(inicioDate);
          const duracaoMin = dados.duracaoMin || 60;
          const fim = new Date(inicio.getTime() + duracaoMin * 60000);
          const fimIso = `${dados.data}T${String(fim.getHours()).padStart(2, '0')}:${String(fim.getMinutes()).padStart(2, '0')}:00`;

          const pacienteIdNum = typeof dados.pacienteId === 'number'
            ? dados.pacienteId
            : (parseInt(String(dados.pacienteId).replace(/\D/g, ''), 10) || 1);

          const profissionalIdNum = typeof dados.profissionalId === 'number'
            ? dados.profissionalId
            : (parseInt(String(dados.profissionalId).replace(/\D/g, ''), 10) || 1);

          const res = await fetch('/api/agendamentos', {
            method: 'POST',
            headers: this.authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({
              pacienteId: pacienteIdNum,
              profissionalId: profissionalIdNum,
              dataHoraInicio: inicioDate,
              dataHoraFim: fimIso,
              observacoes: dados.observacoes || 'Consulta de rotina'
            })
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            return {
              sucesso: false,
              erro: err.erro || err.mensagem || 'Horário indisponível: conflito de horário identificado (RN01, RN02).'
            };
          }

          const criado = await res.json();
          return {
            sucesso: true,
            dados: {
              id: String(criado.id),
              pacienteId: dados.pacienteId,
              profissionalId: dados.profissionalId,
              data: dados.data,
              horario: dados.horario,
              duracaoMin,
              status: 'confirmado',
              tipo: 'consulta',
              observacoes: criado.observacoes || dados.observacoes,
              valor: dados.valor || 200,
              statusPagamento: 'pendente',
              formaPagamento: 'Em aberto',
              notificacaoStatus: 'enviado',
              notificacaoTentativas: 1,
              cancelamentoTardio: false
            }
          };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async cancelarAgendamento(id, motivo = 'Outro', justificativa = '') {
        try {
          const numId = typeof id === 'number' ? id : parseInt(String(id).replace(/\D/g, ''), 10);
          if (!isNaN(numId)) {
            const res = await fetch(`/api/agendamentos/${numId}/cancelar`, {
              method: 'PUT',
              headers: this.authHeaders({ 'Content-Type': 'application/json' }),
              body: JSON.stringify({
                motivo: motivo,
                justificativa: justificativa
              })
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              return { sucesso: false, erro: err.erro || err.mensagem || 'Erro ao cancelar consulta' };
            }
            const data = await res.json();
            return {
              sucesso: true,
              cancelamentoTardio: data.cancelamentoTardio,
              motivoCancelamento: data.motivoCancelamento
            };
          }
          return { sucesso: true };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      // --- AUTENTICAÇÃO (RF26, RQ08) ---
      async login(login, senha) {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: this.authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ login, senha })
          });
          if (!res.ok) {
            if (res.status === 429) {
              return { sucesso: false, erro: 'Muitas tentativas em pouco tempo. Aguarde alguns segundos e tente novamente.' };
            }
            const err = await res.json().catch(() => ({}));
            return { sucesso: false, erro: err.erro || err.mensagem || 'Login ou senha inválidos.' };
          }
          const user = await res.json();
          this.setToken(user.token);
          const usuarioNormalizado = {
            id: user.id || 1,
            name: user.nome || user.name || 'Usuário',
            role: user.perfil || user.role || 'Profissional',
            email: user.email || login,
            token: user.token,
            espec: user.especialidade || (user.perfil === 'Profissional' ? 'Clínica Geral' : 'Recepção e Atendimento'),
            registro: user.registroProfissional || null
          };
          return { sucesso: true, usuario: usuarioNormalizado, dados: user };
        } catch (e) {
          return { sucesso: false, erro: e.message };
        }
      },

      async registrar(dados) {
        try {
          const res = await fetch('/api/auth/registrar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              nome: String(dados.nome || '').trim(),
              email: String(dados.email || '').trim(),
              senha: String(dados.senha || ''),
              perfil: dados.perfil || 'Profissional',
              nomeClinica: dados.nomeClinica || null,
              registroProfissional: dados.registroProfissional || null,
              especialidade: dados.especialidade || null
            })
          });

          if (!res.ok) {
            let erroMsg = 'Não foi possível concluir o cadastro.';
            try {
              const erroData = await res.json();
              if (erroData && erroData.erro) erroMsg = erroData.erro;
              else if (erroData && erroData.errors) {
                const keys = Object.keys(erroData.errors);
                if (keys.length > 0) erroMsg = erroData.errors[keys[0]][0];
              }
            } catch {}
            return { sucesso: false, erro: erroMsg };
          }

          const data = await res.json();
          this.setToken(data.token);
          this.isConnected = true;
          return {
            sucesso: true,
            usuario: {
              id: data.id,
              name: data.nome,
              role: data.perfil,
              email: data.email || dados.email,
              token: data.token
            }
          };
        } catch (e) {
          return { sucesso: false, erro: 'Falha de conexão com a API: ' + e.message };
        }
      }
    };

    // Higienização automática contra caracteres double-encoded (Latin1 -> UTF-8)
    function sanitizeData(obj) {
      if (typeof obj === 'string') {
        if (/[ÃÂ]/.test(obj)) {
          try { return decodeURIComponent(escape(obj)); } catch { return obj; }
        }
        return obj;
      }
      if (Array.isArray(obj)) return obj.map(sanitizeData);
      if (obj && typeof obj === 'object') {
        const res = {};
        for (const k in obj) res[k] = sanitizeData(obj[k]);
        return res;
      }
      return obj;
    }

    // Auto-higienização preventiva de dados em cache no localStorage
    try {
      ['clinix_patients', 'clinix_appointments', 'clinix_records', 'clinix_logs'].forEach(key => {
        const val = localStorage.getItem(key);
        if (val && /[ÃÂ]/.test(val)) {
          localStorage.setItem(key, JSON.stringify(sanitizeData(JSON.parse(val))));
        }
      });
    } catch {}

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem('clinix_auth') === 'true';
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('clinix_user');
        return saved ? JSON.parse(saved) : INITIAL_USERS[0];
      });

      const [patients, setPatients] = useState(() => {
        const saved = localStorage.getItem('clinix_patients');
        return saved ? sanitizeData(JSON.parse(saved)) : INITIAL_PATIENTS;
      });

      const [appointments, setAppointments] = useState(() => {
        const saved = localStorage.getItem('clinix_appointments');
        return saved ? sanitizeData(JSON.parse(saved)) : INITIAL_APPOINTMENTS;
      });

      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('clinix_records');
        return saved ? sanitizeData(JSON.parse(saved)) : INITIAL_RECORDS;
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('clinix_logs');
        return saved ? sanitizeData(JSON.parse(saved)) : INITIAL_LOGS;
      });

      const [reviews, setReviews] = useState(() => {
        const saved = localStorage.getItem('clinix_reviews');
        return saved ? sanitizeData(JSON.parse(saved)) : INITIAL_REVIEWS;
      });

      const [labSamples, setLabSamples] = useState(() => {
        const saved = localStorage.getItem('clinix_lab_samples');
        return saved ? sanitizeData(JSON.parse(saved)) : INITIAL_LAB_SAMPLES;
      });

      // Auto-salvamento em localStorage para modo standalone
      useEffect(() => {
        try { localStorage.setItem('clinix_reviews', JSON.stringify(reviews)); } catch {}
      }, [reviews]);

      useEffect(() => {
        try { localStorage.setItem('clinix_lab_samples', JSON.stringify(labSamples)); } catch {}
      }, [labSamples]);

      // Conexão em tempo real com a Web API ASP.NET Core e Provedor do Banco
      const [isApiConnected, setIsApiConnected] = useState(false);
      const [storageProvider, setStorageProvider] = useState('offline'); // 'mysql' | 'memoria' | 'offline'

      useEffect(() => {
        async function conectarBackend() {
          const health = await api.checkHealth();
          const conectado = typeof health === 'boolean' ? health : (health && health.ok);
          setIsApiConnected(conectado);
          setStorageProvider((health && health.storage) || 'offline');
          if (!conectado || !isAuthenticated) return;

          // Com a API ativa, as rotas exigem o token do login: sem ele, volta para a tela de acesso
          if (!api.token) {
            setIsAuthenticated(false);
            return;
          }

          const resPac = await api.listarPacientes();
          if (!resPac.sucesso) {
            // Token expirado ou inválido
            api.setToken(null);
            setIsAuthenticated(false);
            return;
          }
          if (resPac.dados.length > 0) {
            setPatients(sanitizeData(resPac.dados));
          }
          const resAppt = await api.listarAgendamentos();
          if (resAppt.sucesso) {
            setAppointments(sanitizeData(resAppt.dados));
          }
          const resRev = await api.listarAvaliacoes();
          if (resRev.sucesso && resRev.dados && resRev.dados.avaliacoes) {
            setReviews(sanitizeData(resRev.dados.avaliacoes));
          }
          const resEx = await api.listarExames();
          if (resEx.sucesso && Array.isArray(resEx.dados)) {
            setLabSamples(sanitizeData(resEx.dados));
          }
        }
        conectarBackend();
      }, [isAuthenticated]);

      // Navegação entre Telas: 'dashboard' | 'agenda' | 'pacientes' | 'prontuario' | 'financeiro' | 'logs'
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedPatientForRecord, setSelectedPatientForRecord] = useState(null);
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);
      const [loginError, setLoginError] = useState('');
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [allUsers, setAllUsers] = useState(() => {
        try {
          const saved = localStorage.getItem('clinix_all_users');
          if (saved) return JSON.parse(saved);
        } catch {}
        return INITIAL_USERS;
      });

      useEffect(() => {
        try { localStorage.setItem('clinix_all_users', JSON.stringify(allUsers)); } catch {}
      }, [allUsers]);

      const [schedulePatientId, setSchedulePatientId] = useState(null);
      const [dialogConfig, setDialogConfig] = useState(null);
      const [showSearchModal, setShowSearchModal] = useState(false);
      const [showFeedbackModal, setShowFeedbackModal] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);

      // Atalho Global de Usabilidade: Ctrl+K / Cmd+K para Busca Rápida (RQ10)
      useEffect(() => {

      // Persistência local contínua

      // Gestão de Feedbacks do Piloto

      // Limpeza para Clínica Vazia ou Restauração de Amostra Modelo
      const handleResetClean = () => {

        setAppointments([]);

        setLabSamples([]);

    // =========================================================================
    // TELA DE AUTENTICAÇÃO (LOGIN) COM EMAIL E SENHA (RF26, RQ08)
    // =========================================================================
    function LoginScreen({ users, onLogin, onGoToRegister, erro }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loginError, setLoginError] = useState(erro || null);
      const [carregando, setCarregando] = useState(false);
      const [dbStatus, setDbStatus] = useState(api.storage);

      useEffect(() => {
        api.checkHealth().then(h => {
          if (h && h.storage) setDbStatus(h.storage);
        });
      }, []);

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        setLoginError(null);
        const emailLimpo = email.trim().toLowerCase();
        if (!emailLimpo || !password) {
          setLoginError('Por favor, informe seu e-mail e sua senha.');
          return;
        }

        setCarregando(true);

        // 1. Se a API estiver ativa, valida com o AuthService C# (RQ08 - Hash com Salt)
        if (api.isConnected) {
          const res = await api.login(emailLimpo, password);
          setCarregando(false);
          if (res.sucesso) {
            onLogin(res.usuario, password, true);
            return;
          } else {
            setLoginError(res.erro || 'Login ou senha inválidos.');
            return;
          }
        }

        // 2. Fallback para modo offline (busca em users e demo users)
        setCarregando(false);
        const foundUser = users.find(u =>
          u.email.toLowerCase() === emailLimpo ||
          (u.email === 'davi@clinix.com' && (emailLimpo.includes('davi') || emailLimpo === 'dr.davi')) ||
          (u.email === 'juliana@clinix.com' && (emailLimpo.includes('juliana') || emailLimpo === 'admin'))
        );

        if (!foundUser) {
          setLoginError('Nenhuma conta encontrada com este e-mail. Crie uma conta ou use o acesso de teste.');
          return;
        }

        // Validação da senha no modo offline
        const senhaCorreta = foundUser.senha ? (password === foundUser.senha) : (password === DEMO_PASSWORD || password === '123');
        if (!senhaCorreta) {
          setLoginError('Senha incorreta. Confira a senha e tente novamente.');
          return;
        }

        onLogin(foundUser, password, false);
      };

      const handlePreencherDemo = (demoUser) => {
        setEmail(demoUser.email);
        setPassword(DEMO_PASSWORD);
        setLoginError(null);
      };

      return (
        <div className="min-h-screen grid lg:grid-cols-2 bg-white font-sans">
          {/* ASIDE ESQUERDA - IDENTIDADE CLINIX */}
          <aside className="hidden lg:flex flex-col justify-between bg-gradient-to-br from-emerald-700 via-emerald-800 to-emerald-950 text-white p-12 xl:p-16">
            <div className="flex items-center gap-3">
              <div aria-hidden="true" className="w-11 h-11 rounded-2xl bg-white text-emerald-700 flex items-center justify-center font-extrabold text-2xl shadow-lg">
