    };

    // RF12-RF14, RN14, RN15 - Situação do lembrete por WhatsApp
    const NOTIF_STATUS = {
      enviado: { label: 'Lembrete enviado', dot: 'bg-emerald-500' },
      reenviado: { label: 'Lembrete reenviado', dot: 'bg-sky-500' },
      falha: { label: 'Falha no envio', dot: 'bg-rose-500' },
      pendente: { label: 'Envio pendente', dot: 'bg-amber-500' }
    };

    const formatBRL = (value) => (Number(value) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    const parseDateStr = (dateStr) => new Date(`${dateStr}T12:00:00`);

    const formatDateBR = (dateStr, options) => {
      const date = parseDateStr(dateStr);
      return isNaN(date) ? dateStr : date.toLocaleDateString('pt-BR', options);
    };

    const shiftDateStr = (dateStr, days) => {
      const date = parseDateStr(dateStr);
      if (isNaN(date)) return dateStr;
      date.setDate(date.getDate() + days);
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    };

    const getAge = (dateStr) => {
      const birth = parseDateStr(dateStr);
      if (isNaN(birth)) return null;
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const hadBirthday = today.getMonth() > birth.getMonth() ||
        (today.getMonth() === birth.getMonth() && today.getDate() >= birth.getDate());
      if (!hadBirthday) age -= 1;
      return age;
    };

    const onlyDigits = (value) => (value || '').toString().replace(/\D/g, '');

    // CPF e telefone são guardados só com dígitos e formatados na exibição
    const formatCpf = (value) => {
      const digits = onlyDigits(value);
      return digits.length === 11 ? digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : (value || '');
    };

    const formatPhone = (value) => {
      const digits = onlyDigits(value);
      return digits.length === 11 ? digits.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3') : (value || '');
    };

    const CLINICAL_MAX_LENGTH = 70;
    const CLINICAL_PREVIEW_LENGTH = 50;
    const truncateText = (value, max) => {
      const text = (value || '').toString();
      return text.length > max ? `${text.slice(0, max)}…` : text;
    };

    const EMAIL_REGEX = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

    const timeToMinutes = (time) => {
      const [hours, minutes] = time.split(':').map(Number);
      return hours * 60 + minutes;
    };

    // Uma consulta não pode começar em um horário que já passou
    const isPastSlot = (dateStr, time) => new Date(`${dateStr}T${time}:00`) < new Date();

    // RN01, RN02 - Conflito por sobreposição de intervalos, e não só pelo mesmo horário de início
    const findOverlap = (appointments, { data, horario, duracaoMin = 60, profissionalId, ignoreId }) => {
      const start = timeToMinutes(horario);
      const end = start + duracaoMin;
      return appointments.find(a => {
        if (a.id === ignoreId || a.status === 'cancelado') return false;
        if (a.data !== data || a.profissionalId !== profissionalId) return false;
        const otherStart = timeToMinutes(a.horario);
        const otherEnd = otherStart + (a.duracaoMin || 60);
        return start < otherEnd && end > otherStart;
      });
    };

    // Escapa aspas e neutraliza fórmulas (=, +, -, @) para o CSV não executar nada no Excel
    const csvCell = (value) => {
      let text = (value === null || value === undefined) ? '' : String(value);
      if (/^[=+\-@\t\r]/.test(text)) text = `'${text}`;
      return `"${text.replace(/"/g, '""')}"`;
    };

    const getNameInitials = (name) => {
      const parts = (name || '').replace(/^Dra?\.\s+/i, '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '?';
      return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    };

    function StatusBadge({ label, className }) {
      return (
        <span className={`inline-flex items-center whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-semibold ring-1 ring-inset ${className}`}>
          {label}
        </span>
      );
    }

    function Modal({ title, onClose, maxWidth = 'max-w-md', children }) {
      const titleId = React.useId();

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby={titleId}
            className={`bg-white rounded-2xl ${maxWidth} w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto`}
          >
            <div className="flex items-center justify-between gap-4 pb-4 border-b border-slate-200">
              <h3 id={titleId} className="text-base font-bold text-slate-900">{title}</h3>
              <button
                type="button"
                onClick={onClose}
                aria-label="Fechar"
                className="w-9 h-9 -mr-2 inline-flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 outline-none focus-visible:ring-4 focus-visible:ring-slate-400/40"
              >
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function DashboardView({ appointments, patients, records, reviews = [], labSamples = [], currentUser, onNavigate, onOpenProntuario }) {
      const [period, setPeriod] = useState('semana'); // 'semana' | 'mes'

      const todayStr = getTodayDateStr();
      const todayAppointments = appointments
        .filter(a => a.data === todayStr && a.status !== 'cancelado')
        .sort((a, b) => a.horario.localeCompare(b.horario));
      const todayConsultas = todayAppointments.filter(a => a.tipo !== 'bloqueio');
      const pendingPayments = appointments.filter(a => a.statusPagamento === 'pendente');
      const failedNotifications = appointments.filter(a => a.notificacaoStatus === 'falha');
      const lateCancellations = appointments.filter(a => a.cancelamentoTardio);

      const nowTime = new Date().toTimeString().slice(0, 5);
      const nextAppt = todayConsultas.find(a => a.horario >= nowTime);
      const nextPatient = nextAppt ? findPatient(patients, nextAppt.pacienteId) : null;
      const pendingTotal = pendingPayments.reduce((acc, curr) => acc + (Number(curr.valor) || 0), 0);

      const periodDays = useMemo(() => {
        if (period === 'mes') {
          const [year, month] = todayStr.split('-').map(Number);
          const daysInMonth = new Date(year, month, 0).getDate();
          return Array.from({ length: daysInMonth }, (_, i) => `${todayStr.slice(0, 7)}-${String(i + 1).padStart(2, '0')}`);
        }
        const weekStart = shiftDateStr(todayStr, -parseDateStr(todayStr).getDay());
        return Array.from({ length: 7 }, (_, i) => shiftDateStr(weekStart, i));
      }, [period, todayStr]);

      const periodLabel = period === 'mes' ? 'Este mês' : 'Esta semana';
      const periodSet = new Set(periodDays);
      const periodConsultas = appointments.filter(a => a.tipo !== 'bloqueio' && periodSet.has(a.data));
      const keptConsultas = periodConsultas.filter(a => a.status !== 'cancelado');
      const paidConsultas = keptConsultas.filter(a => a.statusPagamento === 'pago');

      const funnel = [
        ['Agendadas', periodConsultas.length],
        ['Mantidas', keptConsultas.length],
        ['Lembrete entregue', keptConsultas.filter(a => ['enviado', 'reenviado'].includes(a.notificacaoStatus)).length],
        ['Pagas', paidConsultas.length]
      ];

      const chartData = periodDays.map(date => ({
        date,
        ativas: keptConsultas.filter(a => a.data === date).length,
        canceladas: periodConsultas.filter(a => a.data === date && a.status === 'cancelado').length
      }));
      const axisMax = Math.max(4, Math.ceil(Math.max(...chartData.map(d => d.ativas + d.canceladas)) / 2) * 2);

      // RF22, RN09 - Recebimentos do período por forma de pagamento
      const paymentTotals = Object.entries(
        paidConsultas.reduce((acc, a) => {
          const key = a.formaPagamento || 'Não informada';
          acc[key] = (acc[key] || 0) + (Number(a.valor) || 0);
          return acc;
        }, {})
      ).sort((a, b) => b[1] - a[1]);
      const paymentMax = paymentTotals.length > 0 ? paymentTotals[0][1] : 0;

      const pendingLabSamples = labSamples.filter(s => [1, 2, 3, 'ColetadoNaClinica', 'EnviadoAoLaboratorio', 'EmAnalise'].includes(s.status));

      // RF33, RN22 - Recorrência Preventiva: Pacientes sem consulta há 180+ dias
      const mapLastVisit = {};
      appointments.forEach(a => {
        if (a.status !== 'cancelado' && a.tipo !== 'bloqueio') {
          if (!mapLastVisit[a.pacienteId] || a.data > mapLastVisit[a.pacienteId]) mapLastVisit[a.pacienteId] = a.data;
        }
      });
      const now = new Date();
      const eligiblePreventive = patients.filter(p => p.status === 'ativo').map(p => {
        const last = mapLastVisit[p.id];
        if (!last) return null;
        const days = Math.floor((now - new Date(last)) / (1000 * 60 * 60 * 24));
        return days >= 180 ? p : null;
      }).filter(Boolean);

      const mediaSatisfacao = reviews.length > 0
        ? (reviews.reduce((s, r) => s + (Number(r.mediaGeral) || 5), 0) / reviews.length).toFixed(1)
        : '5.0';

      const pendencias = [
        {
          icon: 'alert',
          title: 'Lembretes não entregues',
          description: 'Reenvie pela agenda ou avise o paciente por telefone',
          count: failedNotifications.length,
          tab: 'agenda'
        },
        {
          icon: 'wallet',
          title: 'Cobranças pendentes',
          description: pendingPayments.length > 0 ? `${formatBRL(pendingTotal)} a receber` : 'Nenhum valor em aberto',
          count: pendingPayments.length,
          tab: 'financeiro'
        },
        {
          icon: 'clock',
          title: 'Cancelamentos tardios',
          description: 'Consultas canceladas com menos de 24 horas',
          count: lateCancellations.length,
          tab: 'agenda'
        },
        {
          icon: 'star',
          title: 'Ouvidoria & Satisfação',
          description: `Média de ${mediaSatisfacao}★ em ${reviews.length} avaliações`,
          count: reviews.length,
          tab: 'ouvidoria'
        },
        {
          icon: 'flask',
          title: 'Amostras Laboratoriais',
          description: pendingLabSamples.length > 0 ? `${pendingLabSamples.length} amostras em análise externa` : 'Todas as análises concluídas',
          count: pendingLabSamples.length,
          tab: 'laboratorio'
        },
        {
          icon: 'calendar',
          title: 'Retorno Preventivo (+180d)',
          description: eligiblePreventive.length > 0 ? `${eligiblePreventive.length} pacientes para fidelização (+10% OFF)` : 'Nenhum paciente pendente',
          count: eligiblePreventive.length,
          tab: 'agenda'
        }
      ];

      return (
        <div className="space-y-5 max-w-6xl mx-auto">
          <section className="flex flex-col lg:flex-row lg:items-end justify-between gap-4">
            <div>
              <p className="text-sm font-semibold text-emerald-700 first-letter:uppercase">
                {formatDateBR(todayStr, { weekday: 'long', day: 'numeric', month: 'long' })}
              </p>
              <h2 className="mt-1 text-2xl font-extrabold tracking-tight text-slate-900">Olá, {currentUser.name}</h2>
              <p className="mt-1 text-sm text-slate-600">
                {todayConsultas.length === 0
                  ? 'Nenhuma consulta marcada para hoje.'
                  : `${todayConsultas.length} ${todayConsultas.length === 1 ? 'consulta marcada' : 'consultas marcadas'} para hoje.`}
                {nextAppt && ` Próxima às ${nextAppt.horario}${nextPatient ? ` com ${nextPatient.nome}` : ''}.`}
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <div role="group" aria-label="Período dos indicadores" className="flex bg-slate-200/70 p-1 rounded-xl text-sm font-bold">
                {[['semana', 'Esta semana'], ['mes', 'Este mês']].map(([value, label]) => (
                  <button
                    key={value}
                    type="button"
                    onClick={() => setPeriod(value)}
                    aria-pressed={period === value}
                    className={`px-3 py-1.5 rounded-lg transition outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40 ${
                      period === value ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {label}
                  </button>
                ))}
              </div>
              {/* RQ10 - Ação principal em até 3 cliques */}
              <button onClick={() => onNavigate('agenda')} className={BTN_PRIMARY}>
                <Icon name="plus" />
                Nova consulta
              </button>
            </div>
          </section>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <MetricCard
              label="Consultas hoje"
              value={todayConsultas.length}
              subtext={nextAppt ? `Próxima às ${nextAppt.horario}` : 'Sem próximas hoje'}
              icon="calendar"
            />
            <MetricCard
              label="Pacientes ativos"
              value={patients.filter(p => p.status === 'ativo').length}
              subtext={`${patients.length} cadastrados`}
              icon="users"
            />
            <MetricCard
              label="A receber"
              value={formatBRL(pendingTotal)}
              subtext={`${pendingPayments.length} ${pendingPayments.length === 1 ? 'cobrança pendente' : 'cobranças pendentes'}`}
              icon="wallet"
            />
            <MetricCard
              label="Sessões registradas"
              value={records.length}
              subtext="No prontuário eletrônico"
              icon="clipboard"
            />
          </div>

          <div className="grid lg:grid-cols-2 gap-5 items-start">
            <section className="bg-white rounded-2xl border border-slate-200 p-5">
              <h3 className="text-base font-bold text-slate-900">Do agendamento ao pagamento</h3>
              <p className="text-xs text-slate-500 mt-0.5">{periodLabel}</p>

              {periodConsultas.length === 0 ? (
                <p className="py-8 text-center text-sm text-slate-500">Nenhuma consulta no período.</p>
              ) : (
                <dl className="mt-4 space-y-3">
                  {funnel.map(([label, count]) => {
                    const percent = Math.round((count / periodConsultas.length) * 100);
                    return (
                      <div key={label} className="grid grid-cols-[8.5rem_minmax(0,1fr)_4.5rem] items-center gap-3">
                        <dt className="text-sm text-slate-700">{label}</dt>
                        <div aria-hidden="true" className="h-3 rounded-full bg-slate-100">
                          <div className="h-3 rounded-full bg-emerald-600" style={{ width: `${percent}%` }}></div>
                        </div>
                        <dd className="text-right text-sm tabular-nums">
                          <span className="font-bold text-slate-900">{count}</span>
                          <span className="text-slate-500"> · {percent}%</span>
                        </dd>
                      </div>
                    );
                  })}
                </dl>
              )}
            </section>

            <section className="bg-white rounded-2xl border border-slate-200 p-5">
              <h3 className="text-base font-bold text-slate-900">Pendências</h3>
              <ul className="mt-4 space-y-2.5">
                {pendencias.map(item => (
                  <li key={item.title}>
                    <button
                      type="button"
                      onClick={() => onNavigate(item.tab)}
                      className="w-full flex items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-left transition hover:bg-slate-50 outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40"
                    >
                      <Icon name={item.icon} className={`w-5 h-5 ${item.count > 0 ? 'text-amber-600' : 'text-slate-400'}`} />
                      <span className="min-w-0 flex-1">
                        <span className="block text-sm font-bold text-slate-900">{item.title}</span>
                        <span className="block truncate text-xs text-slate-600">{item.description}</span>
                      </span>
                      <StatusBadge
                        label={String(item.count)}
                        className={item.count > 0 ? 'bg-amber-50 text-amber-900 ring-amber-600/30' : 'bg-slate-100 text-slate-600 ring-slate-500/20'}
                      />
                    </button>
                  </li>
                ))}
              </ul>
            </section>
          </div>

          <section className="bg-white rounded-2xl border border-slate-200 p-5">
            <div className="flex flex-wrap items-start justify-between gap-3">
              <div>
                <h3 className="text-base font-bold text-slate-900">Consultas por dia</h3>
                <p className="text-xs text-slate-500 mt-0.5">{periodLabel}</p>
              </div>
              <ul className="flex items-center gap-4 text-xs text-slate-700">
                <li className="inline-flex items-center gap-1.5">
                  <span aria-hidden="true" className="w-2.5 h-2.5 rounded-sm bg-emerald-600"></span>
                  Mantidas
                </li>
                <li className="inline-flex items-center gap-1.5">
                  <span aria-hidden="true" className="w-2.5 h-2.5 rounded-sm bg-[#4a3aa7]"></span>
                  Canceladas
                </li>
              </ul>
            </div>

            <div className="mt-8 flex gap-3">
              <div aria-hidden="true" className="w-5 h-44 flex flex-col justify-between text-right text-xs tabular-nums text-slate-500 -my-2">
                <span>{axisMax}</span>
                <span>{axisMax / 2}</span>
                <span>0</span>
              </div>

              <div className="relative flex-1 h-44">
                <div aria-hidden="true" className="absolute inset-0 flex flex-col justify-between">
                  <span className="border-t border-slate-100"></span>
                  <span className="border-t border-slate-100"></span>
                  <span className="border-t border-slate-300"></span>
                </div>

                <div className="absolute inset-0 flex items-end">
                  {chartData.map((day, index) => {
                    const total = day.ativas + day.canceladas;
                    const tooltipAlign = index < 2
                      ? 'left-0'
                      : index >= chartData.length - 2 ? 'right-0' : 'left-1/2 -translate-x-1/2';

                    return (
                      <div
                        key={day.date}
                        tabIndex={0}
                        aria-label={`${formatDateBR(day.date, { weekday: 'long', day: 'numeric', month: 'long' })}: ${day.ativas} mantidas, ${day.canceladas} canceladas`}
                        className="group relative flex-1 h-full flex flex-col items-center justify-end rounded-t-lg outline-none hover:bg-slate-50 focus-visible:bg-slate-50 focus-visible:ring-2 focus-visible:ring-emerald-500/50"
                      >
                        {day.canceladas > 0 && (
                          <span
                            className={`w-full max-w-[24px] rounded-t bg-[#4a3aa7] ${day.ativas > 0 ? 'mb-0.5' : ''}`}
                            style={{ height: `${(day.canceladas / axisMax) * 100}%` }}
                          ></span>
                        )}
                        {day.ativas > 0 && (
                          <span
                            className={`w-full max-w-[24px] bg-emerald-600 ${day.canceladas > 0 ? '' : 'rounded-t'}`}
                            style={{ height: `${(day.ativas / axisMax) * 100}%` }}
                          ></span>
                        )}

                        <div
                          aria-hidden="true"
                          className={`pointer-events-none absolute top-0 -translate-y-full z-10 hidden group-hover:block group-focus-visible:block whitespace-nowrap rounded-lg bg-slate-900 px-3 py-2 text-xs text-white shadow-lg ${tooltipAlign}`}
                        >
                          <p className="font-bold first-letter:uppercase">
                            {formatDateBR(day.date, { weekday: 'short', day: '2-digit', month: '2-digit' })}
                          </p>
                          <p className="mt-1 flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-sm bg-emerald-500"></span>
                            Mantidas: <span className="font-bold tabular-nums">{day.ativas}</span>
                          </p>
                          <p className="flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-sm bg-[#9085e9]"></span>
                            Canceladas: <span className="font-bold tabular-nums">{day.canceladas}</span>
                          </p>
                          {total === 0 && <p className="mt-1 text-slate-300">Sem consultas</p>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div aria-hidden="true" className="mt-2 flex gap-3">
              <span className="w-5"></span>
              <div className="flex-1 flex">
                {chartData.map(day => {
                  const dayNumber = Number(day.date.slice(8));
                  const isToday = day.date === todayStr;
                  const showLabel = period === 'semana' || isToday || dayNumber === 1 || dayNumber % 5 === 0;
                  return (
                    <span
                      key={day.date}
                      className={`flex-1 text-center text-xs tabular-nums ${isToday ? 'font-bold text-slate-900' : 'text-slate-500'}`}
                    >
                      {showLabel && (period === 'semana'
                        ? formatDateBR(day.date, { weekday: 'short', day: '2-digit' }).replace('.', '')
                        : dayNumber)}
                    </span>
                  );
                })}
              </div>
            </div>

            <details className="mt-4 text-sm">
              <summary className="cursor-pointer rounded-lg px-1 font-semibold text-emerald-700 outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40">
                Ver dados em tabela
              </summary>
              <div className="mt-3 overflow-x-auto">
                <table className="w-full min-w-[20rem] text-left text-sm">
                  <thead>
                    <tr className="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
                      <th scope="col" className="py-2 pr-4 font-bold">Dia</th>
                      <th scope="col" className="py-2 pr-4 font-bold text-right">Mantidas</th>
                      <th scope="col" className="py-2 font-bold text-right">Canceladas</th>
                    </tr>
                  </thead>
                  <tbody>
                    {chartData.map(day => (
                      <tr key={day.date} className="border-b border-slate-100 last:border-b-0">
                        <th scope="row" className="py-1.5 pr-4 font-normal text-slate-700">
                          {formatDateBR(day.date, { weekday: 'short', day: '2-digit', month: '2-digit' })}
                        </th>
                        <td className="py-1.5 pr-4 text-right tabular-nums text-slate-900">{day.ativas}</td>
                        <td className="py-1.5 text-right tabular-nums text-slate-900">{day.canceladas}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </details>
          </section>

          <section className="bg-white rounded-2xl border border-slate-200 p-5">
            <h3 className="text-base font-bold text-slate-900">Recebido por forma de pagamento</h3>
            <p className="text-xs text-slate-500 mt-0.5">{periodLabel} · consultas pagas</p>

            {paymentTotals.length === 0 ? (
              <p className="py-8 text-center text-sm text-slate-500">Nenhum pagamento recebido no período.</p>
            ) : (
              <dl className="mt-4 space-y-3">
                {paymentTotals.map(([forma, total]) => (
                  <div key={forma} className="grid grid-cols-[8.5rem_minmax(0,1fr)_6.5rem] items-center gap-3">
                    <dt className="truncate text-sm text-slate-700">{forma}</dt>
                    <div aria-hidden="true" className="h-3 rounded-full bg-slate-100">
                      <div className="h-3 rounded-full bg-emerald-600" style={{ width: `${(total / paymentMax) * 100}%` }}></div>
                    </div>
                    <dd className="text-right text-sm font-bold tabular-nums text-slate-900">{formatBRL(total)}</dd>
                  </div>
                ))}
              </dl>
            )}
          </section>

          <section className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div className="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-200">
              <h3 className="text-base font-bold text-slate-900">Atendimentos de hoje</h3>
              <button
                onClick={() => onNavigate('agenda')}
                className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-sm font-bold text-emerald-700 hover:text-emerald-800 outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40"
              >
                Ver agenda
                <Icon name="arrowRight" />
              </button>
            </div>

            {todayAppointments.length === 0 ? (
              <p className="px-5 py-10 text-center text-sm text-slate-500">Nenhum atendimento marcado para hoje.</p>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full min-w-[44rem] text-left text-sm">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
                      <th scope="col" className="px-5 py-2.5 font-bold">Horário</th>
                      <th scope="col" className="px-3 py-2.5 font-bold">Paciente</th>
                      <th scope="col" className="px-3 py-2.5 font-bold">Lembrete</th>
                      <th scope="col" className="px-3 py-2.5 font-bold">Pagamento</th>
                      <th scope="col" className="px-5 py-2.5 font-bold text-right">Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    {todayAppointments.map(appt => {
                      const patient = findPatient(patients, appt.pacienteId);
                      const isBlocked = appt.tipo === 'bloqueio';
                      const isNext = nextAppt && nextAppt.id === appt.id;
                      const notif = NOTIF_STATUS[appt.notificacaoStatus];
                      const isPaid = appt.statusPagamento === 'pago';

                      return (
                        <tr key={appt.id} className={`border-b border-slate-100 last:border-b-0 ${isNext ? 'bg-emerald-50/60' : ''}`}>
                          <td className="px-5 py-3 align-top">
                            <span className={`font-extrabold tabular-nums ${isBlocked ? 'text-slate-400' : 'text-slate-900'}`}>{appt.horario}</span>
                            {isNext && <span className="block text-xs font-bold text-emerald-700">Próximo</span>}
                          </td>

                          {isBlocked ? (
                            <td colSpan={4} className="px-3 py-3 text-slate-500">Horário bloqueado · {appt.observacoes}</td>
                          ) : (
                            <>
                              <td className="px-3 py-3 align-top max-w-[18rem]">
                                <p className="truncate font-bold text-slate-900">{patient ? patient.nome : 'Paciente não encontrado'}</p>
                                <p className="truncate text-xs text-slate-600">{appt.observacoes}</p>
                              </td>
                              <td className="px-3 py-3 align-top whitespace-nowrap text-slate-700">
                                {notif ? (
                                  <span className="inline-flex items-center gap-1.5">
                                    <span aria-hidden="true" className={`w-2 h-2 rounded-full ${notif.dot}`}></span>
                                    {notif.label}
                                  </span>
                                ) : '—'}
                              </td>
                              <td className="px-3 py-3 align-top whitespace-nowrap">
                                <span className="font-semibold tabular-nums text-slate-900">{formatBRL(appt.valor)}</span>
                                <span className="text-slate-500"> · {isPaid ? 'Pago' : 'Pendente'}</span>
                              </td>
                              <td className="px-5 py-3 align-top text-right">
                                {currentUser.role === 'Profissional' ? (
                                  <button
                                    onClick={() => onOpenProntuario(appt.pacienteId)}
                                    aria-label={`Abrir prontuário de ${patient ? patient.nome : 'paciente'}`}
                                    className={`${BTN_SMALL} whitespace-nowrap border-emerald-300 bg-white text-emerald-800 hover:bg-emerald-50 focus-visible:ring-emerald-500/40`}
                                  >
                                    Prontuário
                                    <Icon name="arrowRight" className="w-3.5 h-3.5" />
                                  </button>
                                ) : (
                                  <button
                                    onClick={() => onNavigate('agenda')}
                                    aria-label="Ver agendamento na agenda"
                                    className={`${BTN_SMALL} whitespace-nowrap border-slate-200 bg-white text-slate-700 hover:bg-slate-50 focus-visible:ring-slate-400/40`}
                                  >
                                    Ver agenda
                                    <Icon name="arrowRight" className="w-3.5 h-3.5" />
                                  </button>
                                )}
                              </td>
                            </>
                          )}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </section>
        </div>
      );
    }

    function MetricCard({ label, value, subtext, icon }) {
      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200">
          <span className="inline-flex w-10 h-10 items-center justify-center rounded-xl bg-emerald-50 text-emerald-700">
            {ICONS[icon] ? <Icon name={icon} className="w-5 h-5" /> : icon}
          </span>
          <div className="mt-4 text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">{value}</div>
          <div className="mt-1 text-sm font-semibold text-slate-700">{label}</div>
          <div className="mt-0.5 text-xs text-slate-500">{subtext}</div>
        </div>
      );
    }

    function AgendaView({ appointments, patients, labSamples, currentUser, setAppointments, showToast, registerLog, setDialogConfig, schedulePatientId, onScheduleHandled }) {
      // RN12 - O Profissional agenda na própria agenda; o Administrador agenda na agenda do profissional da clínica
      const agendaOwnerId = currentUser.role === 'Profissional'
        ? currentUser.id
        : (INITIAL_USERS.find(u => u.role === 'Profissional')?.id || currentUser.id);

      const [viewMode, setViewMode] = useState('dia'); // 'dia' | 'semana' (RF10)
      const [selectedDate, setSelectedDate] = useState(getTodayDateStr());
      const [showNewModal, setShowNewModal] = useState(false);
      const [showBlockModal, setShowBlockModal] = useState(false);
      const [showRescheduleModal, setShowRescheduleModal] = useState(null);
      const [whatsappModalData, setWhatsappModalData] = useState(null);
      // RF31, RN20 - Modal de Cancelamento com Motivo e Justificativa
      const [showCancelModal, setShowCancelModal] = useState(null);
      const [cancelMotivo, setCancelMotivo] = useState('ImprevistoPessoal');
      const [cancelJustificativa, setCancelJustificativa] = useState('');
      // RF33, RN22 - Visualização de Recorrência Preventiva (180+ dias)
      const [agendaTabFilter, setAgendaTabFilter] = useState('agenda'); // 'agenda' | 'prevencao'

      // Form State: Nova Consulta
      const [formPatientId, setFormPatientId] = useState('');
      const [formDate, setFormDate] = useState(selectedDate);
      const [formTime, setFormTime] = useState('09:00');
      const [formObs, setFormObs] = useState('');
      const [formValue, setFormValue] = useState(200);

      // Chegou pela tela de Pacientes: abre o formulário com o paciente já selecionado
      useEffect(() => {
        if (!schedulePatientId) return;
        const today = getTodayDateStr();
        setFormPatientId(schedulePatientId);
        setFormDate(selectedDate < today ? today : selectedDate);
        setShowNewModal(true);
        onScheduleHandled();
      }, [schedulePatientId]);

      // Form State: Bloqueio de Horário (RF11)
      const [blockReason, setBlockReason] = useState('Intervalo para almoço');
      const [blockTime, setBlockTime] = useState('12:00');

      // Form State: Remarcação (RF07)
      const [rescheduleDate, setRescheduleDate] = useState('');
      const [rescheduleTime, setRescheduleTime] = useState('14:00');

      // Filtro conforme perfil (RN12)
      const filteredAppointments = useMemo(() => {
        return appointments.filter(a => {
          if (currentUser.role === 'Profissional' && a.profissionalId !== currentUser.id) {
            return false;
          }
          if (viewMode === 'dia') {
            return a.data === selectedDate;
          }
          return true;
        });
      }, [appointments, currentUser, viewMode, selectedDate]);

      // Criação de Agendamento com Prevenção de Choque de Horários (RN01, RN02)
      const handleCreateAppointment = async (e) => {
        e.preventDefault();

        // RN16: só paciente ativo pode ser agendado
        const formPatient = patients.find(p => p.id === formPatientId);
        if (!formPatient || formPatient.status !== 'ativo') {
          showToast('Selecione um paciente ativo cadastrado.', 'error');
          return;
        }

        if (isPastSlot(formDate, formTime)) {
          showToast('Não é possível agendar em data ou horário que já passou.', 'error');
          return;
        }

        // Validação integrada com o backend C# (AgendaService - RN01, RN02)
        if (api.isConnected) {
          const apiRes = await api.agendarConsulta({
            pacienteId: formPatientId,
            profissionalId: agendaOwnerId,
            data: formDate,
            horario: formTime,
            duracaoMin: 60,
            observacoes: formObs,
            valor: Number(formValue) || 200
          });

          if (!apiRes.sucesso) {
            // Regra de Negócio barrada pelo backend C#
            setDialogConfig({
              title: 'Bloqueio de Regra de Negócio (RN01, RN02)',
              message: apiRes.erro,
              confirmLabel: 'Entendido',
              cancelLabel: 'Fechar',
              danger: true,
              onConfirm: () => {}
            });
            showToast(apiRes.erro, 'error');
            return;
          }

          setAppointments(prev => [...prev, apiRes.dados]);
          setShowNewModal(false);

          const pat = patients.find(p => p.id === formPatientId);
          showToast(`Consulta confirmada via API C# para ${pat?.nome} às ${formTime}!`);
          registerLog('Agendamento via API (RF06, RN01)', `Consulta marcada para ${pat?.nome} no dia ${formDate} às ${formTime}`);

          // Disparo de confirmação WhatsApp (RF12, RN03)
          setWhatsappModalData({
            titulo: 'Confirmação enviada por WhatsApp (RN03)',
            destinatario: `${pat?.nome} (${formatPhone(pat?.telefone)})`,
            mensagem: `Olá, ${pat?.nome}! Sua consulta na Clinix está confirmada para ${formatDateBR(formDate)} às ${formTime}. Enviaremos lembrete 24h antes!`
          });
          return;
        }

        // RN01 / RN02: Fallback local - checar sobreposição com outro compromisso do mesmo profissional
        const conflict = findOverlap(appointments, { data: formDate, horario: formTime, profissionalId: agendaOwnerId });

        if (conflict) {
          setDialogConfig({
            title: 'Horário já ocupado',
            message: `O horário ${formTime} em ${formatDateBR(formDate)} já está ocupado por outro compromisso. Escolha outro horário ou outra data.`,
            confirmLabel: 'Entendido',
            cancelLabel: 'Fechar',
            danger: true,
            onConfirm: () => {}
          });
          return;
        }

        const newAppt = {
          id: 'a_' + Date.now(),
          pacienteId: formPatientId,
          profissionalId: agendaOwnerId,
          data: formDate,
          horario: formTime,
          duracaoMin: 60,
          status: 'confirmado',
          tipo: 'consulta',
          observacoes: formObs || 'Consulta de rotina',
          valor: Math.max(0, Number(formValue)) || 200,
          statusPagamento: 'pendente',
          formaPagamento: 'Em aberto',
          notificacaoStatus: 'enviado', // RN03
          notificacaoTentativas: 1,
          cancelamentoTardio: false
        };

        setAppointments(prev => [...prev, newAppt]);
        setShowNewModal(false);

        const pat = patients.find(p => p.id === formPatientId);
        showToast(`Consulta confirmada para ${pat?.nome} às ${formTime}!`);
        registerLog('Agendamento de Consulta (RF06, RN01)', `Consulta marcada para ${pat?.nome} no dia ${formDate} às ${formTime}`);

        // Exibição da confirmação automática enviada por WhatsApp (RF12, RN03)
        setWhatsappModalData({
          titulo: 'Confirmação enviada por WhatsApp',
          destinatario: `${pat?.nome} (${formatPhone(pat?.telefone)})`,
          mensagem: `Olá, ${pat?.nome}! Sua consulta na Clinix está confirmada para ${formatDateBR(formDate)} às ${formTime}. Enviaremos lembrete 24h antes!`
        });
      };

      // Bloquear Horário na Agenda (RF11)
      const handleBlockSlot = (e) => {
        e.preventDefault();

        if (isPastSlot(selectedDate, blockTime)) {
          showToast('Não é possível bloquear um horário que já passou.', 'error');
          return;
        }

        // Checar conflito prévio
        const conflict = findOverlap(appointments, { data: selectedDate, horario: blockTime, profissionalId: agendaOwnerId });

        if (conflict) {
          showToast('Horário já ocupado por consulta. Remarque-a antes de bloquear.', 'error');
          return;
        }

        const blockAppt = {
          id: 'b_' + Date.now(),
          pacienteId: null,
          profissionalId: agendaOwnerId,
          data: selectedDate,
          horario: blockTime,
          duracaoMin: 60,
          status: 'bloqueado',
          tipo: 'bloqueio',
          observacoes: blockReason,
          valor: 0,
          statusPagamento: 'isento',
          formaPagamento: 'N/A',
          notificacaoStatus: 'nao_aplicavel',
          notificacaoTentativas: 0,
          cancelamentoTardio: false
        };

        setAppointments(prev => [...prev, blockAppt]);
        setShowBlockModal(false);
        showToast(`Horário ${blockTime} bloqueado.`);
        registerLog('Bloqueio de Agenda (RF11)', `Bloqueado ${blockTime} em ${selectedDate}: ${blockReason}`);
      };

      // Remarcação de Consulta (RF07)
      const handleRescheduleSubmit = (e) => {
        e.preventDefault();
        const appt = showRescheduleModal;

        if (isPastSlot(rescheduleDate, rescheduleTime)) {
          showToast('Não é possível remarcar para data ou horário que já passou.', 'error');
          return;
        }

        const conflict = findOverlap(appointments, {
          data: rescheduleDate,
          horario: rescheduleTime,
          duracaoMin: appt.duracaoMin,
          profissionalId: appt.profissionalId,
          ignoreId: appt.id
        });

        if (conflict) {
          showToast('Horário de remarcação já ocupado! Selecione outro.', 'error');
          return;
        }

        setAppointments(prev => prev.map(a => {
          if (a.id === appt.id) {
            return {
              ...a,
              data: rescheduleDate,
              horario: rescheduleTime,
              status: 'remarcado',
              notificacaoStatus: 'enviado',
              notificacaoTentativas: 1
            };
          }
          return a;
        }));

        setShowRescheduleModal(null);
        showToast('Consulta remarcada.');
        registerLog('Remarcação de Consulta (RF07)', `Consulta ${appt.id} transferida para ${rescheduleDate} às ${rescheduleTime}`);
      };

      // RF08, RN10, RF31, RN20 - Cancelamento com Motivo Estruturado e Regra < 24h
      const handleCancelAppointment = (appt) => {
        setShowCancelModal(appt);
        setCancelMotivo('ImprevistoPessoal');
        setCancelJustificativa('');
      };

      const handleConfirmCancelWithReason = async (e) => {
        e.preventDefault();
        const appt = showCancelModal;
        if (!appt) return;

        const apptDate = new Date(`${appt.data}T${appt.horario}`);
        const now = new Date();
        const diffHours = (apptDate - now) / (1000 * 60 * 60);
        let isTardio = diffHours > 0 && diffHours < 24;

        if (api.isConnected) {
          const res = await api.cancelarAgendamento(appt.id, cancelMotivo, cancelJustificativa);
          if (!res.sucesso) {
            showToast(res.erro || 'Não foi possível cancelar a consulta na API.', 'error');
            return;
          }
          if (res.cancelamentoTardio !== undefined) {
            isTardio = res.cancelamentoTardio;
          }
        }

        setAppointments(prev => prev.map(a => {
          if (a.id === appt.id) {
            return {
              ...a,
              status: 'cancelado',
              cancelamentoTardio: isTardio,
              motivoCancelamento: cancelMotivo,
              justificativaCancelamento: cancelJustificativa.trim() || null
            };
          }
          return a;
        }));

        setShowCancelModal(null);
        showToast(`Consulta cancelada. Motivo: ${cancelMotivo}`);
        registerLog('Cancelamento com Motivo (RF31, RN20)', `Consulta ID ${appt.id} cancelada por ${cancelMotivo}. Tardio: ${isTardio ? 'SIM' : 'NÃO'}`);
      };

      // Simulação do Reenvio de WhatsApp (RN14)
      const handleRetryWhatsapp = (apptId) => {
        setAppointments(prev => prev.map(a => {
          if (a.id === apptId) {
            return { ...a, notificacaoStatus: 'reenviado', notificacaoTentativas: a.notificacaoTentativas + 1 };
          }
          return a;
        }));
        showToast('Lembrete reenviado.');
        registerLog('Reenvio de WhatsApp (RN14)', `Notificação reenviada para consulta ${apptId}`);
      };

      const isAllDates = viewMode === 'semana';
      const [calMonth, setCalMonth] = useState(selectedDate.slice(0, 7));
      const todayStr = getTodayDateStr();
      const pad2 = (n) => String(n).padStart(2, '0');

      const sortedAppointments = [...filteredAppointments].sort(
        (a, b) => (a.data + a.horario).localeCompare(b.data + b.horario)
      );
      const consultaCount = filteredAppointments.filter(a => a.tipo !== 'bloqueio' && a.status !== 'cancelado').length;

      // RN01, RN02 - Indicador de conflito em tempo real no formulário
      const hasFormConflict = Boolean(findOverlap(appointments, { data: formDate, horario: formTime, profissionalId: agendaOwnerId }));

      // RN12 - O calendário marca apenas os dias com agendamentos visíveis ao perfil
      const countByDate = appointments.reduce((acc, a) => {
        if (a.status === 'cancelado') return acc;
        if (currentUser.role === 'Profissional' && a.profissionalId !== currentUser.id) return acc;
        acc[a.data] = (acc[a.data] || 0) + 1;
        return acc;
      }, {});

      const [calYear, calMonthNum] = calMonth.split('-').map(Number);
      const firstWeekday = new Date(calYear, calMonthNum - 1, 1).getDay();
      const daysInMonth = new Date(calYear, calMonthNum, 0).getDate();
      const calendarCells = [
        ...Array(firstWeekday).fill(null),
        ...Array.from({ length: daysInMonth }, (_, i) => `${calMonth}-${pad2(i + 1)}`)
      ];

      const shiftMonth = (delta) => {
        const date = new Date(calYear, calMonthNum - 1 + delta, 1);
        setCalMonth(`${date.getFullYear()}-${pad2(date.getMonth() + 1)}`);
      };

      const selectDay = (dateStr) => {
        setSelectedDate(dateStr);
        setCalMonth(dateStr.slice(0, 7));
        setViewMode('dia');
      };

      const getEndTime = (appt) => {
        const [hours, minutes] = appt.horario.split(':').map(Number);
        const total = hours * 60 + minutes + (appt.duracaoMin || 60);
        return `${pad2(Math.floor(total / 60) % 24)}:${pad2(total % 60)}`;
      };

      const STATUS_DOT = {
        confirmado: 'bg-emerald-500',
        remarcado: 'bg-sky-500',
        bloqueado: 'bg-slate-400',
        cancelado: 'bg-rose-400'
      };
      const NAV_BTN = 'w-9 h-9 inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 outline-none focus-visible:ring-4 focus-visible:ring-slate-400/40';

      return (
        <div className="space-y-5 max-w-6xl mx-auto">
          {/* RF33, RN22 - Banner de Recorrência Preventiva e Fidelidade */}
          {(() => {
            const mapLast = {};
            appointments.forEach(a => {
              if (a.status !== 'cancelado' && a.tipo !== 'bloqueio') {
                if (!mapLast[a.pacienteId] || a.data > mapLast[a.pacienteId]) mapLast[a.pacienteId] = a.data;
              }
            });
            const now = new Date();
            const eligible = patients.filter(p => p.status === 'ativo').map(p => {
              const last = mapLast[p.id];
              if (!last) return null;
              const days = Math.floor((now - new Date(last)) / (1000 * 60 * 60 * 24));
              return days >= 180 ? { ...p, last, days } : null;
            }).filter(Boolean);

            if (eligible.length === 0) return null;

            return (
              <div className="bg-gradient-to-r from-emerald-50 via-teal-50 to-emerald-100/60 border border-emerald-200 p-4 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-3 shadow-sm">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-lg shrink-0 shadow">
                    🔁
                  </div>
                  <div>
                    <h3 className="text-sm font-extrabold text-emerald-950">
                      Recorrência Preventiva: {eligible.length} {eligible.length === 1 ? 'paciente elegível' : 'pacientes elegíveis'} para retorno semestral (+180 dias)
                    </h3>
                    <p className="text-xs text-emerald-800">
                      Incentivo de fidelização ativa: convide pelo WhatsApp oferecendo <strong>10% de desconto fidelidade</strong> com o cupom <code>CHECKUP10</code> (RF33, RN22).
                    </p>
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  {eligible.slice(0, 2).map(p => (
                    <button
                      key={p.id}
                      onClick={() => {
                        const msg = `Olá, ${p.nome}! Faz mais de 6 meses desde o seu último check-up preventivo na Clinix. Sua saúde e bem-estar são prioridade! Agende seu retorno semestral essa semana e garanta 10% de desconto com o cupom CHECKUP10. Link: https://clinix.com.br/agendamento`;
                        const cleanTel = onlyDigits(p.telefone);
                        window.open(`https://api.whatsapp.com/send?phone=55${cleanTel}&text=${encodeURIComponent(msg)}`, '_blank');
                        showToast(`Convite de fidelidade gerado para ${p.nome}!`);
                        registerLog('Convite de Retorno Preventivo (RF33, RN22)', `Envio de WhatsApp para ${p.nome} (+${p.days} dias)`);
                      }}
                      className="px-3 py-1.5 rounded-xl bg-white text-emerald-800 border border-emerald-300 font-bold text-xs hover:bg-emerald-50 shadow-sm flex items-center gap-1.5 transition"
                    >
                      <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                      Convidar {p.nome.split(' ')[0]} (+10% OFF)
                    </button>
                  ))}
                </div>
              </div>
            );
          })()}

          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              <button type="button" onClick={() => selectDay(todayStr)} className={BTN_SECONDARY}>
                Hoje
              </button>

              {/* RF10 - Alternância de visão da agenda */}
              <div role="group" aria-label="Período exibido" className="flex bg-slate-200/70 p-1 rounded-xl text-sm font-bold">
                {[['dia', 'Dia'], ['semana', 'Todas as datas']].map(([mode, label]) => (
                  <button
                    key={mode}
                    type="button"
                    onClick={() => setViewMode(mode)}
                    aria-pressed={viewMode === mode}
                    className={`px-3 py-1.5 rounded-lg transition outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40 ${
                      viewMode === mode ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {label}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button onClick={() => setShowBlockModal(true)} className={BTN_SECONDARY}>
                <Icon name="ban" />
                Bloquear horário
              </button>
              <button
                onClick={() => { setFormDate(selectedDate); setShowNewModal(true); }}
                className={BTN_PRIMARY}
              >
                <Icon name="plus" />
                Novo agendamento
              </button>
            </div>
          </div>

          <div className="grid lg:grid-cols-5 gap-5 items-start">
            <section aria-label="Calendário" className="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5">
              <div className="flex items-center justify-between gap-3 mb-4">
                <h2 className="text-base font-bold text-slate-900 first-letter:uppercase" aria-live="polite">
                  {formatDateBR(`${calMonth}-01`, { month: 'long', year: 'numeric' })}
                </h2>
                <div className="flex items-center gap-1.5">
                  <button type="button" onClick={() => shiftMonth(-1)} aria-label="Mês anterior" className={NAV_BTN}>
                    <Icon name="chevronLeft" />
                  </button>
                  <button type="button" onClick={() => shiftMonth(1)} aria-label="Próximo mês" className={NAV_BTN}>
                    <Icon name="chevronRight" />
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-7 gap-1 text-center">
                {['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(day => (
                  <span key={day} className="pb-2 text-xs font-bold text-slate-500">{day}</span>
                ))}

                {calendarCells.map((dateStr, index) => {
                  if (!dateStr) return <span key={`vazio-${index}`}></span>;

                  const count = countByDate[dateStr] || 0;
                  const isSelected = !isAllDates && dateStr === selectedDate;
                  const isToday = dateStr === todayStr;

                  return (
                    <button
                      key={dateStr}
                      type="button"
                      onClick={() => selectDay(dateStr)}
                      aria-pressed={isSelected}
                      aria-label={`${formatDateBR(dateStr, { weekday: 'long', day: 'numeric', month: 'long' })}${
                        count > 0 ? `, ${count} ${count === 1 ? 'agendamento' : 'agendamentos'}` : ''
                      }`}
                      className={`relative h-12 rounded-xl text-sm font-semibold tabular-nums transition outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40 ${
                        isSelected
                          ? 'bg-emerald-600 text-white'
                          : isToday
                            ? 'text-emerald-700 ring-1 ring-inset ring-emerald-500 hover:bg-emerald-50'
                            : 'text-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      {Number(dateStr.slice(8))}
                      {count > 0 && (
                        <span
                          aria-hidden="true"
                          className={`absolute bottom-1.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-emerald-500'}`}
                        ></span>
                      )}
                    </button>
                  );
                })}
              </div>

              <p className="mt-4 flex items-center gap-2 text-xs text-slate-500">
                <span aria-hidden="true" className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                Dia com agendamento
              </p>
            </section>

            <section className="lg:col-span-3 bg-white rounded-2xl border border-slate-200 overflow-hidden">
              <div className="flex flex-wrap items-center justify-between gap-2 px-5 py-4 border-b border-slate-200">
                <h2 className="text-base font-bold text-slate-900">
                  {isAllDates
                    ? 'Todas as datas'
                    : `${selectedDate === todayStr ? 'Hoje — ' : ''}${formatDateBR(selectedDate, { weekday: 'long', day: 'numeric', month: 'long' })}`}
                </h2>
                <span aria-live="polite">
                  <StatusBadge
                    label={consultaCount === 1 ? '1 consulta' : `${consultaCount} consultas`}
                    className="bg-emerald-50 text-emerald-800 ring-emerald-600/20"
                  />
                </span>
              </div>

              {sortedAppointments.length === 0 ? (
                <div className="px-5 py-12 text-center">
                  <p className="text-sm font-semibold text-slate-700">Nenhum agendamento {isAllDates ? 'cadastrado' : 'nesta data'}.</p>
                  <button
