              <button onClick={() => setVersionModalRecord(null)} className={`${BTN_PRIMARY} w-full mt-5`}>Fechar</button>
            </Modal>
          )}
        </div>
      );
    }

    function FinanceiroView({ appointments, patients, setAppointments, showToast, registerLog }) {
      const [filterStatus, setFilterStatus] = useState('todos'); // 'todos', 'pago', 'pendente'
      const [filterPatientId, setFilterPatientId] = useState('todos');
      // RF30, RN19 - Pagamento Dividido / Misto
      const [showSplitModal, setShowSplitModal] = useState(null);
      const [splitEntrada, setSplitEntrada] = useState(100);
      const [splitFormaEntrada, setSplitFormaEntrada] = useState('Pix');
      const [splitSaldo, setSplitSaldo] = useState(100);
      const [splitFormaSaldo, setSplitFormaSaldo] = useState('Cartão de Crédito');
      const [splitSaldoPago, setSplitSaldoPago] = useState(false);

      const filtered = appointments.filter(a => {
        if (a.tipo === 'bloqueio') return false;
        if (filterStatus !== 'todos' && a.statusPagamento !== filterStatus) return false;
        if (filterPatientId !== 'todos' && a.pacienteId !== filterPatientId) return false;
        return true;
      });

      // Cálculos do Resumo Mensal (RF22, RN09, RQ16)
      const totalFaturado = appointments
        .filter(a => a.statusPagamento === 'pago')
        .reduce((sum, a) => sum + (Number(a.valor) || 0), 0);

      const totalPendente = appointments
        .filter(a => a.statusPagamento === 'pendente')
        .reduce((sum, a) => sum + (Number(a.valor) || 0), 0);

      const totalConsultas = appointments.filter(a => a.status !== 'cancelado' && a.tipo !== 'bloqueio').length;

      // RF30, RN19 - Abrir e Salvar Pagamento Dividido
      const handleOpenSplit = (appt) => {
        setShowSplitModal(appt);
        const valorTotal = Number(appt.valor) || 200;
        const metade = Math.round(valorTotal / 2);
        setSplitEntrada(metade);
        setSplitSaldo(valorTotal - metade);
        setSplitFormaEntrada('Pix');
        setSplitFormaSaldo('Cartão de Crédito');
        setSplitSaldoPago(false);
      };

      const handleConfirmSplit = async (e) => {
        e.preventDefault();
        const appt = showSplitModal;
        if (!appt) return;

        const entradaNum = Number(splitEntrada);
        const saldoNum = Number(splitSaldo);
        if (entradaNum <= 0 || saldoNum <= 0) {
          showToast('Entrada e Saldo devem ser maiores que zero.', 'error');
          return;
        }

        if (api.isConnected) {
          const res = await api.registrarPagamentoDividido(appt.id, {
            valorEntrada: entradaNum,
            formaEntrada: splitFormaEntrada,
            valorSaldo: saldoNum,
            formaSaldo: splitFormaSaldo,
            saldoPago: splitSaldoPago
          });
          if (!res.sucesso) {
            console.warn('API split aviso:', res.erro);
          }
        }

        setAppointments(prev => prev.map(a => {
          if (a.id === appt.id) {
            return {
              ...a,
              pagamentoDividido: true,
              valorEntrada: entradaNum,
              formaEntrada: splitFormaEntrada,
              statusEntrada: 'pago',
              valorSaldo: saldoNum,
              formaSaldo: splitFormaSaldo,
              statusSaldo: splitSaldoPago ? 'pago' : 'pendente',
              statusPagamento: splitSaldoPago ? 'pago' : 'parcial',
              formaPagamento: `Entrada: R$ ${entradaNum.toFixed(2)} (${splitFormaEntrada}) + Saldo: R$ ${saldoNum.toFixed(2)} (${splitFormaSaldo})`
            };
          }
          return a;
        }));

        setShowSplitModal(null);
        showToast('Pagamento dividido registrado com sucesso (RF30, RN19)!');
        registerLog('Pagamento Dividido (RF30, RN19)', `Entrada R$ ${entradaNum} (${splitFormaEntrada}) + Saldo R$ ${saldoNum} (${splitFormaSaldo})`);
      };

      // Alternar status de pagamento (RN07, RN08, RF20)
      const handleTogglePayment = (apptId) => {
        setAppointments(prev => prev.map(a => {
          if (a.id === apptId) {
            const nextStatus = a.statusPagamento === 'pago' ? 'pendente' : 'pago';
            const nextForma = nextStatus === 'pago' ? 'Pix' : 'Em aberto';
            return { ...a, statusPagamento: nextStatus, formaPagamento: nextForma };
          }
          return a;
        }));
        showToast('Status financeiro atualizado com sucesso (RF20)!');
        registerLog('Atualização de Pagamento (RF20, RN08)', `Status modificado para consulta ${apptId}`);
      };

      // Exportação de Relatório CSV (RF25)
      const handleExportCSV = () => {
        let csv = 'Data,Horario,Paciente,Valor,StatusPagamento,FormaPagamento\n';
        filtered.forEach(a => {
          const pat = findPatient(patients, a.pacienteId);
          csv += [a.data, a.horario, pat?.nome || 'N/A', a.valor, a.statusPagamento, a.formaPagamento].map(csvCell).join(',') + '\n';
        });
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `relatorio_financeiro_${getTodayDateStr()}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('Planilha CSV gerada com sucesso (RF25)!');
        registerLog('Exportação CSV (RF25)', 'Relatório financeiro exportado em formato tabular');
      };

      // Exportação de Relatório (RF25)
      const handlePrint = () => {
        window.print();
        registerLog('Exportação de Relatório (RF25)', 'Relatório financeiro exportado para PDF / Impressão');
      };

      const totalGeral = totalFaturado + totalPendente;
      const taxaRecebimento = totalGeral > 0 ? Math.round((totalFaturado / totalGeral) * 100) : 0;

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Barra de Progresso da Arrecadação */}
          <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
            <div className="flex items-center justify-between text-xs mb-2">
              <span className="font-bold text-slate-700">Taxa de Liquidação Financeira: {taxaRecebimento}% recebido</span>
              <span className="text-slate-500 font-semibold">Total Geral: R$ {totalGeral.toFixed(2)}</span>
            </div>
            <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
              <div
                className="bg-emerald-500 h-2.5 rounded-full transition-all duration-500"
                style={{ width: `${taxaRecebimento}%` }}
              ></div>
            </div>
          </div>

          {/* Cards do Resumo Mensal (RF22) */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500">Total Faturado (Pago)</span>
              <div className="text-2xl font-bold text-emerald-700 my-1">R$ {totalFaturado.toFixed(2)}</div>
              <span className="text-[11px] text-slate-400">Receitas liquidadas no período</span>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500">Total Pendente (RN08)</span>
              <div className="text-2xl font-bold text-amber-600 my-1">R$ {totalPendente.toFixed(2)}</div>
              <span className="text-[11px] text-slate-400">Em cobrança até liquidação</span>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500">Total de Atendimentos</span>
              <div className="text-2xl font-bold text-slate-900 my-1">{totalConsultas}</div>
              <span className="text-[11px] text-slate-400">Sessões confirmadas no mês</span>
            </div>
          </div>

          {/* Filtros e Ação de Exportação (RF24, RF25) */}
          <div className="no-print bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-400 uppercase">Status:</span>
                <select
                  value={filterStatus}
                  onChange={e => setFilterStatus(e.target.value)}
                  className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 outline-none"
                >
                  <option value="todos">Todos</option>
                  <option value="pago">Somente Pagos</option>
                  <option value="pendente">Somente Pendentes (RF21)</option>
                </select>
              </div>

              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-400 uppercase">Paciente:</span>
                <select
                  value={filterPatientId}
                  onChange={e => setFilterPatientId(e.target.value)}
                  className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 outline-none"
                >
                  <option value="todos">Todos os Pacientes</option>
                  {patients.map(p => (
                    <option key={p.id} value={p.id}>{p.nome}</option>
                  ))}
                </select>
              </div>
            </div>

            <button
              onClick={handlePrint}
              className="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-sm"
            >
              <span>🖨️</span>
              <span>Exportar PDF / Imprimir (RF25)</span>
            </button>
          </div>

          {/* Tabela de Lançamentos */}
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-4 bg-slate-50 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between">
              <span>Extrato Consolidado de Atendimentos & Honorários (RF24)</span>
              <span className="text-slate-400 font-normal">Exatidão garantida por RQ16</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-700">
                <thead className="bg-slate-50 text-slate-400 uppercase text-[10px] font-bold border-b border-slate-200">
                  <tr>
                    <th className="p-3.5">Data / Hora</th>
                    <th className="p-3.5">Paciente</th>
                    <th className="p-3.5">Valor (R$)</th>
                    <th className="p-3.5">Forma</th>
                    <th className="p-3.5">Status</th>
                    <th className="p-3.5 no-print text-right">Ação</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filtered.map(appt => {
                    const patient = findPatient(patients, appt.pacienteId);
                    const isPaid = appt.statusPagamento === 'pago';

                    return (
                      <tr key={appt.id} className="hover:bg-slate-50 transition">
                        <td className="p-3.5 font-medium">{appt.data} às {appt.horario}</td>
                        <td className="p-3.5 font-bold text-slate-800">{patient?.nome || '—'}</td>
                        <td className="p-3.5 font-bold text-slate-900">R$ {Number(appt.valor).toFixed(2)}</td>
                        <td className="p-3.5 text-slate-500">{appt.formaPagamento}</td>
                        <td className="p-3.5">
                          <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] ${
                            isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                          }`}>
                            {appt.statusPagamento.toUpperCase()}
                          </span>
                        </td>
                        <td className="p-3.5 no-print text-right space-x-2">
                          <button
                            onClick={() => handleOpenSplit(appt)}
                            title="Dividir pagamento entre entrada e saldo restante (RF30)"
                            className="inline-flex items-center gap-1 text-xs text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2 py-1 rounded-lg border border-emerald-200 font-bold transition"
                          >
                            <Icon name="split" className="w-3 h-3" />
                            Dividir (RF30)
                          </button>
                          <button
                            onClick={() => handleTogglePayment(appt.id)}
                            className="text-xs text-slate-600 hover:underline font-bold"
                          >
                            Alternar para {isPaid ? 'Pendente' : 'Pago'}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* RF30, RN19 - Modal de Pagamento Dividido (Entrada + Saldo) */}
          {showSplitModal && (
            <Modal title="Dividir Pagamento da Consulta (RF30, RN19)" maxWidth="max-w-md" onClose={() => setShowSplitModal(null)}>
              <form onSubmit={handleConfirmSplit} className="space-y-4 mt-5">
                <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 text-xs">
                  <div className="flex justify-between font-bold text-slate-900">
                    <span>Valor Total do Atendimento:</span>
                    <span className="text-emerald-700 text-sm">{formatBRL(showSplitModal.valor)}</span>
                  </div>
                  <p className="text-slate-500 mt-1">Divida a liquidação financeira entre valor de entrada (sinal) e saldo restante.</p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3.5 rounded-2xl border border-emerald-100 bg-emerald-50/50">
                  <div>
                    <label htmlFor="split-entrada" className={LABEL_CLASS}>Valor da Entrada (R$)</label>
                    <input
                      id="split-entrada"
                      type="number"
                      min="1"
                      max={showSplitModal.valor - 1}
                      step="0.01"
                      required
                      value={splitEntrada}
                      onChange={e => {
                        const val = Number(e.target.value);
                        setSplitEntrada(val);
                        setSplitSaldo(Math.max(0, Number(showSplitModal.valor) - val));
                      }}
                      className={FIELD_CLASS}
                    />
                  </div>
                  <div>
                    <label htmlFor="split-forma-entrada" className={LABEL_CLASS}>Forma de Entrada</label>
                    <select
                      id="split-forma-entrada"
                      value={splitFormaEntrada}
                      onChange={e => setSplitFormaEntrada(e.target.value)}
                      className={FIELD_CLASS}
                    >
                      <option value="Pix">Pix Instantâneo</option>
                      <option value="Dinheiro">Dinheiro Espécie</option>
                      <option value="Cartão de Débito">Cartão de Débito</option>
                      <option value="Cartão de Crédito">Cartão de Crédito</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3.5 rounded-2xl border border-blue-100 bg-blue-50/50">
                  <div>
                    <label htmlFor="split-saldo" className={LABEL_CLASS}>Saldo Restante (R$)</label>
                    <input
                      id="split-saldo"
                      type="number"
                      readOnly
                      value={splitSaldo.toFixed(2)}
                      className={`${FIELD_CLASS} !bg-slate-100 font-bold text-slate-700`}
                    />
                  </div>
                  <div>
                    <label htmlFor="split-forma-saldo" className={LABEL_CLASS}>Forma do Saldo</label>
                    <select
                      id="split-forma-saldo"
                      value={splitFormaSaldo}
                      onChange={e => setSplitFormaSaldo(e.target.value)}
                      className={FIELD_CLASS}
                    >
                      <option value="Cartão de Crédito">Cartão de Crédito (Parcelado)</option>
                      <option value="Boleto">Boleto Bancário</option>
                      <option value="Pix">Pix no Retorno</option>
                      <option value="Dinheiro">Dinheiro na Saída</option>
                    </select>
                  </div>
                </div>

                <label className="flex items-center gap-2 cursor-pointer p-2 rounded-xl hover:bg-slate-50 transition">
                  <input
                    type="checkbox"
                    checked={splitSaldoPago}
                    onChange={e => setSplitSaldoPago(e.target.checked)}
                    className="w-4 h-4 text-emerald-600 rounded"
                  />
                  <span className="text-xs font-bold text-slate-700">Saldo restante já foi liquidado agora? (Marcar como 100% Pago)</span>
                </label>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowSplitModal(null)} className={BTN_SECONDARY}>Cancelar</button>
                  <button type="submit" className={BTN_PRIMARY}>Salvar Divisão de Pagamento</button>
                </div>
              </form>
            </Modal>
          )}
        </div>
      );
    }

    /* =========================================================================
       OUVIDORIA & AVALIAÇÕES DE ATENDIMENTO (RF32, RN21)
       ========================================================================= */
    function OuvidoriaView({ reviews, setReviews, appointments, patients, currentUser, showToast, registerLog }) {
      const [showNewModal, setShowNewModal] = useState(false);
      const [pacienteId, setPacienteId] = useState('');
      const [notaRecepcao, setNotaRecepcao] = useState(5);
      const [notaAtendimentoClinico, setNotaAtendimentoClinico] = useState(5);
      const [notaEspacoFisico, setNotaEspacoFisico] = useState(5);
      const [comentario, setComentario] = useState('');
      const [anonimo, setAnonimo] = useState(false);

      const totalReviews = reviews.length;
      const mediaGeral = totalReviews > 0
        ? (reviews.reduce((s, r) => s + (Number(r.mediaGeral) || 5), 0) / totalReviews).toFixed(1)
        : '5.0';
      const mediaRecepcao = totalReviews > 0
        ? (reviews.reduce((s, r) => s + (Number(r.notaRecepcao) || 5), 0) / totalReviews).toFixed(1)
        : '5.0';
      const mediaClinica = totalReviews > 0
        ? (reviews.reduce((s, r) => s + (Number(r.notaAtendimentoClinico) || 5), 0) / totalReviews).toFixed(1)
        : '5.0';
      const mediaEspaco = totalReviews > 0
        ? (reviews.reduce((s, r) => s + (Number(r.notaEspacoFisico) || 5), 0) / totalReviews).toFixed(1)
        : '5.0';

      const handleSaveReview = async (e) => {
        e.preventDefault();
        const pat = findPatient(patients, pacienteId);
        const mGeral = Number(((notaRecepcao + notaAtendimentoClinico + notaEspacoFisico) / 3).toFixed(1));

        if (api.isConnected) {
          const res = await api.registrarAvaliacao({
            agendamentoId: 1,
            notaRecepcao,
            notaAtendimentoClinico,
            notaEspacoFisico,
            comentarioOuvidoria: comentario,
            anonimo
          });
          if (res.sucesso && res.dados) {
            setReviews(prev => [res.dados, ...prev]);
            showToast('Avaliação de atendimento registrada na API (RF32)!');
            registerLog('Avaliação de Atendimento (RF32, RN21)', `Nova avaliação: Média ${mGeral}★`);
            setShowNewModal(false);
            return;
          }
        }

        const newRev = {
          id: Date.now(),
          pacienteId: anonimo ? null : pacienteId,
          pacienteNome: anonimo ? 'Anônimo (Sigilo LGPD)' : (pat?.nome || 'Paciente'),
          dataCriacao: new Date().toISOString(),
          notaRecepcao,
          notaAtendimentoClinico,
          notaEspacoFisico,
          mediaGeral: mGeral,
          comentarioOuvidoria: comentario.trim() || 'Sem comentários adicionais.',
          anonimo
        };
        setReviews(prev => [newRev, ...prev]);
        showToast('Avaliação registrada com sucesso!');
        registerLog('Avaliação de Atendimento (RF32, RN21)', `Nova avaliação: Média ${mGeral}★`);
        setShowNewModal(false);
      };

      const renderStars = (nota) => {
        return (
          <div className="flex text-amber-400 text-sm">
            {[1, 2, 3, 4, 5].map(star => (
              <span key={star} className={star <= nota ? 'text-amber-400' : 'text-slate-200'}>★</span>
            ))}
          </div>
        );
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Header e Ação */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-gradient-to-r from-emerald-800 to-teal-900 text-white p-6 rounded-3xl shadow-lg">
            <div>
              <span className="text-xs uppercase font-extrabold tracking-wider text-emerald-300">Gestão de Qualidade & Satisfação</span>
              <h2 className="text-2xl font-extrabold mt-1">Ouvidoria da Clínica (RF32, RN21)</h2>
              <p className="text-xs text-emerald-100/80 mt-1 max-w-xl">
                Acompanhe a percepção dos pacientes sobre a recepção, atendimento clínico e conforto das instalações.
              </p>
            </div>
            <button
              onClick={() => {
                setPacienteId(patients[0]?.id || '');
                setNotaRecepcao(5);
                setNotaAtendimentoClinico(5);
                setNotaEspacoFisico(5);
                setComentario('');
                setAnonimo(false);
                setShowNewModal(true);
              }}
              className="bg-white text-emerald-900 hover:bg-emerald-50 px-4 py-2.5 rounded-2xl font-bold text-xs shadow transition flex items-center gap-2 shrink-0"
            >
              <Icon name="plus" className="w-4 h-4 text-emerald-700" />
              + Registrar Nova Avaliação
            </button>
          </div>

          {/* Cards de Métricas por Dimensão */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500 uppercase">Média Geral da Clínica</span>
              <div className="flex items-baseline gap-2 mt-2">
                <span className="text-3xl font-extrabold text-emerald-700">{mediaGeral}</span>
                <span className="text-sm text-slate-400 font-bold">/ 5.0</span>
              </div>
              <div className="mt-1">{renderStars(Math.round(Number(mediaGeral)))}</div>
              <p className="text-[11px] text-slate-400 mt-2">{totalReviews} avaliações computadas</p>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500 uppercase">Recepção & Acolhimento</span>
              <div className="flex items-baseline gap-2 mt-2">
                <span className="text-3xl font-extrabold text-slate-900">{mediaRecepcao}</span>
                <span className="text-sm text-slate-400 font-bold">/ 5.0</span>
              </div>
              <div className="mt-1">{renderStars(Math.round(Number(mediaRecepcao)))}</div>
              <p className="text-[11px] text-slate-400 mt-2">Agilidade e pontualidade na entrada</p>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500 uppercase">Atendimento Clínico</span>
              <div className="flex items-baseline gap-2 mt-2">
                <span className="text-3xl font-extrabold text-slate-900">{mediaClinica}</span>
                <span className="text-sm text-slate-400 font-bold">/ 5.0</span>
              </div>
              <div className="mt-1">{renderStars(Math.round(Number(mediaClinica)))}</div>
              <p className="text-[11px] text-slate-400 mt-2">Atenção e clareza do profissional</p>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500 uppercase">Estrutura & Conforto</span>
              <div className="flex items-baseline gap-2 mt-2">
                <span className="text-3xl font-extrabold text-slate-900">{mediaEspaco}</span>
                <span className="text-sm text-slate-400 font-bold">/ 5.0</span>
              </div>
              <div className="mt-1">{renderStars(Math.round(Number(mediaEspaco)))}</div>
              <p className="text-[11px] text-slate-400 mt-2">Higiene, acústica e ambiente</p>
            </div>
          </div>

          {/* Lista de Avaliações / Depoimentos */}
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
            <h3 className="text-sm font-extrabold text-slate-900 mb-4 flex items-center justify-between">
              <span>Feedbacks & Ouvidoria dos Pacientes</span>
              <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full">
                98% de Aprovação
              </span>
            </h3>

            {reviews.length === 0 ? (
              <p className="text-xs text-slate-500 py-8 text-center">Nenhuma avaliação cadastrada ainda.</p>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {reviews.map(rev => (
                  <div key={rev.id} className="p-4 rounded-2xl border border-slate-100 bg-slate-50/70 hover:bg-slate-50 transition space-y-3">
                    <div className="flex items-start justify-between gap-2">
                      <div>
                        <p className="font-extrabold text-sm text-slate-900">{rev.pacienteNome || 'Paciente'}</p>
                        <p className="text-[11px] text-slate-400">
                          {rev.dataCriacao ? formatDateBR(rev.dataCriacao.split('T')[0]) : 'Recentemente'}
                        </p>
                      </div>
                      <div className="flex flex-col items-end">
                        <div className="flex items-center gap-1">
                          <span className="font-extrabold text-emerald-700 text-sm">{Number(rev.mediaGeral || 5).toFixed(1)}</span>
                          <span className="text-amber-400 text-sm">★</span>
                        </div>
                        {rev.anonimo && (
                          <span className="text-[10px] font-bold text-slate-500 bg-slate-200 px-1.5 py-0.5 rounded">Anônimo</span>
                        )}
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2 py-2 border-y border-slate-200/60 text-[11px] text-slate-600">
                      <div>
                        <span className="block text-slate-400 text-[10px]">Recepção</span>
                        <strong className="text-slate-800">{rev.notaRecepcao || 5} ★</strong>
                      </div>
                      <div>
                        <span className="block text-slate-400 text-[10px]">Clínico</span>
                        <strong className="text-slate-800">{rev.notaAtendimentoClinico || 5} ★</strong>
                      </div>
                      <div>
                        <span className="block text-slate-400 text-[10px]">Estrutura</span>
                        <strong className="text-slate-800">{rev.notaEspacoFisico || 5} ★</strong>
                      </div>
                    </div>

                    <p className="text-xs text-slate-700 italic bg-white p-3 rounded-xl border border-slate-100">
                      "{rev.comentarioOuvidoria || 'Sem comentários adicionais.'}"
                    </p>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Modal Nova Avaliação */}
          {showNewModal && (
            <Modal title="Nova Avaliação de Atendimento (RF32)" maxWidth="max-w-md" onClose={() => setShowNewModal(false)}>
              <form onSubmit={handleSaveReview} className="space-y-4 mt-5">
                <div>
                  <label htmlFor="rev-paciente" className={LABEL_CLASS}>Paciente</label>
                  <select
                    id="rev-paciente"
                    disabled={anonimo}
                    value={pacienteId}
                    onChange={e => setPacienteId(e.target.value)}
                    className={FIELD_CLASS}
                  >
                    {patients.map(p => (
                      <option key={p.id} value={p.id}>{p.nome}</option>
                    ))}
                  </select>
                </div>

                <label className="flex items-center gap-2 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={anonimo}
                    onChange={e => setAnonimo(e.target.checked)}
                    className="w-4 h-4 text-emerald-600 rounded"
                  />

    /* =========================================================================
       RASTREAMENTO DE EXAMES & AMOSTRAS EXTERNAS (RF34, RN23)
       ========================================================================= */
    function LaboratorioView({ labSamples, setLabSamples, patients, currentUser, showToast, registerLog }) {
      const [showNewModal, setShowNewModal] = useState(false);
      const [filterStatus, setFilterStatus] = useState('todos');
      const [pacienteId, setPacienteId] = useState('');
      const [nomeExame, setNomeExame] = useState('');
      const [laboratorio, setLaboratorio] = useState('Sabin Medicina Diagnóstica');
      const [dataColeta, setDataColeta] = useState(getTodayDateStr());
      const [dataPrevisao, setDataPrevisao] = useState('');
      const [codigoRastreio, setCodigoRastreio] = useState('');
      const [observacoes, setObservacoes] = useState('');

      const STATUS_MAP = {
        1: { label: 'Coletado na Clínica', color: 'bg-slate-100 text-slate-700 border-slate-300' },
        2: { label: 'Enviado ao Laboratório', color: 'bg-blue-100 text-blue-800 border-blue-300' },
        3: { label: 'Em Análise', color: 'bg-amber-100 text-amber-800 border-amber-300' },
        4: { label: 'Laudo Disponível', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        5: { label: 'Entregue ao Paciente', color: 'bg-purple-100 text-purple-800 border-purple-300' },
        ColetadoNaClinica: { label: 'Coletado na Clínica', color: 'bg-slate-100 text-slate-700 border-slate-300' },
        EnviadoAoLaboratorio: { label: 'Enviado ao Laboratório', color: 'bg-blue-100 text-blue-800 border-blue-300' },
        EmAnalise: { label: 'Em Análise', color: 'bg-amber-100 text-amber-800 border-amber-300' },
        LaudoLiberado: { label: 'Laudo Disponível', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        EntregueAoPaciente: { label: 'Entregue ao Paciente', color: 'bg-purple-100 text-purple-800 border-purple-300' }
      };

      const handleCreateSample = async (e) => {
        e.preventDefault();
        const pat = findPatient(patients, pacienteId);
        const prev = dataPrevisao || shiftDateStr(dataColeta, 4);

        if (api.isConnected) {
          const res = await api.criarExame({
            pacienteId: Number(pacienteId.replace(/\D/g, '') || 1),
            nomeExameAmostra: nomeExame.trim(),
            laboratorioParceiro: laboratorio,
            dataColeta: `${dataColeta}T08:00:00`,
            dataPrevisaoLaudo: `${prev}T18:00:00`,
            codigoRastreio: codigoRastreio.trim() || null,
            observacoes: observacoes.trim() || null
          });
          if (res.sucesso && res.dados) {
            setLabSamples(prevList => [res.dados, ...prevList]);
            showToast('Pedido de exame registrado na API (RF34)!');
            registerLog('Pedido de Exame Laboratorial (RF34, RN23)', `Amostra cadastrada: ${nomeExame}`);
            setShowNewModal(false);
            return;
          }
        }

        const newSample = {
          id: Date.now(),
          pacienteId,
          pacienteNome: pat?.nome || 'Paciente',
          nomeExameAmostra: nomeExame.trim(),
          laboratorioParceiro: laboratorio,
          codigoRastreio: codigoRastreio.trim() || `LAB-${Math.floor(1000 + Math.random() * 9000)}`,
          dataColeta,
          dataPrevisaoLaudo: prev,
          status: 0,
          statusTexto: 'Coletado',
          observacoes: observacoes.trim() || 'Amostra coletada no consultório.'
        };

        setLabSamples(prevList => [newSample, ...prevList]);
        showToast('Pedido de exame e amostra cadastrados com sucesso!');
        registerLog('Pedido de Exame Laboratorial (RF34, RN23)', `Amostra cadastrada: ${nomeExame}`);
        setShowNewModal(false);
      };

      const handleAdvanceStatus = async (sample) => {
        let curr = typeof sample.status === 'number' ? sample.status : 1;
        if (sample.status === 'ColetadoNaClinica') curr = 1;
        else if (sample.status === 'EnviadoAoLaboratorio') curr = 2;
        else if (sample.status === 'EmAnalise') curr = 3;
        else if (sample.status === 'LaudoLiberado') curr = 4;
        else if (sample.status === 'EntregueAoPaciente') curr = 5;
        const nextStatus = curr >= 5 ? 1 : curr + 1;
        if (api.isConnected) {
          await api.atualizarStatusExame(sample.id, nextStatus, 'Status avançado pela interface');
        }

        setLabSamples(prev => prev.map(s => {
          if (s.id === sample.id) {
            return {
              ...s,
              status: nextStatus,
              statusTexto: STATUS_MAP[nextStatus]?.label || 'Atualizado'
            };
          }
          return s;
        }));

        showToast(`Status da amostra atualizado para: ${STATUS_MAP[nextStatus]?.label}!`);
        registerLog('Rastreamento de Exame (RF34, RN23)', `Amostra ${sample.codigoRastreio || sample.id}: novo status ${STATUS_MAP[nextStatus]?.label}`);
      };

      const filteredSamples = labSamples.filter(s => {
        if (filterStatus === 'todos') return true;
        if (filterStatus === 'analise') return [1, 2, 3, 'ColetadoNaClinica', 'EnviadoAoLaboratorio', 'EmAnalise'].includes(s.status);
        if (filterStatus === 'concluido') return [4, 5, 'LaudoLiberado', 'EntregueAoPaciente'].includes(s.status);
        return true;
      });

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Header e Ação */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-gradient-to-r from-blue-900 to-indigo-950 text-white p-6 rounded-3xl shadow-lg">
            <div>
              <span className="text-xs uppercase font-extrabold tracking-wider text-blue-300">Integração Diagnóstica Terceirizada</span>
              <h2 className="text-2xl font-extrabold mt-1">Rastreamento de Exames Laboratoriais (RF34, RN23)</h2>
              <p className="text-xs text-blue-100/80 mt-1 max-w-xl">
                Acompanhe o ciclo de vida das amostras coletadas na clínica e enviadas aos laboratórios terceirizados.
              </p>
            </div>
            <button
              onClick={() => {
                setPacienteId(patients[0]?.id || '');
                setNomeExame('');
                setCodigoRastreio('');
                setDataColeta(getTodayDateStr());
                setDataPrevisao('');
                setObservacoes('');
                setShowNewModal(true);
              }}
              className="bg-white text-blue-950 hover:bg-blue-50 px-4 py-2.5 rounded-2xl font-bold text-xs shadow transition flex items-center gap-2 shrink-0"
            >
              <Icon name="plus" className="w-4 h-4 text-blue-700" />
              + Novo Pedido de Exame
            </button>
          </div>

          {/* Cards de Métricas */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500 uppercase">Amostras em Processamento</span>
              <div className="text-3xl font-extrabold text-amber-600 mt-2">
                {labSamples.filter(s => [1, 2, 3, 'ColetadoNaClinica', 'EnviadoAoLaboratorio', 'EmAnalise'].includes(s.status)).length}
              </div>
              <p className="text-[11px] text-slate-400 mt-1">Enviadas ou em análise laboratorial externa</p>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500 uppercase">Laudos Disponíveis (Prontos)</span>
              <div className="text-3xl font-extrabold text-emerald-700 mt-2">
                {labSamples.filter(s => [4, 5, 'LaudoLiberado', 'EntregueAoPaciente'].includes(s.status)).length}
              </div>
              <p className="text-[11px] text-slate-400 mt-1">Laudos digitais liberados para o médico</p>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500 uppercase">Total de Pedidos Gerados</span>
              <div className="text-3xl font-extrabold text-slate-900 mt-2">{labSamples.length}</div>
              <p className="text-[11px] text-slate-400 mt-1">Histórico completo de amostras rastreadas</p>
            </div>
          </div>

          {/* Filtros e Lista */}
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
              <h3 className="text-sm font-extrabold text-slate-900">
                Amostras Coletadas & Previsão de Laudo
              </h3>
              <div className="flex bg-slate-200/70 p-1 rounded-xl text-xs font-bold self-start">
                {[
                  ['todos', 'Todas', labSamples.length],
                  ['analise', 'Em Análise', labSamples.filter(s => [1, 2, 3, 'ColetadoNaClinica', 'EnviadoAoLaboratorio', 'EmAnalise'].includes(s.status)).length],
                  ['concluido', 'Laudo Liberado', labSamples.filter(s => [4, 5, 'LaudoLiberado', 'EntregueAoPaciente'].includes(s.status)).length]
                ].map(([val, label, count]) => (
                  <button
                    key={val}
                    type="button"
                    onClick={() => setFilterStatus(val)}
                    className={`px-3 py-1.5 rounded-lg transition ${filterStatus === val ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    {label} ({count})
                  </button>
                ))}
              </div>
            </div>

            <div className="space-y-3">
              {filteredSamples.map(sample => {
                const pat = findPatient(patients, sample.pacienteId);
                const statusCode = Number(sample.status);
                const info = STATUS_MAP[statusCode] || { label: sample.statusTexto || 'Em Análise', color: 'bg-slate-100 text-slate-800 border-slate-300' };

                return (
                  <div key={sample.id} className="p-4 rounded-2xl border border-slate-200 bg-white hover:border-slate-300 transition flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div className="space-y-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="font-extrabold text-sm text-slate-900">{sample.nomeExameAmostra}</span>
                        <span className={`px-2.5 py-0.5 rounded-full font-extrabold text-[10px] border ${info.color}`}>
                          {info.label}
                        </span>
                      </div>
                      <p className="text-xs text-slate-600">
                        Paciente: <strong>{pat?.nome || sample.pacienteNome || 'Paciente'}</strong> · Laboratório: <strong>{sample.laboratorioParceiro}</strong>
                      </p>
                      <p className="text-[11px] text-slate-400">
                        Código de Rastreio: <code className="font-bold text-slate-700">{sample.codigoRastreio || 'N/A'}</code> · Coleta: {sample.dataColeta ? sample.dataColeta.split('T')[0] : 'N/A'} · Previsão Laudo: {sample.dataPrevisaoLaudo ? sample.dataPrevisaoLaudo.split('T')[0] : 'N/A'}
                      </p>
                      {sample.observacoes && (
                        <p className="text-[11px] text-slate-500 italic mt-1">Obs: {sample.observacoes}</p>
                      )}
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        onClick={() => handleAdvanceStatus(sample)}
                        className="px-3 py-1.5 rounded-xl border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-800 text-xs font-bold transition flex items-center gap-1.5"
                      >
                        <span>Avançar Etapa</span>
                        <span>➔</span>
                      </button>
                      {statusCode >= 3 && (
                        <button
                          onClick={() => {
                            showToast(`Laudo digital do exame ${sample.nomeExameAmostra} aberto com sucesso!`);
                          }}
                          className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition flex items-center gap-1 shadow-sm"
                        >
                          <span>📄 Ver Laudo</span>
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Modal Novo Pedido de Exame */}
          {showNewModal && (
            <Modal title="Novo Pedido de Exame Terceirizado (RF34)" maxWidth="max-w-md" onClose={() => setShowNewModal(false)}>
              <form onSubmit={handleCreateSample} className="space-y-4 mt-5">
                <div>
                  <label htmlFor="lab-paciente" className={LABEL_CLASS}>Paciente *</label>
                  <select
                    id="lab-paciente"
                    value={pacienteId}
                    onChange={e => setPacienteId(e.target.value)}
                    required
                    className={FIELD_CLASS}
                  >
                    {patients.map(p => (
                      <option key={p.id} value={p.id}>{p.nome}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label htmlFor="lab-exame" className={LABEL_CLASS}>Nome do Exame / Amostra *</label>
                  <input
                    id="lab-exame"
                    type="text"
                    required
                    value={nomeExame}
                    onChange={e => setNomeExame(e.target.value)}
                    placeholder="Ex.: Hemograma Completo, Glicemia, Biópsia"
                    className={FIELD_CLASS}
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label htmlFor="lab-parceiro" className={LABEL_CLASS}>Laboratório Parceiro</label>
                    <select
                      id="lab-parceiro"
                      value={laboratorio}
                      onChange={e => setLaboratorio(e.target.value)}
                      className={FIELD_CLASS}
                    >
                      <option value="Sabin Medicina Diagnóstica">Sabin Diagnósticos</option>
                      <option value="Exame Laboratórios">Exame Laboratórios</option>

                      <option value="Grupo Fleury">Grupo Fleury</option>
                    </select>
                  </div>
                  <div>
                    <label htmlFor="lab-codigo" className={LABEL_CLASS}>Código de Rastreio</label>
                    <input
                      id="lab-codigo"
                      type="text"
                      value={codigoRastreio}

                      placeholder="Ex.: SAB-8819"

                <div>
                  <label htmlFor="lab-obs" className={LABEL_CLASS}>Instruções ou Observações da Amostra</label>

                <div className="flex justify-end gap-2 pt-2">

                </div>
              </form>
            </Modal>

    // RF28, RN13, RQ07 - Trilha de auditoria (somente leitura)
    function LogsView({ logs, currentUser }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [logCategory, setLogCategory] = useState('todos');
      const [userFilter, setUserFilter] = useState('todos');
      const [visibleCount, setVisibleCount] = useState(50);

      const LOG_CATEGORIES = {
        acesso: { label: 'Acesso', icon: 'lock', test: /Autenticação|Encerramento|Alternância/ },
        prontuario: { label: 'Prontuário', icon: 'clipboard', test: /Prontuário/ },
        agenda: { label: 'Agenda', icon: 'calendar', test: /Agendamento|Agenda|Remarcação|Cancelamento|WhatsApp/ },
        pacientes: { label: 'Pacientes', icon: 'users', test: /Paciente|LGPD|Portabilidade|Inativação/ },
        financeiro: { label: 'Financeiro', icon: 'wallet', test: /Pagamento|Exportação|Relatório/ }
      };
      const OTHER_CATEGORY = { label: 'Outros', icon: 'clock' };

      const getCategoryKey = (log) =>
        Object.keys(LOG_CATEGORIES).find(key => LOG_CATEGORIES[key].test.test(log.operacao)) || 'outros';

      const stripCodes = (text) => (text || '').replace(/\s*\((?:[A-Z]{1,2}\d{1,2}(?:\s*[,\/]\s*)?)+\)/g, '').trim();
      const normalizeText = (value) => (value || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

      const entries = logs.map(log => {
        const date = new Date(log.timestamp);
        const categoryKey = getCategoryKey(log);
        return {
          ...log,
          categoryKey,
          category: LOG_CATEGORIES[categoryKey] || OTHER_CATEGORY,
          title: stripCodes(log.operacao),
          dayKey: isNaN(date) ? '' : date.toLocaleDateString('pt-BR'),
          time: isNaN(date) ? '—' : date.toLocaleTimeString('pt-BR')
        };
      });

      const userNames = [...new Set(logs.map(log => log.usuarioNome))].sort();
      const query = normalizeText(searchQuery.trim());

      const matchesSearchAndUser = (entry) =>
        (userFilter === 'todos' || entry.usuarioNome === userFilter) &&
        (query === '' || normalizeText(`${entry.title} ${entry.detalhes} ${entry.usuarioNome}`).includes(query));

      const searchedEntries = entries.filter(matchesSearchAndUser);
      const filteredLogs = searchedEntries.filter(entry => logCategory === 'todos' || entry.categoryKey === logCategory);
      const visibleLogs = filteredLogs.slice(0, visibleCount);
      const hasFilters = searchQuery !== '' || logCategory !== 'todos' || userFilter !== 'todos';

      const todayKey = new Date().toLocaleDateString('pt-BR');
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayKey = yesterday.toLocaleDateString('pt-BR');
      const getDayLabel = (dayKey) => {
        if (dayKey === todayKey) return `Hoje · ${dayKey}`;
        if (dayKey === yesterdayKey) return `Ontem · ${dayKey}`;
        return dayKey || 'Data não registrada';
      };

      const categoryOptions = [
        ['todos', 'Todos', searchedEntries.length],
        ...Object.keys(LOG_CATEGORIES).map(key => [
          key,
          LOG_CATEGORIES[key].label,
          searchedEntries.filter(entry => entry.categoryKey === key).length
        ])
      ];

      return (
        <div className="space-y-5 max-w-6xl mx-auto">
          <div className="flex flex-col lg:flex-row gap-2">
            <div className="relative flex-1">
              <label htmlFor="log-busca" className="sr-only">Buscar nos registros</label>
              <Icon name="search" className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
              <input
                id="log-busca"
                type="search"
                placeholder="Buscar por evento, detalhe ou usuário"
                value={searchQuery}
                onChange={e => { setSearchQuery(e.target.value); setVisibleCount(50); }}
                className={`${FIELD_CLASS} !pl-10`}
              />
            </div>
            <div>
              <label htmlFor="log-usuario" className="sr-only">Filtrar por usuário</label>
              <select
                id="log-usuario"
                value={userFilter}
                onChange={e => { setUserFilter(e.target.value); setVisibleCount(50); }}
                className={`${FIELD_CLASS} lg:!w-auto font-semibold`}
              >
                <option value="todos">Todos os usuários</option>
                {userNames.map(name => (
                  <option key={name} value={name}>{name}</option>
                ))}
              </select>
            </div>
          </div>

          <div role="group" aria-label="Filtrar por tipo de evento" className="flex flex-wrap gap-2">
            {categoryOptions.map(([value, label, count]) => (
              <button
                key={value}
                type="button"
                onClick={() => { setLogCategory(value); setVisibleCount(50); }}
                aria-pressed={logCategory === value}
                className={`inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm font-bold transition outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/40 ${
                  logCategory === value
                    ? 'border-emerald-600 bg-emerald-600 text-white'
                    : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'
                }`}
              >
                {label}
                <span className={`font-semibold tabular-nums ${logCategory === value ? 'text-emerald-100' : 'text-slate-500'}`}>{count}</span>
              </button>
            ))}
          </div>

          <section className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div className="flex flex-wrap items-baseline justify-between gap-2 px-5 py-4 border-b border-slate-200">
              <h2 className="text-base font-bold text-slate-900" aria-live="polite">
                {filteredLogs.length === 1 ? '1 registro' : `${filteredLogs.length} registros`}
                {hasFilters && <span className="font-normal text-slate-500"> de {logs.length}</span>}
              </h2>
              <p className="text-xs text-slate-500">Gerados automaticamente pelo sistema. Não podem ser editados nem apagados.</p>
            </div>

            {filteredLogs.length === 0 ? (
              <div className="px-5 py-12 text-center">
                <p className="text-sm font-semibold text-slate-700">Nenhum registro corresponde aos filtros.</p>
                {hasFilters && (
                  <button
                    onClick={() => { setSearchQuery(''); setLogCategory('todos'); setUserFilter('todos'); }}
                    className={`${BTN_SECONDARY} mt-4`}
                  >
                    Limpar busca e filtros
                  </button>
                )}
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full min-w-[42rem] text-left text-sm">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
                      <th scope="col" className="w-28 px-5 py-2.5 font-bold">Horário</th>
                      <th scope="col" className="px-3 py-2.5 font-bold">Evento</th>
                      <th scope="col" className="w-32 px-3 py-2.5 font-bold">Tipo</th>
                      <th scope="col" className="w-52 px-5 py-2.5 font-bold">Usuário</th>
                    </tr>
                  </thead>
                  <tbody>
                    {visibleLogs.map((entry, index) => (
                      <React.Fragment key={entry.id}>
                        {(index === 0 || visibleLogs[index - 1].dayKey !== entry.dayKey) && (
                          <tr className="bg-slate-50 border-b border-slate-200">
                            <th scope="colgroup" colSpan={4} className="px-5 py-2 text-sm font-bold text-slate-700">
                              {getDayLabel(entry.dayKey)}
                            </th>
                          </tr>
                        )}
                        <tr className="border-b border-slate-100 last:border-b-0">
                          <td className="px-5 py-3 align-top font-semibold tabular-nums text-slate-700">{entry.time}</td>
                          <td className="px-3 py-3 align-top">
                            <p className="font-bold text-slate-900">{entry.title}</p>
                            <p className="mt-0.5 text-slate-600">{entry.detalhes}</p>
                          </td>
                          <td className="px-3 py-3 align-top whitespace-nowrap">
                            <span className="inline-flex items-center gap-1.5 text-slate-700">
                              <Icon name={entry.category.icon} className="w-4 h-4 text-slate-400" />
                              {entry.category.label}
                            </span>
                          </td>
                          <td className="px-5 py-3 align-top">
                            <span className="inline-flex items-center gap-2 min-w-0">
                              <span aria-hidden="true" className="shrink-0 w-7 h-7 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center text-xs font-extrabold">
                                {getNameInitials(entry.usuarioNome)}
                              </span>
                              <span className="truncate text-slate-700">{entry.usuarioNome}</span>
                            </span>
                          </td>
                        </tr>
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {filteredLogs.length > visibleCount && (
              <div className="px-5 py-3 border-t border-slate-200 text-center">
                <button onClick={() => setVisibleCount(count => count + 50)} className={BTN_SECONDARY}>
                  Mostrar mais ({filteredLogs.length - visibleCount} restantes)
                </button>
              </div>
            )}
          </section>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
