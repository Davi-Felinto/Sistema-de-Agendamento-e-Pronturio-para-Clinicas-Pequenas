      }
    }
  </script>

    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }

    .scrollbar-thin::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>

  <script type="text/babel">

    const INITIAL_PATIENTS = [

      },
      {

      }
    ];

    const getTodayDateStr = () => new Date().toISOString().split('T')[0];

    const INITIAL_APPOINTMENTS = [
      {
        id: 'a_andrade',
        pacienteId: 'p_andrade',
        profissionalId: 'u1',
        data: getTodayDateStr(),
        horario: '08:30',
        duracaoMin: 60,

        tipo: 'consulta',
        observacoes: 'Atendimento Especial - Acompanhamento do Coração ❤️',
        valor: 0,

        notificacaoStatus: 'enviado',
        notificacaoTentativas: 1,
        cancelamentoTardio: false
      },
      {
        id: 'a1',
        pacienteId: 'p1',
        profissionalId: 'u1',
        data: getTodayDateStr(),
        horario: '09:00',
        duracaoMin: 60,
        status: 'confirmado',
        tipo: 'consulta',
        observacoes: 'Acompanhamento quinzenal com foco em manejo de estresse',
        valor: 200,
        statusPagamento: 'pago',
        formaPagamento: 'Pix',
        notificacaoStatus: 'enviado',
        notificacaoTentativas: 1,
        cancelamentoTardio: false
      },
      {
        id: 'a2',
        pacienteId: 'p2',
        profissionalId: 'u1',
        data: getTodayDateStr(),
        horario: '10:30',
        duracaoMin: 60,
        status: 'confirmado',
        tipo: 'consulta',
        observacoes: 'Sessão de reavaliação dos exames',
        valor: 180,
        statusPagamento: 'pendente',
        formaPagamento: 'Em aberto',
        notificacaoStatus: 'falha',
        notificacaoTentativas: 2,
        cancelamentoTardio: false
      },
      {
        id: 'a3',
        pacienteId: null,
        profissionalId: 'u1',
        data: getTodayDateStr(),
        horario: '12:00',
        duracaoMin: 60,
        status: 'bloqueado',
        tipo: 'bloqueio',
        observacoes: 'Intervalo de Almoço / Estudo Clínico (RF11)',
        valor: 0,
        statusPagamento: 'isento',
        formaPagamento: 'N/A',
        notificacaoStatus: 'nao_aplicavel',
        notificacaoTentativas: 0,
        cancelamentoTardio: false
      }
    ];

    const INITIAL_RECORDS = [
      {
        id: 'pr_andrade',
        pacienteId: 'p_andrade',
        agendamentoId: 'a_andrade',
        data: `${getTodayDateStr()} 08:30`,
        profissionalId: 'u1',
        profissionalNome: 'Dr. Davi Felinto',
        anotacao: 'Avaliação clínica especial (RF18): Paciente apresenta quadro crônico de extrema formosura e cachos deslumbrantes. Prescrição: Aceitar o convite para sair e conhecer novos lugares na 104. Prognóstico: 100% de chance de namoro kkkk.',
        versao: 1,
        historicoVersoes: []
      },
      {
        id: 'pr1',
        pacienteId: 'p1',
        agendamentoId: 'a1',
        data: '2026-09-15 10:00',
        profissionalId: 'u1',
        profissionalNome: 'Dr. Davi Felinto',
        anotacao: 'Paciente relata remissão das crises de pânico e melhor qualidade do sono. Foi mantida a prática do registro de pensamentos disfuncionais.',
        versao: 1,
        historicoVersoes: []
      }
    ];

    const INITIAL_LOGS = [
      {
        id: 'l1',
        timestamp: new Date().toISOString(),
        usuarioId: 'u1',
        usuarioNome: 'Dr. Davi Felinto',
        operacao: 'Autenticação no Sistema (RF26)',
        detalhes: 'Sessão iniciada como Profissional'
      },
      {
        id: 'l2',
        timestamp: new Date().toISOString(),
        usuarioId: 'u1',
        usuarioNome: 'Dr. Davi Felinto',
        operacao: 'Acesso ao Prontuário (RN13)',
        detalhes: 'Ficha médica consultada: Mariana Duarte Souza'
      }
    ];

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem('clinix_auth') === 'true';
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('clinix_user');
        return saved ? JSON.parse(saved) : INITIAL_USERS[0];
      });

      const [patients, setPatients] = useState(() => {
        const saved = localStorage.getItem('clinix_patients');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            const exists = parsed.some(p => p.id === 'p_andrade' || p.nome?.includes('Andrade Valadão'));
            if (!exists) {
              return [INITIAL_PATIENTS[0], ...parsed];
            }
            return parsed.map(p => (p.id === 'p_andrade' || p.nome?.includes('Andrade Valadão')) ? INITIAL_PATIENTS[0] : p);
          } catch (e) {
            return INITIAL_PATIENTS;
          }
        }
        return INITIAL_PATIENTS;
      });

      const [appointments, setAppointments] = useState(() => {
        const saved = localStorage.getItem('clinix_appointments');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (!parsed.some(a => a.id === 'a_andrade' || a.pacienteId === 'p_andrade')) {
              return [INITIAL_APPOINTMENTS[0], ...parsed];
            }
            return parsed;
          } catch (e) {
            return INITIAL_APPOINTMENTS;
          }
        }
        return INITIAL_APPOINTMENTS;
      });

      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('clinix_records');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (!parsed.some(r => r.pacienteId === 'p_andrade')) {
              return [INITIAL_RECORDS[0], ...parsed];
            }
            return parsed;
          } catch (e) {
            return INITIAL_RECORDS;
          }
        }
        return INITIAL_RECORDS;
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('clinix_logs');
        return saved ? JSON.parse(saved) : INITIAL_LOGS;
      });

      // Navegação entre Telas: 'dashboard' | 'agenda' | 'pacientes' | 'prontuario' | 'financeiro' | 'logs'
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedPatientForRecord, setSelectedPatientForRecord] = useState(null);
      const [toast, setToast] = useState(null);
      const [dialogConfig, setDialogConfig] = useState(null);
      const [showReqGuide, setShowReqGuide] = useState(false);

      // Persistência local contínua
      useEffect(() => {
        localStorage.setItem('clinix_auth', isAuthenticated ? 'true' : 'false');
        localStorage.setItem('clinix_user', JSON.stringify(currentUser));
        localStorage.setItem('clinix_patients', JSON.stringify(patients));
        localStorage.setItem('clinix_appointments', JSON.stringify(appointments));
        localStorage.setItem('clinix_records', JSON.stringify(records));
        localStorage.setItem('clinix_logs', JSON.stringify(logs));
      }, [isAuthenticated, currentUser, patients, appointments, records, logs]);

      // Sistema centralizado de notificações em banner (sem alert nativo)
      const showToast = (message, type = 'success') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => setToast(null), 4000);
      };

      // Auditoria contínua (RF28, RN13, RQ07)
      const registerLog = (operacao, detalhes) => {
        const newLog = {
          id: 'l_' + Date.now(),
          timestamp: new Date().toISOString(),
          usuarioId: currentUser.id,
          usuarioNome: currentUser.name,
          operacao,
          detalhes
        };
        setLogs(prev => [newLog, ...prev]);
      };

      // Regra de Usabilidade dos 3 Cliques (RQ10)
      const handleOpenProntuarioDirect = (patientId) => {
        const patient = patients.find(p => p.id === patientId);
        if (patient) {
          setSelectedPatientForRecord(patient);
          setActiveTab('prontuario');
          registerLog('Acesso ao Prontuário (RN13)', `Abertura direta do prontuário: ${patient.nome}`);
        }
      };

      const handleLogout = () => {
        registerLog('Encerramento de Sessão', `Usuário ${currentUser.name} realizou logout`);
        setIsAuthenticated(false);
      };

      // Se não autenticado, renderiza a Tela 1: Login & Autenticação
      if (!isAuthenticated) {
        return (
          <LoginScreen
            users={INITIAL_USERS}
            onLogin={(user) => {
              setCurrentUser(user);
              setIsAuthenticated(true);
              registerLog('Autenticação no Sistema (RF26)', `Login realizado com sucesso como ${user.role} (${user.name})`);
            }}
          />
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100 font-sans">
          {/* TOAST SYSTEM (In-App Notification) */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-900/95 backdrop-blur-md text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 animate-slide-in">
              <span className={`w-3 h-3 rounded-full ${toast.type === 'error' ? 'bg-rose-500' : toast.type === 'warning' ? 'bg-amber-400' : 'bg-emerald-400'}`}></span>
              <span className="text-xs font-semibold text-slate-100">{toast.message}</span>
            </div>
          )}

          {/* CUSTOM CONFIRMATION MODAL DIALOG (Substitui confirm/alert) */}
          {dialogConfig && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-scale-up">
                <div className="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold mb-4">
                  ⚠️
                </div>
                <h3 className="text-base font-bold text-slate-800">{dialogConfig.title}</h3>
                <p className="text-xs text-slate-600 mt-2 leading-relaxed whitespace-pre-line">{dialogConfig.message}</p>
                <div className="flex justify-end gap-2.5 mt-6">
                  <button
                    onClick={() => setDialogConfig(null)}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                  >
                    {dialogConfig.cancelLabel || 'Cancelar'}
                  </button>
                  <button
                    onClick={() => {
                      dialogConfig.onConfirm();
                      setDialogConfig(null);
                    }}
                    className={`px-4 py-2 text-xs font-semibold text-white rounded-xl shadow-sm transition ${
                      dialogConfig.danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-600 hover:bg-emerald-700'
                    }`}
                  >
                    {dialogConfig.confirmLabel || 'Confirmar'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SIDEBAR NAVIGATION DESKTOP */}
          <aside className="no-print hidden lg:flex flex-col w-64 bg-white border-r border-slate-200">
            {/* Logo */}
            <div className="p-5 border-b border-slate-100 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-emerald-200">
                  +
                </div>
                <div>
                  <span className="text-lg font-bold tracking-tight text-slate-900 leading-none">Clinix<span className="text-emerald-600">.</span></span>
                  <p className="text-[10px] text-slate-500 font-medium">Clínicas & Consultórios</p>
                </div>
              </div>
            </div>

            {/* Perfil & Alternador de Perfil (RF27, RN12) */}
            <div className="m-4 p-3.5 bg-slate-50 rounded-2xl border border-slate-200 text-xs">
              <div className="flex items-center justify-between mb-1">
                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Perfil Ativo</span>
                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                  currentUser.role === 'Profissional' ? 'bg-emerald-100 text-emerald-800' : 'bg-purple-100 text-purple-800'
                }`}>
                  {currentUser.role}
                </span>
              </div>
              <p className="font-bold text-slate-800 truncate">{currentUser.name}</p>
              <p className="text-[10px] text-slate-500 truncate">{currentUser.espec}</p>

              <div className="mt-3 grid grid-cols-2 gap-1.5 pt-2 border-t border-slate-200">
                <button
                  onClick={() => {
                    const nextUser = currentUser.id === 'u1' ? INITIAL_USERS[1] : INITIAL_USERS[0];
                    setCurrentUser(nextUser);
                    showToast(`Perfil alterado: ${nextUser.role} (${nextUser.name})`, 'info');
                    registerLog('Alternância de Perfil (RN12)', `Mudou sessão para ${nextUser.name} (${nextUser.role})`);
                  }}
                  className="py-1 px-2 bg-white hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 font-semibold text-[10px] transition text-center shadow-2xs"
                >
                  Alternar Perfil ⇄
                </button>
                <button
                  onClick={handleLogout}
                  className="py-1 px-2 bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 rounded-lg font-semibold text-[10px] transition text-center"
                >
                  Sair
                </button>
              </div>
            </div>

            {/* Menu Principal */}
            <nav className="flex-1 px-4 space-y-1.5 overflow-y-auto scrollbar-thin">
              <SidebarItem icon="📊" label="Visão Geral" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} badge="RQ10" />
              <SidebarItem icon="📅" label="Agenda Clínica" active={activeTab === 'agenda'} onClick={() => setActiveTab('agenda')} badge="RN01" />
              <SidebarItem icon="👥" label="Pacientes" active={activeTab === 'pacientes'} onClick={() => setActiveTab('pacientes')} badge="LGPD" />
              <SidebarItem icon="📋" label="Prontuário Eletrônico" active={activeTab === 'prontuario'} onClick={() => setActiveTab('prontuario')} badge="RN17" />
              <SidebarItem icon="💰" label="Financeiro & Relatórios" active={activeTab === 'financeiro'} onClick={() => setActiveTab('financeiro')} badge="RF22" />
              <SidebarItem icon="🔒" label="Auditoria & Logs" active={activeTab === 'logs'} onClick={() => setActiveTab('logs')} badge="RN13" />
            </nav>

            {/* Mini Guia dos Requisitos Acadêmicos (CEUB) */}
            <div className="p-4 border-t border-slate-100">
              <button
                onClick={() => setShowReqGuide(!showReqGuide)}
                className="w-full text-left p-2.5 rounded-xl bg-slate-50 hover:bg-emerald-50 text-[11px] border border-slate-200 transition text-slate-600 flex items-center justify-between"
              >
                <span className="font-bold text-slate-700">📖 Requisitos Validados</span>
                <span className="text-emerald-700 font-bold">{showReqGuide ? '▲' : '▼'}</span>
              </button>
              {showReqGuide && (
                <div className="mt-2 text-[10px] text-slate-500 bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1">
                  <p><strong>F1 a F7:</strong> 28 Requisitos Funcionais</p>
                  <p><strong>RN01 a RN17:</strong> 17 Regras de Negócio</p>
                  <p><strong>ISO/IEC 25010:</strong> 16 RQs (Segurança, Usabilidade, Confiabilidade)</p>
                </div>
              )}
            </div>
          </aside>

          {/* MAIN WORKSPACE */}
          <div className="flex-1 flex flex-col overflow-hidden">
            {/* Header Superior */}
            <header className="no-print bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="lg:hidden font-bold text-lg text-emerald-600">Clinix+</span>
                <div>
                  <h1 className="text-base md:text-lg font-bold text-slate-900 leading-tight">
                    {activeTab === 'dashboard' && 'Painel de Controle & Visão Geral'}
                    {activeTab === 'agenda' && 'Agenda Médica & Gestão de Conflitos (F2, F3)'}
                    {activeTab === 'pacientes' && 'Base Cadastral de Pacientes (F1 - LGPD)'}
                    {activeTab === 'prontuario' && 'Prontuário com Histórico de Versões (F4 - RN17)'}
                    {activeTab === 'financeiro' && 'Gestão Financeira & Relatórios (F5, F6)'}
                    {activeTab === 'logs' && 'Trilha de Auditoria & Conformidade (F7 - RN13)'}
                  </h1>
                  <p className="text-[11px] text-slate-500 hidden sm:block">
                    Conforme especificação formal de requisitos ISO/IEC 25010
                  </p>
                </div>
              </div>

              {/* Botão de Ação Primária da Regra dos 3 Cliques (RQ10) */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setActiveTab('agenda')}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-sm flex items-center gap-1.5 transition active:scale-95"
                >
                  <span>+</span>
                  <span className="hidden sm:inline">Nova Consulta</span>
                </button>
              </div>
            </header>

            {/* Conteúdo Dinâmico da Aba Selecionada */}
            <main className="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100 scrollbar-thin">
              {activeTab === 'dashboard' && (
                <DashboardView
                  appointments={appointments}
                  patients={patients}
                  records={records}
                  currentUser={currentUser}
                  onNavigate={setActiveTab}
                  onOpenProntuario={handleOpenProntuarioDirect}
                />
              )}

              {activeTab === 'agenda' && (
                <AgendaView
                  appointments={appointments}
                  patients={patients}
                  currentUser={currentUser}
                  setAppointments={setAppointments}
                  showToast={showToast}
                  registerLog={registerLog}
                  setDialogConfig={setDialogConfig}
                />
              )}

              {activeTab === 'pacientes' && (
                <PatientsView
                  patients={patients}
                  setPatients={setPatients}
                  appointments={appointments}
                  currentUser={currentUser}
                  showToast={showToast}
                  registerLog={registerLog}
                  onOpenProntuario={handleOpenProntuarioDirect}
                  setDialogConfig={setDialogConfig}
                />
              )}

              {activeTab === 'prontuario' && (
                <ProntuarioView
                  patients={patients}
                  records={records}
                  setRecords={setRecords}
                  appointments={appointments}
                  currentUser={currentUser}
                  selectedPatient={selectedPatientForRecord}
                  setSelectedPatient={setSelectedPatientForRecord}
                  showToast={showToast}
                  registerLog={registerLog}
                />
              )}

              {activeTab === 'financeiro' && (
                <FinanceiroView
                  appointments={appointments}
                  patients={patients}
                  setAppointments={setAppointments}
                  showToast={showToast}
                  registerLog={registerLog}
                />
              )}

              {activeTab === 'logs' && (
                <LogsView logs={logs} currentUser={currentUser} />
              )}

    function AgendaView({ appointments, patients, currentUser, setAppointments, showToast, registerLog, setDialogConfig }) {
      const [viewMode, setViewMode] = useState('dia'); // 'dia' | 'semana' (RF10)
      const [selectedDate, setSelectedDate] = useState(getTodayDateStr());
      const [showNewModal, setShowNewModal] = useState(false);
      const [showBlockModal, setShowBlockModal] = useState(false);
      const [showRescheduleModal, setShowRescheduleModal] = useState(null);
      const [whatsappModalData, setWhatsappModalData] = useState(null);

      // Form State: Nova Consulta
      const [formPatientId, setFormPatientId] = useState('');
      const [formDate, setFormDate] = useState(selectedDate);
      const [formTime, setFormTime] = useState('09:00');
      const [formObs, setFormObs] = useState('');
      const [formValue, setFormValue] = useState(200);

      // Form State: Bloqueio de Horário (RF11)
      const [blockReason, setBlockReason] = useState('Intervalo para almoço');
      const [blockTime, setBlockTime] = useState('12:00');

      // Form State: Remarcação (RF07)
      const [rescheduleDate, setRescheduleDate] = useState('');
      const [rescheduleTime, setRescheduleTime] = useState('14:00');

      // Filtro conforme perfil (RN12)
      const filteredAppointments = useMemo(() => {
        return appointments.filter(a => {
          if (currentUser.role === 'Profissional' && a.profissionalId !== currentUser.id) {
            return false;
          }
          if (viewMode === 'dia') {
            return a.data === selectedDate;
          }
          return true;
        });
      }, [appointments, currentUser, viewMode, selectedDate]);

      // Criação de Agendamento com Prevenção de Choque de Horários (RN01, RN02)
      const handleCreateAppointment = (e) => {
        e.preventDefault();

        if (!formPatientId) {
          showToast('Selecione um paciente cadastrado.', 'error');
          return;
        }

        // RN01 / RN02: Checar conflito no mesmo dia, horário e profissional
        const conflict = appointments.find(
          a => a.data === formDate &&
               a.horario === formTime &&
               a.status !== 'cancelado' &&
               a.profissionalId === currentUser.id
        );

        if (conflict) {
          setDialogConfig({
            title: 'Conflito de Horário Detectado (RN02)',
            message: `O horário ${formTime} em ${formDate} já está ocupado por outro compromisso. Conforme a regra de negócio RN02, o sistema impede conflitos de horário. Por favor, escolha outro horário.`,
            confirmLabel: 'Entendido',
            cancelLabel: 'Fechar',
            danger: true,
            onConfirm: () => {}
          });
          return;
        }

        const newAppt = {
          id: 'a_' + Date.now(),
          pacienteId: formPatientId,
          profissionalId: currentUser.id,
          data: formDate,
          horario: formTime,
          duracaoMin: 60,
          status: 'confirmado',
          tipo: 'consulta',
          observacoes: formObs || 'Consulta de rotina',
          valor: Number(formValue) || 200,
          statusPagamento: 'pendente',
          formaPagamento: 'Em aberto',
          notificacaoStatus: 'enviado', // RN03
          notificacaoTentativas: 1,
          cancelamentoTardio: false
        };

        setAppointments(prev => [...prev, newAppt]);
        setShowNewModal(false);

        const pat = patients.find(p => p.id === formPatientId);
        showToast(`Consulta confirmada para ${pat?.nome} às ${formTime}!`);
        registerLog('Agendamento de Consulta (RF06, RN01)', `Consulta marcada para ${pat?.nome} no dia ${formDate} às ${formTime}`);

        // Exibição da confirmação automática enviada por WhatsApp (RF12, RN03)
        setWhatsappModalData({
          titulo: 'Confirmação Automática WhatsApp (RF12 / RN03)',
          destinatario: `${pat?.nome} (${pat?.telefone})`,
          mensagem: `Olá, ${pat?.nome}! Sua consulta na Clinix com ${currentUser.name} está confirmada para ${formDate} às ${formTime}. Enviaremos lembrete 24h antes!`
        });
      };

      // Bloquear Horário na Agenda (RF11)
      const handleBlockSlot = (e) => {
        e.preventDefault();

        // Checar conflito prévio
        const conflict = appointments.find(
          a => a.data === selectedDate &&
               a.horario === blockTime &&
               a.status !== 'cancelado' &&
               a.profissionalId === currentUser.id
        );

        if (conflict) {
          showToast('Horário já ocupado por consulta. Remarque-a antes de bloquear.', 'error');
          return;
        }

        const blockAppt = {
          id: 'b_' + Date.now(),
          pacienteId: null,
          profissionalId: currentUser.id,
          data: selectedDate,
          horario: blockTime,
          duracaoMin: 60,
          status: 'bloqueado',
          tipo: 'bloqueio',
          observacoes: blockReason,
          valor: 0,
          statusPagamento: 'isento',
          formaPagamento: 'N/A',
          notificacaoStatus: 'nao_aplicavel',
          notificacaoTentativas: 0,
          cancelamentoTardio: false
        };

        setAppointments(prev => [...prev, blockAppt]);
        setShowBlockModal(false);
        showToast(`Horário ${blockTime} bloqueado com sucesso (RF11).`);
        registerLog('Bloqueio de Agenda (RF11)', `Bloqueado ${blockTime} em ${selectedDate}: ${blockReason}`);
      };

      // Remarcação de Consulta (RF07)
      const handleRescheduleSubmit = (e) => {
        e.preventDefault();
        const appt = showRescheduleModal;

        const conflict = appointments.find(
          a => a.id !== appt.id &&
               a.data === rescheduleDate &&
               a.horario === rescheduleTime &&
               a.status !== 'cancelado' &&
               a.profissionalId === currentUser.id
        );

        if (conflict) {
          showToast('Horário de remarcação já ocupado! Selecione outro.', 'error');
          return;
        }

        setAppointments(prev => prev.map(a => {
          if (a.id === appt.id) {
            return {
              ...a,
              data: rescheduleDate,
              horario: rescheduleTime,
              status: 'remarcado',
              notificacaoStatus: 'enviado',
              notificacaoTentativas: 1
            };
          }
          return a;
        }));

        setShowRescheduleModal(null);
        showToast('Consulta remarcada com sucesso (RF07)!');
        registerLog('Remarcação de Consulta (RF07)', `Consulta ${appt.id} transferida para ${rescheduleDate} às ${rescheduleTime}`);
      };

      // Cancelamento com Regra de Cancelamento Tardio (< 24h) (RN10)
      const handleCancelAppointment = (appt) => {
        const apptDate = new Date(`${appt.data}T${appt.horario}`);
        const now = new Date();
        const diffHours = (apptDate - now) / (1000 * 60 * 60);
        const isTardio = diffHours > 0 && diffHours < 24;

        setDialogConfig({
          title: 'Confirmar Cancelamento (RF08)',
          message: isTardio
            ? `ATENÇÃO (Regra RN10):\nEsta consulta ocorrerá em menos de 24 horas. O cancelamento será registrado como "Cancelamento Tardio" no histórico do paciente.`
            : 'Deseja confirmar o cancelamento deste agendamento?',
          confirmLabel: 'Sim, Cancelar',
          cancelLabel: 'Voltar',
          danger: true,
          onConfirm: () => {
            setAppointments(prev => prev.map(a => {
              if (a.id === appt.id) {
                return { ...a, status: 'cancelado', cancelamentoTardio: isTardio };
              }
              return a;
            }));
            showToast('Agendamento cancelado.');
            registerLog('Cancelamento de Consulta (RF08, RN10)', `Cancelamento ID ${appt.id}. Tardio: ${isTardio ? 'SIM' : 'NÃO'}`);
          }
        });
      };

      // Simulação do Reenvio de WhatsApp (RN14)
      const handleRetryWhatsapp = (apptId) => {
        setAppointments(prev => prev.map(a => {
          if (a.id === apptId) {
            return { ...a, notificacaoStatus: 'reenviado', notificacaoTentativas: a.notificacaoTentativas + 1 };
          }
          return a;
        }));
        showToast('Notificação reenviada com sucesso (Status: Reenviado - RN14).');
        registerLog('Reenvio de WhatsApp (RN14)', `Notificação reenviada para consulta ${apptId}`);
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Barra de Controles e Filtros */}
          <div className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">

            {filteredAppointments.length === 0 ? (

                      <div className="min-w-[180px]">

                    </div>
                  );

              </div>
            )}
          </div>

          {/* MODAL: NOVO AGENDAMENTO */}
          {showNewModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-800 text-sm">Novo Agendamento (RF06, RF09)</h3>
                  <button onClick={() => setShowNewModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <form onSubmit={handleCreateAppointment} className="space-y-3.5 mt-4 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Paciente Cadastrado *</label>
                    <select

                      <select
                        value={formTime}

                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500 font-semibold"
                      >

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Valor da Sessão (R$)</label>
                      <input
                        type="number"

                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Duração Padrão</label>
                      <input

                    </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Observações Clínicas</label>
                    <textarea

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowNewModal(false)}
                      className="px-4 py-2 border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-50 font-bold"
                    >
                      Cancelar
                    </button>
                    <button

                    </button>

              </div>
            </div>

          {/* MODAL: BLOQUEIO DE HORÁRIO (RF11) */}
          {showBlockModal && (

    function PatientsView({ patients, setPatients, appointments, currentUser, showToast, registerLog, onOpenProntuario, setDialogConfig }) {
      const [search, setSearch] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [editingPatient, setEditingPatient] = useState(null);

      // Form state
      const [nome, setNome] = useState('');
      const [cpf, setCpf] = useState('');
      const [nascimento, setNascimento] = useState('');
      const [telefone, setTelefone] = useState('');
      const [email, setEmail] = useState('');
      const [endereco, setEndereco] = useState('');
      const [alergias, setAlergias] = useState('');
      const [condicoes, setCondicoes] = useState('');

      const filtered = patients.filter(p => {
        return p.nome.toLowerCase().includes(search.toLowerCase()) || p.cpf.includes(search);
      });

      const handleOpenCreate = () => {
        setEditingPatient(null);
        setNome(''); setCpf(''); setNascimento(''); setTelefone(''); setEmail(''); setEndereco(''); setAlergias(''); setCondicoes('');
        setShowModal(true);
      };

      const handleOpenEdit = (patient) => {
        setEditingPatient(patient);
        setNome(patient.nome);
        setCpf(patient.cpf);
        setNascimento(patient.nascimento);
        setTelefone(patient.telefone);
        setEmail(patient.email);
        setEndereco(patient.endereco);
        setAlergias(patient.alergias);
        setCondicoes(patient.condicoesPreexistentes);
        setShowModal(true);
      };

      const handleSave = (e) => {
        e.preventDefault();

        if (editingPatient) {
          // RF02 - Alterar dados
          setPatients(prev => prev.map(p => {
            if (p.id === editingPatient.id) {
              return {
                ...p,
                nome, cpf, nascimento, telefone, email, endereco,
                alergias, condicoesPreexistentes: condicoes
              };
            }
            return p;
          }));
          showToast('Dados do paciente alterados com sucesso (RF02).');
          registerLog('Alteração de Paciente (RF02)', `Cadastro atualizado: ${nome}`);
        } else {
          // RF01 - Incluir dados
          const newPatient = {
            id: 'p_' + Date.now(),
            nome, cpf, nascimento, telefone, email, endereco,
            alergias: alergias || 'Nenhuma informada',
            condicoesPreexistentes: condicoes || 'Nenhuma informada',
            status: 'ativo',
            profissionalId: currentUser.id
          };
          setPatients(prev => [...prev, newPatient]);
          showToast(`Paciente ${nome} cadastrado com sucesso (RF01)!`);
          registerLog('Cadastro de Paciente (RF01)', `Novo paciente: ${nome} (${cpf})`);
        }
        setShowModal(false);
      };

      // Inativação lógica com anonimização LGPD (RN16, RQ03, RF03)
      const handleInactivate = (patient) => {
        setDialogConfig({
          title: 'Inativação Lógica & Anonimização (LGPD - RQ03, RN16)',
          message: `Deseja inativar o cadastro de "${patient.nome}"?\n\nConforme as normas LGPD e a regra RN16, dados de contato identificadores (telefone e e-mail) serão anonimizados, mas o prontuário e histórico médico serão integralmente preservados para segurança jurídica.`,
          confirmLabel: 'Inativar e Anonimizar',

    function ProntuarioView({ patients, records, setRecords, appointments, currentUser, selectedPatient, setSelectedPatient, showToast, registerLog }) {
      const [newNote, setNewNote] = useState('');
      const [editingRecordId, setEditingRecordId] = useState(null);
      const [editNoteContent, setEditNoteContent] = useState('');
      const [versionModalRecord, setVersionModalRecord] = useState(null);

      // Paciente selecionado padrão
      useEffect(() => {
        if (!selectedPatient && patients.length > 0) {
          setSelectedPatient(patients[0]);
        }
      }, [patients, selectedPatient]);

      const patientRecords = useMemo(() => {
        if (!selectedPatient) return [];
        return records.filter(r => r.pacienteId === selectedPatient.id);
      }, [records, selectedPatient]);

      // Registro de Sessão (RF15, RN05, RN06)
      const handleCreateRecord = (e) => {
        e.preventDefault();
        if (!newNote.trim()) return;

        const newRec = {
          id: 'rec_' + Date.now(),
          pacienteId: selectedPatient.id,
          agendamentoId: null,
          data: new Date().toLocaleString('pt-BR'),
          profissionalId: currentUser.id,
          profissionalNome: currentUser.name,
          anotacao: newNote,
          versao: 1,
          historicoVersoes: []
        };

        setRecords(prev => [newRec, ...prev]);
        setNewNote('');
        showToast('Evolução clínica registrada no prontuário (RN05, RN06)!');
        registerLog('Registro de Sessão em Prontuário (RF15)', `Nota clínica adicionada para ${selectedPatient.nome}`);
      };

      // Alteração com Versionamento Imutável (RN17, RF16)
      const handleSaveEdit = (recordId) => {
        if (!editNoteContent.trim()) return;

        setRecords(prev => prev.map(rec => {
          if (rec.id === recordId) {
            const snapshot = {
              versao: rec.versao,
              dataModificacao: new Date().toLocaleString('pt-BR'),
              modificadoPor: currentUser.name,
              conteudoAnterior: rec.anotacao
            };

            return {
              ...rec,
              anotacao: editNoteContent,
              versao: rec.versao + 1,
              historicoVersoes: [snapshot, ...rec.historicoVersoes]
            };
          }
          return rec;
        }));

        setEditingRecordId(null);
        showToast('Prontuário atualizado. Versão anterior preservada no histórico (RN17)!');
        registerLog('Alteração de Prontuário com Versionamento (RN17)', `Edição da anotação ${recordId}`);
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Seletor Superior de Paciente */}
          <div className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-3 w-full md:w-auto">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wide">Paciente:</span>
              <select
                value={selectedPatient?.id || ''}
                onChange={e => {
                  const p = patients.find(item => item.id === e.target.value);
                  setSelectedPatient(p);
                  registerLog('Troca de Prontuário (RN13)', `Visualizando prontuário de ${p?.nome}`);
                }}
                className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 outline-none focus:ring-2 focus:ring-emerald-500"
              >
                {patients.map(p => (
                  <option key={p.id} value={p.id}>
                    {p.nome} ({p.status === 'ativo' ? 'Ativo' : 'Inativo - LGPD'})
                  </option>
                ))}
              </select>
            </div>

            {selectedPatient && (
              <div className="flex items-center gap-3 text-xs text-slate-500">
                <span>Nasc: <strong>{selectedPatient.nascimento}</strong></span>
                <span>•</span>
                <span>CPF: <strong>{selectedPatient.cpf}</strong></span>
              </div>
            )}
          </div>

          {selectedPatient && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Coluna Esquerda: Ficha Clínica Geral (RF18) */}
              <div className="space-y-4">
                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                    Ficha Clínica Geral (RF18)
                  </h4>
                  <div className="space-y-3 text-xs">
                    <div className="p-3 bg-rose-50/70 rounded-2xl border border-rose-100">
                      <span className="font-bold text-rose-900 block text-[11px]">⚠️ Alergias Identificadas:</span>
                      <p className="text-slate-800 mt-1">{selectedPatient.alergias || 'Nenhuma informada.'}</p>
                    </div>

                    <div className="p-3 bg-amber-50/70 rounded-2xl border border-amber-100">
                      <span className="font-bold text-amber-900 block text-[11px]">🩺 Condições Preexistentes:</span>
                      <p className="text-slate-800 mt-1">{selectedPatient.condicoesPreexistentes || 'Nenhuma informada.'}</p>
                    </div>

                    <div className="pt-2 text-slate-500 text-[11px] space-y-1">
                      <p><strong>Contato:</strong> {selectedPatient.telefone}</p>
                      <p><strong>Endereço:</strong> {selectedPatient.endereco}</p>

                  </div>
                </div>

                <div className="bg-emerald-50 p-4 rounded-3xl border border-emerald-200 text-xs text-emerald-950">

                  <p className="text-[11px] leading-relaxed text-emerald-900">
                    Nenhuma evolução clínica é sobrescrita. Alterações geram versões subsequentes preservando autoria e texto original.
                  </p>
                </div>
              </div>

              {/* Coluna Direita: Registro de Sessão e Timeline de Evoluções */}
              <div className="lg:col-span-2 space-y-6">
                {/* Form de Nova Anotação (RN05) */}
                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                  <h4 className="font-bold text-slate-800 text-sm mb-2">
                    Registrar Nova Sessão / Evolução (RN05)
                  </h4>
                  <form onSubmit={handleCreateRecord} className="space-y-3">
                    <textarea
                      rows="4"
                      required
                      value={newNote}
                      onChange={e => setNewNote(e.target.value)}
                      placeholder="Descreva as queixas, evolução clínica, intervenções realizadas e plano terapêutico..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-2xl p-3 text-xs outline-none focus:ring-2 focus:ring-emerald-500"
                    ></textarea>

                    <div className="flex justify-end">
                      <button
                        type="submit"
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-sm transition"
                      >
                        Gravar no Prontuário (RN06)
                      </button>
                    </div>
                  </form>
                </div>

                {/* Histórico Cronológico de Atendimentos (RF17, RF23) */}
                <div className="space-y-4">
                  <h4 className="font-bold text-slate-800 text-sm">Linha do Tempo de Atendimentos (RF17, RF23)</h4>

                  {patientRecords.length === 0 ? (
                    <div className="bg-white p-8 rounded-3xl border border-slate-200 text-center text-slate-400 text-xs">
                      Nenhum registro clínico anterior localizado para este paciente.
                    </div>
                  ) : (
                    patientRecords.map(rec => (
                      <div key={rec.id} className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <div className="flex items-center justify-between text-xs pb-2 border-b border-slate-100">
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-slate-800">{rec.profissionalNome}</span>
                            <span className="text-slate-400">•</span>
                            <span className="text-slate-500">{rec.data}</span>
                          </div>

                          <div className="flex items-center gap-2">
                            <span className="bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded-full text-[10px]">
                              Versão {rec.versao}
                            </span>

                            {rec.historicoVersoes.length > 0 && (
                              <button
                                onClick={() => setVersionModalRecord(rec)}
                                className="text-xs text-blue-600 hover:underline font-bold"
                              >
                                Ver Anteriores ({rec.historicoVersoes.length})
                              </button>
                            )}

                            <button
                              onClick={() => {
                                setEditingRecordId(rec.id);
                                setEditNoteContent(rec.anotacao);
                              }}
                              className="text-xs text-slate-500 hover:text-slate-800 font-semibold px-2 py-1 rounded-lg hover:bg-slate-100"
                            >
                              Editar (RN17)
                            </button>
                          </div>
                        </div>

                        {editingRecordId === rec.id ? (
                          <div className="space-y-2 mt-2">
                            <textarea
                              rows="3"
                              value={editNoteContent}
                              onChange={e => setEditNoteContent(e.target.value)}
                              className="w-full bg-slate-50 border border-slate-300 rounded-2xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-emerald-500"
                            />
                            <div className="flex justify-end gap-2 text-xs">
                              <button
                                onClick={() => setEditingRecordId(null)}
                                className="px-3 py-1 border border-slate-200 rounded-lg text-slate-600 font-bold"
                              >
                                Cancelar
                              </button>
                              <button
                                onClick={() => handleSaveEdit(rec.id)}
                                className="px-3 py-1 bg-emerald-600 text-white rounded-lg font-bold"
                              >
                                Salvar Versão {rec.versao + 1}
                              </button>
                            </div>
                          </div>
                        ) : (
                          <p className="text-xs text-slate-700 whitespace-pre-line leading-relaxed">
                            {rec.anotacao}
                          </p>
                        )}
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: HISTÓRICO DE VERSÕES ANTERIORES (RN17) */}
          {versionModalRecord && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div>
                    <h3 className="font-bold text-slate-800 text-sm">Histórico de Alterações (RN17)</h3>
                    <p className="text-[11px] text-slate-400">Versão atual ativa: v{versionModalRecord.versao}</p>
                  </div>
                  <button onClick={() => setVersionModalRecord(null)} className="text-slate-400 font-bold">✕</button>
                </div>

                <div className="space-y-3 mt-4 text-xs">
                  {versionModalRecord.historicoVersoes.map((v, idx) => (
                    <div key={idx} className="p-3 bg-slate-50 rounded-2xl border border-slate-200">
                      <div className="flex items-center justify-between text-[11px] text-slate-500 mb-1">

                        <span>{v.dataModificacao} por {v.modificadoPor}</span>

                      <p className="text-slate-700 bg-white p-2.5 rounded-xl border border-slate-100 italic">

    function FinanceiroView({ appointments, patients, setAppointments, showToast, registerLog }) {
      const [filterStatus, setFilterStatus] = useState('todos'); // 'todos', 'pago', 'pendente'
      const [filterPatientId, setFilterPatientId] = useState('todos');

      const filtered = appointments.filter(a => {
        if (a.tipo === 'bloqueio') return false;
        if (filterStatus !== 'todos' && a.statusPagamento !== filterStatus) return false;
        if (filterPatientId !== 'todos' && a.pacienteId !== filterPatientId) return false;
        return true;
      });

      // Cálculos do Resumo Mensal (RF22, RN09, RQ16)
      const totalFaturado = appointments
        .filter(a => a.statusPagamento === 'pago')
        .reduce((sum, a) => sum + (Number(a.valor) || 0), 0);

      const totalPendente = appointments
        .filter(a => a.statusPagamento === 'pendente')
        .reduce((sum, a) => sum + (Number(a.valor) || 0), 0);

      const totalConsultas = appointments.filter(a => a.status !== 'cancelado' && a.tipo !== 'bloqueio').length;

      // Alternar status de pagamento (RN07, RN08, RF20)
      const handleTogglePayment = (apptId) => {
        setAppointments(prev => prev.map(a => {
          if (a.id === apptId) {
            const nextStatus = a.statusPagamento === 'pago' ? 'pendente' : 'pago';
            const nextForma = nextStatus === 'pago' ? 'Pix' : 'Em aberto';
            return { ...a, statusPagamento: nextStatus, formaPagamento: nextForma };
          }
          return a;
        }));
        showToast('Status financeiro atualizado com sucesso (RF20)!');
        registerLog('Atualização de Pagamento (RF20, RN08)', `Status modificado para consulta ${apptId}`);
      };

      // Exportação de Relatório (RF25)
      const handlePrint = () => {
        window.print();
        registerLog('Exportação de Relatório (RF25)', 'Relatório financeiro exportado para PDF / Impressão');
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Cards do Resumo Mensal (RF22) */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500">Total Faturado (Pago)</span>
              <div className="text-2xl font-bold text-emerald-700 my-1">R$ {totalFaturado.toFixed(2)}</div>
              <span className="text-[11px] text-slate-400">Receitas liquidadas no período</span>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500">Total Pendente (RN08)</span>
              <div className="text-2xl font-bold text-amber-600 my-1">R$ {totalPendente.toFixed(2)}</div>
              <span className="text-[11px] text-slate-400">Em cobrança até liquidação</span>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-500">Total de Atendimentos</span>
              <div className="text-2xl font-bold text-slate-900 my-1">{totalConsultas}</div>
              <span className="text-[11px] text-slate-400">Sessões confirmadas no mês</span>
            </div>
          </div>

          {/* Filtros e Ação de Exportação (RF24, RF25) */}
          <div className="no-print bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-400 uppercase">Status:</span>
                <select
                  value={filterStatus}
                  onChange={e => setFilterStatus(e.target.value)}
                  className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 outline-none"
                >
                  <option value="todos">Todos</option>
                  <option value="pago">Somente Pagos</option>
                  <option value="pendente">Somente Pendentes (RF21)</option>
                </select>
              </div>

              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-400 uppercase">Paciente:</span>
                <select
                  value={filterPatientId}
                  onChange={e => setFilterPatientId(e.target.value)}
                  className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 outline-none"
                >
                  <option value="todos">Todos os Pacientes</option>
                  {patients.map(p => (
                    <option key={p.id} value={p.id}>{p.nome}</option>
                  ))}
                </select>
              </div>
            </div>

            <button
              onClick={handlePrint}
              className="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-sm"
            >
              <span>🖨️</span>
              <span>Exportar PDF / Imprimir (RF25)</span>
            </button>
          </div>

          {/* Tabela de Lançamentos */}
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-4 bg-slate-50 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between">
              <span>Extrato Consolidado de Atendimentos & Honorários (RF24)</span>
              <span className="text-slate-400 font-normal">Exatidão garantida por RQ16</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-700">
                <thead className="bg-slate-50 text-slate-400 uppercase text-[10px] font-bold border-b border-slate-200">
                  <tr>
                    <th className="p-3.5">Data / Hora</th>
                    <th className="p-3.5">Paciente</th>
                    <th className="p-3.5">Valor (R$)</th>
                    <th className="p-3.5">Forma</th>
                    <th className="p-3.5">Status</th>
                    <th className="p-3.5 no-print text-right">Ação</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filtered.map(appt => {
                    const patient = patients.find(p => p.id === appt.pacienteId);
                    const isPaid = appt.statusPagamento === 'pago';

                    return (
                      <tr key={appt.id} className="hover:bg-slate-50 transition">
                        <td className="p-3.5 font-medium">{appt.data} às {appt.horario}</td>
                        <td className="p-3.5 font-bold text-slate-800">{patient?.nome || '—'}</td>
                        <td className="p-3.5 font-bold text-slate-900">R$ {Number(appt.valor).toFixed(2)}</td>
                        <td className="p-3.5 text-slate-500">{appt.formaPagamento}</td>
                        <td className="p-3.5">
                          <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] ${
                            isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                          }`}>
                            {appt.statusPagamento.toUpperCase()}
                          </span>
                        </td>
                        <td className="p-3.5 no-print text-right">
                          <button
                            onClick={() => handleTogglePayment(appt.id)}
                            className="text-xs text-blue-600 hover:underline font-bold"
                          >
                            Alternar para {isPaid ? 'Pendente' : 'Pago'}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function LogsView({ logs, currentUser }) {
      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <h3 className="font-bold text-slate-800 text-sm md:text-base">Trilha de Auditoria & Segurança LGPD (RQ07, RF28)</h3>
              <p className="text-xs text-slate-500 mt-0.5">
                Registros cronológicos automáticos e imutáveis de todos os acessos a prontuários e modificações no sistema.
              </p>
            </div>
            <span className="text-xs font-mono bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl border border-slate-200 font-bold">
              Total de Logs: {logs.length}
            </span>
          </div>

          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="divide-y divide-slate-100">
              {logs.map(log => (
                <div key={log.id} className="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-slate-50 text-xs">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-slate-900">{log.operacao}</span>
                      <span className="text-slate-400">•</span>
                      <span className="text-emerald-700 font-semibold">{log.usuarioNome}</span>
                    </div>
                    <p className="text-slate-600 mt-0.5">{log.detalhes}</p>
                  </div>

                  <div className="text-[11px] font-mono text-slate-400 self-end sm:self-center">
                    {new Date(log.timestamp).toLocaleString('pt-BR')}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
